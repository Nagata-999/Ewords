#question{display:inline-block;min-width:190px;padding:12px 24px;border-radius:22px;background:rgba(15,23,42,.9);border:1px solid rgba(255,255,255,.18);font-size:clamp(26px,5.5vw,46px);font-weight:1000;box-shadow:0 0 35px rgba(96,165,250,.25)}

.bonusShow{animation:bonusAnim .9s ease}@keyframes bonusAnim{0%{opacity:0;transform:translateX(-50%) scale(.4)}30%{opacity:1;transform:translateX(-50%) scale(1.2)}100%{opacity:0;transform:translateX(-50%) translateY(-110px) scale(1)}}

const game=document.getElementById('game'),road=document.getElementById('road'),player=document.getElementById('player'),trail=document.getElementById('trail'),questionEl=document.getElementById('question'),nextQuestionEl=document.getElementById('nextQuestion'),comboText=document.getElementById('comboText'),bonusText=document.getElementById('bonusText'),hitEffect=document.getElementById('hitEffect'),bgm=document.getElementById('bgm'),boostBtn=document.getElementById('boostBtn'),boostFill=document.getElementById('boostFill'),leftBtn=document.getElementById('leftBtn'),rightBtn=document.getElementById('rightBtn'),leftBtn2=document.getElementById('leftBtn2'),rightBtn2=document.getElementById('rightBtn2');

let lane=1,distance=0,combo=0,speed=1,life=3,best=Number(localStorage.getItem('wordrush_best_distance')||0),activeChoices=[],gameRunning=false,animationFrame=null,lineOffset=0,hitLocked=false,walkFrame=0,playerState='walk',fever=0,audioCtx=null,boostHeld=false,boostCharge=0,superReady=false,lastSaved=false;

function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
function tone(f,d,t='sine',g=.05){if(!audioCtx)return;const o=audioCtx.createOscillator(),ga=audioCtx.createGain();o.type=t;o.frequency.setValueAtTime(f,audioCtx.currentTime);ga.gain.setValueAtTime(g,audioCtx.currentTime);ga.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(ga);ga.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}
function playMoveSound(){tone(280,.035,'square',.025)}function playHitSound(){tone(660,.055,'triangle',.05);setTimeout(()=>tone(990,.06,'triangle',.045),45)}function playMissSound(){tone(180,.12,'sawtooth',.055);setTimeout(()=>tone(95,.18,'sawtooth',.045),70)}function playComboSound(){tone(740,.06,'square',.04);setTimeout(()=>tone(980,.06,'square',.04),55)}function playFeverSound(){tone(520,.08,'sawtooth',.05);setTimeout(()=>tone(780,.08,'sawtooth',.05),80);setTimeout(()=>tone(1040,.12,'sawtooth',.05),160)}
function startBgm(){bgm.volume=.45;bgm.currentTime=0;bgm.play().catch(()=>{})}function stopBgm(){bgm.pause();bgm.currentTime=0}

function pool(){return WORDS}
function updateHUD(){document.getElementById('distance').textContent=Math.floor(distance)+'m';document.getElementById('combo').textContent=combo;document.getElementById('life').textContent='❤'.repeat(Math.max(0,life));boostFill.style.width=Math.max(0,Math.min(100,boostCharge))+'%';boostBtn.classList.toggle('ready',boostCharge>=100)}
function startGame(){initAudio();startBgm();if(animationFrame)cancelAnimationFrame(animationFrame);document.getElementById('overlay').style.display='none';distance=0;combo=0;speed=1;life=3;lane=1;lineOffset=0;hitLocked=false;currentWord=null;nextWord=null;gameRunning=true;fever=0;boostHeld=false;boostCharge=0;superReady=false;lastSaved=false;game.className='';road.className='';player.style.left=lanePositions[lane]+'%';trail.style.left=lanePositions[lane]+'%';playerState='walk';clearChoices();updateHUD();spawnQuestion();animate()}
function clearChoices(){activeChoices.forEach(o=>o.el.remove());activeChoices=[];hitLocked=false}
function pickWord(){
  const p=pool();
  return p[Math.floor(Math.random()*p.length)];
}
function setQuestionText(){
  questionEl.textContent=currentWord.jp;
  nextQuestionEl.textContent=nextWord.jp;
  questionEl.classList.remove('questionSwap');
  void questionEl.offsetWidth;
  questionEl.classList.add('questionSwap');
}
function spawnQuestion(){
  if(!gameRunning)return;
  clearChoices();
  if(!currentWord) currentWord=pickWord();
  if(!nextWord) nextWord=pickWord();
  const correct=currentWord;
  setQuestionText();
  const p=pool();
  const distractors=shuffle(p.filter(w=>w.en!==correct.en)).slice(0,2);
  const answers=shuffle([correct,...distractors]);
  answers.forEach((item,i)=>{
    const div=document.createElement('div');
    div.className='choice';
    if(item.en.length>10)div.classList.add('long');
    div.textContent=item.en;
    div.style.left=lanePositions[i]+'%';
    div.style.top='120px';
    road.appendChild(div);
    activeChoices.push({el:div,lane:i,y:120,correct:item.en===correct.en,hit:false});
  });
  currentWord=nextWord;
  nextWord=pickWord();
}
function updateTheme(){const themes=['theme-park','theme-city','theme-highway','theme-snow','theme-lava'];const idx=Math.floor(distance/5000)%themes.length;themes.forEach(t=>{game.classList.remove(t);road.classList.remove(t)});game.classList.add(themes[idx]);road.classList.add(themes[idx])}

function isPC(){
  return window.matchMedia('(min-width: 701px)').matches;
}

function animate(){if(!gameRunning)return;
const boostOn=boostHeld;
const runSpeed=speed*(boostOn?1.25:1);
lineOffset+=12*runSpeed;
distance+=runSpeed*(game.classList.contains('fever')?0.75:.32);
updateTheme();updateHUD();document.querySelectorAll('.road-line').forEach(e=>e.remove());for(let i=-1;i<14;i++){const line=document.createElement('div');line.className='road-line';line.style.top=((i*120+lineOffset)%1600)-100+'px';road.appendChild(line)}activeChoices.forEach(obj=>{
const choiceSpeed = isPC() ? 1.45 : 1.55;
obj.y += choiceSpeed * runSpeed;
obj.el.style.top=obj.y+'px';
if(!hitLocked&&!obj.hit&&obj.lane===lane&&isColliding(obj.el,player)){
  obj.hit=true;
  hitLocked=true;
  obj.correct?success(obj):fail(obj);
}
if(!obj.hit&&obj.y>window.innerHeight+120)obj.el.remove();
});if(fever>0){fever--;if(fever<=0)game.classList.remove('fever')}animationFrame=requestAnimationFrame(animate)}
function isColliding(a,b){
  const r1=a.getBoundingClientRect();
  const r2=b.getBoundingClientRect();
  const pad=8;
  return !(
    r1.right < r2.left + pad ||
    r1.left > r2.right - pad ||
    r1.bottom < r2.top + pad ||
    r1.top > r2.bottom - pad
  );
}

function showHit(text,type){hitEffect.textContent=text;hitEffect.className='';void hitEffect.offsetWidth;hitEffect.classList.add(type==='fever'?'hitFever':type==='good'?'hitGood':'hitBad')}
function burst(x,y,color){for(let i=0;i<18;i++){const p=document.createElement('div');p.className='particle';p.style.left=x+'px';p.style.top=y+'px';p.style.background=color;const a=Math.random()*Math.PI*2,d=45+Math.random()*80;p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',Math.sin(a)*d+'px');game.appendChild(p);setTimeout(()=>p.remove(),500)}}
function activateSuperBoost(){
  if(boostCharge<100 || !gameRunning) return;
  boostCharge=0;
  distance+=1000;
  playFeverSound();
  showHit('+1000m!','fever');
  bonusText.textContent='+1000m SUPER!';
  bonusText.classList.remove('bonusShow');
  void bonusText.offsetWidth;
  bonusText.classList.add('bonusShow');
  fever=180;
  game.classList.add('fever');
  updateHUD();
}

function success(obj){playHitSound();const rect=obj.el.getBoundingClientRect();obj.el.classList.add('good');burst(rect.left+rect.width/2,rect.top+rect.height/2,'#facc15');showHit(combo>=9?'BREAK!':'HIT!','good');player.classList.add('dash');setTimeout(()=>player.classList.remove('dash'),120);distance+=(18+combo*2)*(game.classList.contains('fever')?2:1);if(boostHeld){boostCharge=Math.min(100,boostCharge+4)}combo++;if(combo%5===0){speed+=.06;playComboSound();comboText.textContent=combo+' COMBO!';comboText.classList.remove('comboShow');void comboText.offsetWidth;comboText.classList.add('comboShow')}if(combo>0&&combo%10===0){playFeverSound();fever=300;game.classList.add('fever');showHit('FEVER!','fever');const bonus=100+combo*10;distance+=bonus;bonusText.textContent='+'+bonus+'m BONUS!';bonusText.classList.remove('bonusShow');void bonusText.offsetWidth;bonusText.classList.add('bonusShow')}updateHUD();setTimeout(()=>spawnQuestion(),230)}
function fail(obj){playMissSound();if(obj)obj.el.classList.add('bad');const rect=obj?obj.el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};burst(rect.left+rect.width/2,rect.top+rect.height/2,'#fb7185');setPlayerMiss();showHit('CRASH!','bad');combo=0;speed=1;fever=0;game.classList.remove('fever');life--;road.classList.remove('shake');void road.offsetWidth;road.classList.add('shake');updateHUD();if(life<=0){setTimeout(gameOver,350);return}setTimeout(()=>spawnQuestion(),380)}

async function loadRanking(){
  const box=document.getElementById('rankingList');
  if(!box) return;
  if(!supabaseClient){box.innerHTML='<div class="rankingTitle">RANKING</div><div class="statusLine">ランキング未接続</div>';return;}
  const {data,error}=await supabaseClient
    .from('scores')
    .select('player_name,score,max_combo,accuracy,mode,created_at')
    .eq('mode','wordrush')
    .order('score',{ascending:false})
    .limit(10);
  if(error){box.innerHTML='<div class="rankingTitle">RANKING</div><div class="statusLine">読み込み失敗</div>';return;}
  const rows=(data||[]).map((r,i)=>`<div class="rankingRow"><div>#${i+1}</div><div>${escapeHtml(r.player_name||'NO NAME')}</div><div>${Math.floor(r.score)}m</div></div>`).join('');
  box.innerHTML='<div class="rankingTitle">RANKING</div>'+(rows||'<div class="statusLine">まだ記録なし</div>');
}

async function saveRanking(){
  if(lastSaved) return;
  const input=document.getElementById('playerName');
  const status=document.getElementById('saveStatus');
  const name=(input?.value||'').trim().slice(0,20);
  if(!name){status.textContent='名前を入力してね';return;}
  if(!supabaseClient){status.textContent='Supabase未接続';return;}
  status.textContent='保存中...';
  const payload={player_name:name,score:Math.floor(distance),max_combo:combo,accuracy:0,mode:'wordrush'};
  let error=null;
  try{
    const res=await supabaseClient.rpc('save_high_score',{
      p_player_name:name,
      p_score:Math.floor(distance),
      p_max_combo:combo,
      p_accuracy:0,
      p_mode:'wordrush'
    });
    error=res.error;
    if(error){
      const fallback=await supabaseClient.from('scores').insert(payload);
      error=fallback.error;
    }
  }catch(e){
    const fallback=await supabaseClient.from('scores').insert(payload);
    error=fallback.error;
  }
  if(error){status.textContent='保存失敗：Supabase設定を確認';return;}
  lastSaved=true;
  status.textContent='保存しました';
  await loadRanking();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function shuffle(arr){return[...arr].sort(()=>Math.random()-.5)}
