<style>

.jp-box{margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10);color:#dbeafe;font-size:15px;line-height:1.7}.jp-box strong{color:#fde68a}.progress{margin:12px 0}.progress-top{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:5px}.bar{height:14px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.12)}.fill{height:100%;width:0%;background:linear-gradient(90deg,#86efac,#38bdf8,#6366f1);transition:width .08s}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:900;cursor:pointer;color:#fff;background:linear-gradient(180deg,#2563eb,#1d4ed8)}.btn.secondary{background:linear-gradient(180deg,#475569,#334155)}.btn.green{background:linear-gradient(180deg,#16a34a,#15803d)}.hint{color:var(--muted);font-size:14px;line-height:1.6;margin-top:10px}.result{font-size:20px;color:var(--warn);font-weight:1000;min-height:30px;margin-top:10px;text-align:center}.hidden-input{position:absolute;left:-9999px;opacity:0}.side-block{background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px;margin-bottom:10px}.side-title{font-weight:1000;color:#bae6fd;margin-bottom:8px}.save-row{display:grid;grid-template-columns:1fr auto;gap:8px}.name-input{width:100%;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);color:#fff;padding:11px 14px;font-size:15px}.small{color:var(--muted);font-size:13px;line-height:1.6}.ranking-row{display:grid;grid-template-columns:34px 1fr 70px 54px;gap:6px;padding:7px 3px;border-bottom:1px solid rgba(255,255,255,.08);align-items:center;font-size:13px}.ranking-row.header{color:var(--muted);font-weight:900}.queue{display:flex;flex-direction:column;gap:6px;max-height:250px;overflow:auto}.chip{padding:8px;border-radius:10px;background:rgba(255,255,255,.08);font-size:13px;line-height:1.35}.chip.current{border:1px solid rgba(253,230,138,.38);color:#fff}.chip-jp{display:block;color:#cbd5e1;font-size:12px;margin-top:3px}.overlay{position:fixed;inset:0;background:rgba(2,6,23,.74);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal{width:min(100%,420px);padding:20px;border-radius:22px;background:rgba(15,23,42,.94);border:1px solid rgba(255,255,255,.16);text-align:center}.modal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.box{background:rgba(255,255,255,.08);border-radius:14px;padding:12px}.box .k{font-size:12px;color:var(--muted)}.box .v{font-size:24px;font-weight:1000}.countdown{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:76px;font-weight:1000;color:#fde68a;text-shadow:0 0 24px rgba(253,230,138,.65);z-index:10;background:rgba(2,6,23,.58);border-radius:20px}.shake{animation:shake .15s linear}.pop{animation:pop .35s ease}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}@keyframes pop{0%{transform:scale(.99)}50%{transform:scale(1.012)}100%{transform:scale(1)}}

<body>
<div class="app">
  <div class="top">
    <h1>すしタイプ</h1>
    <p>テンプレート、使える表現、英単語をタイムアタックで練習。<br><a href="/">← すし単トップへ戻る</a></p>
  </div>
  <div class="mode-grid">
    <button class="mode-btn active" data-dataset="essayTemplate">テンプレート<span>全文を一気に打ち切る</span></button>
    <button class="mode-btn" data-dataset="task1Expressions">TASK1表現<span>IELTSグラフ描写</span></button>
    <button class="mode-btn" data-dataset="eikenExpressions">英検表現<span>英作文で使える文</span></button>
    <button class="mode-btn" data-dataset="academicExpressions">汎用表現<span>意見・理由・結果</span></button>
    <button class="mode-btn" data-dataset="wordSet">単語<span>重要語を高速反復</span></button>
  </div>
  <div class="panel hud">
    <div class="stat"><div class="label">Mode</div><div class="value" id="modeValue" style="font-size:18px">テンプレート</div></div>
    <div class="stat"><div class="label">Time</div><div class="value"><span id="timeValue">0.0</span>s</div></div>
    <div class="stat"><div class="label">Score</div><div class="value" id="scoreValue">0</div></div>
    <div class="stat"><div class="label">Accuracy</div><div class="value"><span id="accuracyValue">100</span>%</div></div>
    <div class="stat"><div class="label">Words</div><div class="value" id="clearedValue">0</div></div>
  </div>
  <div class="layout">
    <div class="panel main" id="mainCard" style="position:relative">
      <div class="countdown" id="countdownOverlay">3</div>
      <div id="promptBox" class="target" tabindex="0"></div>
      <div id="jpBox" class="jp-box"></div>
      <textarea id="hiddenInput" class="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
      <div class="progress"><div class="progress-top"><span>Progress</span><span id="progressText">0%</span></div><div class="bar"><div class="fill" id="progressFill"></div></div></div>
      <div class="controls"><button class="btn" id="startBtn">Start / Focus</button><button class="btn secondary" id="resetBtn">Reset</button><button class="btn secondary" id="skipBtn">Skip</button></div>
      <div class="hint" id="hintText">SキーまたはStartで開始。スマホではStartを押してから入力してください。</div>
      <div class="result" id="resultText"></div>
    </div>
    <div class="panel side">
      <div class="side-block"><div class="side-title">Save Score</div><div class="save-row"><input id="playerNameInput" class="name-input" placeholder="Player name" maxlength="20"><button class="btn green" id="saveBtn">Save</button></div><div class="small" id="saveStatus">プレイ後に保存できます。</div></div>
      <div class="side-block"><div class="side-title">Ranking</div><div id="rankingList" class="small">Loading...</div></div>
      <div class="side-block"><div class="side-title">Queue</div><div id="queueList" class="queue"></div></div>
      <div class="side-block"><div class="side-title">説明</div><div class="small" id="descText"></div></div>
    </div>
  </div>
</div>
<div class="overlay" id="resultOverlay"><div class="modal"><h2 id="resultTitle">Time Up!</h2><div class="modal-grid"><div class="box"><div class="k">Score</div><div class="v" id="finalScore">0</div></div><div class="box"><div class="k">Accuracy</div><div class="v" id="finalAccuracy">0%</div></div><div class="box"><div class="k">Words</div><div class="v" id="finalCleared">0</div></div><div class="box"><div class="k">Max Combo</div><div class="v" id="finalMaxCombo">0</div></div></div><button class="btn" id="againBtn">もう一回</button> <button class="btn secondary" id="closeResultBtn">閉じる</button></div></div>
<script>
const SUPABASE_URL="https://ykrjocftuflnkubaxrza.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_R3ff2RuU9WOU8pbj5SxvLg_R8ZW6EhP";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const SCORE_MODE_PREFIX="typing_game";

const essayTemplateText=`Recently, artificial intelligence has become a controversial issue. Some people think it is beneficial, while others disagree. In my opinion, it has more positive effects.
One reason is that AI can make our work more efficient. For example, students can use AI tools to check their writing quickly and save time.
On the other hand, some people think that people may rely too much on AI. For instance, students may stop thinking deeply when they use AI for their homework.
However, these problems can be reduced if people use AI responsibly and set clear rules, so they are not as serious as they seem.
In conclusion, the advantages of AI outweigh its disadvantages because the benefits are more significant and the risks can be controlled.`;

const datasets={
 essayTemplate:{label:"テンプレート",type:"full",description:"テンプレート全文を一気に打ち切り、完走タイムを競います。スコアは1単語完成ごとに入ります。",items:[{en:essayTemplateText,jp:"英作文の基本テンプレート全文。全文を最初から最後まで打ち切ります。"}]},
 task1Expressions:{label:"TASK1表現",type:"items",description:"IELTS Task 1 のグラフ・表・割合説明で使える英文です。",items:[

  {en:"There was a significant increase in the number of online shoppers.",jp:"オンライン買い物客数は大きく増加した。"},
  {en:"The figure rose gradually from 20 percent to 45 percent.",jp:"その数値は20%から45%まで徐々に上昇した。"},
  {en:"The number peaked at approximately 80,000 in 2018.",jp:"その数値は2018年に約8万人でピークに達した。"},

  {en:"Coal accounted for the largest proportion of energy production.",jp:"石炭はエネルギー生産の最大割合を占めた。"},
  {en:"The percentage doubled over the ten-year period.",jp:"その割合は10年間で2倍になった。"},
  {en:"This was followed by a moderate increase in public spending.",jp:"これに続いて公共支出が緩やかに増加した。"},
  {en:"Meanwhile, the number of tourists fluctuated slightly.",jp:"一方で、観光客数はわずかに変動した。"},
  {en:"The trend fluctuated slightly during the first half of the year.",jp:"その傾向は年の前半にわずかに変動した。"},

 ]},
 eikenExpressions:{label:"英検表現",type:"items",description:"英検英作文・意見論述で使いやすい英文です。",items:[
  {en:"The government should take action to reduce environmental problems.",jp:"政府は環境問題を減らすために行動を起こすべきだ。"},
  {en:"It has positive effects on children's communication skills.",jp:"それは子どものコミュニケーション能力に良い影響を与える。"},

 ]},
 wordSet:{label:"単語",type:"words",description:"重要語を単語単位で高速に打ちます。日本語も表示されます。",items:[
  {en:"beneficial",jp:"有益な"},{en:"controversial",jp:"議論を呼ぶ"},{en:"efficient",jp:"効率的な"},{en:"responsibly",jp:"責任を持って"},{en:"advantages",jp:"利点"},{en:"disadvantages",jp:"欠点"},{en:"significant",jp:"重要な、大きな"},{en:"potential",jp:"潜在的な"},{en:"environmental",jp:"環境の"},{en:"communication",jp:"意思疎通"},{en:"transportation",jp:"交通"},{en:"development",jp:"発達、発展"},{en:"generation",jp:"世代"},{en:"education",jp:"教育"},{en:"technology",jp:"技術"},{en:"community",jp:"地域社会"},{en:"proportion",jp:"割合"},{en:"illustrate",jp:"示す"},{en:"increase",jp:"増加する"},{en:"decrease",jp:"減少する"},{en:"gradually",jp:"徐々に"},{en:"steadily",jp:"着実に"},{en:"dramatically",jp:"劇的に"},{en:"approximately",jp:"およそ"},{en:"fluctuate",jp:"変動する"},{en:"account",jp:"占める、説明する"},{en:"compare",jp:"比較する"},{en:"overall",jp:"全体として"},{en:"contrast",jp:"対照"},{en:"renewable",jp:"再生可能な"},{en:"consumption",jp:"消費"},{en:"revenue",jp:"収入"},{en:"rural",jp:"地方の"},{en:"stable",jp:"安定した"},{en:"decline",jp:"減少"},{en:"peak",jp:"ピークに達する"},{en:"ignore",jp:"無視する"},{en:"reliable",jp:"信頼できる"},{en:"cooperation",jp:"協力"},{en:"responsibility",jp:"責任"}
 ]}
};

const $=id=>document.getElementById(id);
const els={promptBox:$("promptBox"),hiddenInput:$("hiddenInput"),jpBox:$("jpBox"),timeValue:$("timeValue"),scoreValue:$("scoreValue"),accuracyValue:$("accuracyValue"),clearedValue:$("clearedValue"),modeValue:$("modeValue"),progressText:$("progressText"),progressFill:$("progressFill"),queueList:$("queueList"),descText:$("descText"),resultText:$("resultText"),mainCard:$("mainCard"),countdownOverlay:$("countdownOverlay"),saveStatus:$("saveStatus"),playerNameInput:$("playerNameInput"),rankingList:$("rankingList"),resultOverlay:$("resultOverlay")};
let currentKey="essayTemplate", current=datasets[currentKey];
const state={started:false,finished:false,countdown:false,queue:[],currentItem:null,currentPrompt:"",typed:"",timeLeft:60,score:0,cleared:0,total:0,correct:0,combo:0,maxCombo:0,timerId:null,startStamp:0,wordEnds:[],scoredWordIndex:0};
function normalizeText(text){return String(text).replace(/\s+/g," ").trim()}
function isFullTemplateMode(){return current.type==="full"}
function shuffle(a){const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]]}return c}
function scoreMode(){return `${SCORE_MODE_PREFIX}_${currentKey}_timeAttack`}
function acc(){return state.total?state.correct/state.total*100:100}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;")}
function getWordEndPositions(text){const ends=[];let m;const re=/[A-Za-z']+/g;while((m=re.exec(text))!==null)ends.push(m.index+m[0].length);return ends}
function prepareItems(){return current.type==="full"?[current.items[0]]:shuffle(current.items)}
function setPrompt(item){state.currentItem=item||null;state.currentPrompt=item?normalizeText(item.en):"";state.typed="";state.wordEnds=getWordEndPositions(state.currentPrompt);state.scoredWordIndex=0;els.hiddenInput.value="";els.jpBox.innerHTML=item?`<strong>日本語：</strong>${escapeHtml(item.jp)}`:""}
function awardCompletedWords(){while(state.scoredWordIndex<state.wordEnds.length&&state.typed.length>=state.wordEnds[state.scoredWordIndex]){state.scoredWordIndex++;state.cleared++;state.combo++;state.maxCombo=Math.max(state.maxCombo,state.combo);state.score+=10+Math.min(20,state.combo)}}
function renderPrompt(){const t=state.currentPrompt||"SキーまたはStartで開始";let out="";for(let i=0;i<t.length;i++){let cls="char";if(i<state.typed.length)cls+=state.typed[i]===t[i]?" done":" error";else if(i===state.typed.length&&state.started&&!state.finished)cls+=" current";out+=`<span class="${cls}">${escapeHtml(t[i])}</span>`}els.promptBox.innerHTML=out;const pct=t?Math.min(100,state.typed.length/t.length*100):0;els.progressFill.style.width=pct+"%";els.progressText.textContent=Math.round(pct)+"%"}
function renderQueue(){els.queueList.innerHTML="";[state.currentItem,...state.queue.slice(0,8)].filter(Boolean).forEach((item,i)=>{const d=document.createElement("div");d.className="chip"+(i===0?" current":"");d.innerHTML=`${i===0?"▶ ":""}${escapeHtml(item.en)}<span class="chip-jp">${escapeHtml(item.jp)}</span>`;els.queueList.appendChild(d)})}
function updateHud(){const elapsed=state.startStamp?(performance.now()-state.startStamp)/1000:0;els.timeValue.textContent=isFullTemplateMode()?elapsed.toFixed(1):state.timeLeft.toFixed(1);els.scoreValue.textContent=Math.round(state.score);els.accuracyValue.textContent=acc().toFixed(0);els.clearedValue.textContent=state.cleared;els.modeValue.textContent=current.label}
function reset(){clearInterval(state.timerId);const list=prepareItems();Object.assign(state,{started:false,finished:false,countdown:false,queue:list,currentItem:null,currentPrompt:"",typed:"",timeLeft:60,score:0,cleared:0,total:0,correct:0,combo:0,maxCombo:0,timerId:null,startStamp:0,wordEnds:[],scoredWordIndex:0});setPrompt(state.queue.shift());els.resultText.textContent="";els.descText.textContent=current.description+"\nRanking key: "+scoreMode();els.saveStatus.textContent="プレイ後に保存できます。";updateHud();renderPrompt();renderQueue();loadRanking()}
function setDataset(key){currentKey=key;current=datasets[key];document.querySelectorAll(".mode-btn").forEach(b=>b.classList.toggle("active",b.dataset.dataset===key));reset()}
function focusInput(){els.hiddenInput.focus()}
function startCountdown(){if(state.started||state.finished||state.countdown)return;state.countdown=true;let n=3;els.countdownOverlay.style.display="flex";els.countdownOverlay.textContent=n;const id=setInterval(()=>{n--;if(n>0)els.countdownOverlay.textContent=n;else if(n===0)els.countdownOverlay.textContent="GO!";else{clearInterval(id);els.countdownOverlay.style.display="none";state.countdown=false;startTimer()}},650)}
function startTimer(){state.started=true;state.startStamp=performance.now();focusInput();state.timerId=setInterval(()=>{const elapsed=(performance.now()-state.startStamp)/1000;if(!isFullTemplateMode()){state.timeLeft=Math.max(0,60-elapsed);if(state.timeLeft<=0)finish(false)}updateHud()},50);renderPrompt()}
function finish(completed=false){if(state.finished)return;state.finished=true;clearInterval(state.timerId);els.hiddenInput.blur();const elapsed=state.startStamp?(performance.now()-state.startStamp)/1000:0;$("resultTitle").textContent=completed?"Completed!":"Time Up!";els.resultText.textContent=completed?`COMPLETE! Time ${elapsed.toFixed(1)}s / Score ${Math.round(state.score)} / Accuracy ${acc().toFixed(1)}%`:`TIME UP! Score ${Math.round(state.score)} / Accuracy ${acc().toFixed(1)}%`;$("finalScore").textContent=Math.round(state.score);$("finalAccuracy").textContent=acc().toFixed(1)+"%";$("finalCleared").textContent=state.cleared;$("finalMaxCombo").textContent=state.maxCombo;els.resultOverlay.style.display="flex"}
function nextPrompt(skip=false){if(skip){state.combo=0;state.score=Math.max(0,state.score-5)}setPrompt(state.queue.shift());if(!state.currentPrompt){finish(true);return}els.resultText.textContent=skip?"スキップしました。":"NEXT!";updateHud();renderPrompt();renderQueue();els.mainCard.classList.remove("pop");void els.mainCard.offsetWidth;els.mainCard.classList.add("pop")}
function handleKey(e){if(e.key==="s"&&!state.started&&!state.countdown){e.preventDefault();startCountdown();return}if(!state.started||state.finished||state.countdown)return;if(e.key==="Backspace"){e.preventDefault();state.typed=state.typed.slice(0,-1);renderPrompt();return}if(e.key.length!==1)return;e.preventDefault();const expected=state.currentPrompt[state.typed.length]||"";state.total++;if(e.key===expected){state.correct++;state.typed+=e.key;awardCompletedWords()}else{state.combo=0;state.score=Math.max(0,state.score-2);els.mainCard.classList.remove("shake");void els.mainCard.offsetWidth;els.mainCard.classList.add("shake")}if(state.typed===state.currentPrompt){if(isFullTemplateMode())finish(true);else nextPrompt(false)}else{updateHud();renderPrompt()}}
async function saveScore(){const name=els.playerNameInput.value.trim()||"anonymous";if(state.score<=0){els.saveStatus.textContent="Scoreが0です。まずプレイしてください。";return}$("saveBtn").disabled=true;els.saveStatus.textContent="Saving...";const {error}=await supabaseClient.rpc("save_high_score",{p_player_name:name,p_score:Math.round(state.score),p_max_combo:state.maxCombo||state.cleared,p_accuracy:Math.round(acc()),p_mode:scoreMode()});$("saveBtn").disabled=false;if(error){console.error(error);els.saveStatus.textContent="Save failed. RPC / RLS settingsを確認してください。";return}els.saveStatus.textContent=`Saved as ${name}.`;loadRanking()}
async function loadRanking(){els.rankingList.textContent="Loading...";const {data,error}=await supabaseClient.from("scores").select("player_name,score,max_combo,accuracy,mode").eq("mode",scoreMode()).order("score",{ascending:false}).limit(20);if(error){console.error(error);els.rankingList.textContent="Ranking load failed.";return}if(!data||!data.length){els.rankingList.textContent="No scores yet.";return}els.rankingList.innerHTML=`<div class="ranking-row header"><div>#</div><div>Name</div><div>Score</div><div>Acc</div></div>`+data.map((r,i)=>`<div class="ranking-row"><div>${i+1}</div><div>${escapeHtml(r.player_name||"anonymous")}</div><div>${r.score}</div><div>${Number(r.accuracy||0).toFixed(0)}%</div></div>`).join("")}
document.querySelectorAll(".mode-btn").forEach(b=>b.addEventListener("click",()=>setDataset(b.dataset.dataset)));$("startBtn").addEventListener("click",()=>{startCountdown();focusInput()});$("resetBtn").addEventListener("click",reset);$("skipBtn").addEventListener("click",()=>{if(!state.started)startCountdown();else nextPrompt(true)});$("saveBtn").addEventListener("click",saveScore);$("againBtn").addEventListener("click",()=>{els.resultOverlay.style.display="none";reset();startCountdown()});$("closeResultBtn").addEventListener("click",()=>els.resultOverlay.style.display="none");els.promptBox.addEventListener("click",focusInput);els.hiddenInput.addEventListener("keydown",handleKey);window.addEventListener("keydown",e=>{if(e.target===els.playerNameInput)return;if(e.target!==els.hiddenInput){focusInput();handleKey(e)}});els.playerNameInput.addEventListener("keydown",e=>{if(e.key==="Enter")saveScore()});reset();
</script>
</body>
