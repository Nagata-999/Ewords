const STAGE_LABELS=["状況","問題","行動","要約"];
let state=JSON.parse(localStorage.getItem("sushikan_v15")||"{}");
let current=null,idx=0,earned=0,roundQuestions=[],roundWordSets=[];

const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function show(id){["home","dex","game","result"].forEach(x=>$(x).classList.toggle("active",x===id))}
function topicState(title){return state[title]||{stars:0,plays:0}}
function stars(title){return topicState(title).stars||0}
function plays(title){return topicState(title).plays||0}
function rank(v){return v>=25?"gold":v>=10?"purple":v>=3?"red":v>=1?"blue":""}
function rankName(v){return v>=25?"👑 MASTER":v>=10?"🟣 熟練":v>=3?"🔴 成長":v>=1?"🔵 発見":"未発見"}
function updateStats(){
 const collected=TOPICS.filter(t=>stars(t.title)>0).length;
 const totalStars=TOPICS.reduce((s,t)=>s+stars(t.title),0);
 const masters=TOPICS.filter(t=>stars(t.title)>=25).length;
 ["collectedTop","homeRate"].forEach(id=>$(id).textContent=collected);
 ["starsTop","homeStars"].forEach(id=>$(id).textContent=totalStars);
 $("masterTop").textContent=masters;
}
function categoryIcon(cat){return cat==="School"?"📚":cat==="Work"?"💼":cat==="Daily Life"?"🏠":"🌱"}

function renderDex(){
 updateStats();
 const tree=$("tree"); tree.innerHTML="";
 ["School","Work","Daily Life","Science"].forEach(cat=>{
  const items=TOPICS.filter(t=>t.cat===cat);
  const got=items.filter(t=>stars(t.title)>0).length;
  const sec=document.createElement("div"); sec.className="category";
  const head=document.createElement("div"); head.className="categoryTitle";
  head.innerHTML=`<span>${categoryIcon(cat)} ${cat} <small>${got}/${items.length}</small></span><div class="miniProgress"><div style="width:${got/items.length*100}%"></div></div>`;
  const grid=document.createElement("div"); grid.className="grid";
  items.forEach(t=>{
    const v=stars(t.title);
    const card=document.createElement("div");
    card.className="topic "+rank(v);
    card.onclick=()=>startTopic(t);
    card.innerHTML=`<div class="topicIcon">${t.icon}</div><b>${t.title}</b><span class="levelTag">${t.level}</span><div class="starLine">⭐ ${v}</div><div class="rankText">${rankName(v)}</div><div class="deepText">Play ${plays(t.title)} / Sets ${t.wordSets.length} / Q ${t.questionPool.length}</div>`;
    grid.appendChild(card);
  });
  sec.appendChild(head); sec.appendChild(grid); tree.appendChild(sec);
 });
}

function wordCountForLevel(level){
 const lv=String(level||"").toLowerCase();
 if(lv.includes("pre-1") || lv.includes("pre1")) return 7;
 if(lv.includes("grade 2") || lv.includes("grade2")) return 6;
 return 5;
}
function expandWords(baseWords, topic, question){
 const pool=[...(baseWords||[])];
 // 足りない場合は、学習カードや正解文から意味語を少し補う
 (topic.learn||[]).forEach(x=>{
   const w=String(x).split("=")[0].trim();
   if(w && !pool.includes(w)) pool.push(w);
 });
 if(question && question.c && question.c[question.a]){
   String(question.c[question.a]).split(/\s+/).forEach(w=>{
     w=w.replace(/[^A-Za-z-]/g,"");
     if(w.length>=5 && !pool.includes(w)) pool.push(w);
   });
 }
 return pool;
}


function englishQuestion(jp){
 const s=String(jp||"");
 if(s.includes("何が起きて")) return "What's happening?";
 if(s.includes("何について")) return "What is this about?";
 if(s.includes("問題")) return "What is the problem?";
 if(s.includes("必要な情報")) return "What information is needed?";
 if(s.includes("次に何が起き")) return "What will probably happen next?";
 if(s.includes("次に何を")) return "What should they do next?";
 if(s.includes("何をする")) return "What should they do?";
 if(s.includes("なぜ")) return "Why?";
 if(s.includes("どこ")) return "Where is this happening?";
 if(s.includes("だれ") || s.includes("誰")) return "Who is involved?";
 if(s.includes("一番よい要約")) return "Choose the best summary.";
 if(s.includes("要約")) return "Choose the best summary.";
 if(s.includes("理由")) return "What is the reason?";
 if(s.includes("利点")) return "What is one benefit?";
 if(s.includes("特徴")) return "What is one feature?";
 return "Choose the best answer.";
}
function renderSeenWords(words){
 const box=document.getElementById("seenWords");
 if(!box) return;
 box.innerHTML=(words||[]).map(w=>`<span class="seenTag">${w}</span>`).join("");
}

function randomTopic(){startTopic(shuffle(TOPICS)[0])}

function startTopic(t){
 current=t; idx=0; earned=0;
 roundQuestions=shuffle(t.questionPool).slice(0,4);
 // 1プレイ中に同じ語群が続かないよう、先に4セットを重複なしで配る
 roundWordSets=shuffle(t.wordSets).slice(0,4);
 while(roundWordSets.length<4){
   roundWordSets.push(shuffle(t.wordSets)[0]);
 }
 show("game");
 $("gameTitle").textContent=`${t.icon} ${t.title}`;
 $("gameSub").textContent=`語群 ${t.wordSets.length} / 設問 ${t.questionPool.length}。レベル別に5〜7語表示。語群もかぶりにくい`;
 play();
}
function renderStagebar(){
 const bar=$("stagebar"); bar.innerHTML="";
 STAGE_LABELS.forEach((x,i)=>{
   const d=document.createElement("div");
   d.className="dot "+(i<idx?"ok":i===idx?"now":"");
   d.textContent=(i+1)+" "+x;
   bar.appendChild(d);
 });
}
function play(){
 renderStagebar();
 $("feedback").textContent="";
 $("choices").innerHTML="";
 const q=roundQuestions[idx] || shuffle(current.questionPool)[0];
 const baseSet=roundWordSets[idx] || shuffle(current.wordSets)[0];
 const targetCount=wordCountForLevel(current.level);
 const words=shuffle(expandWords(baseSet,current,q)).slice(0,targetCount);
 renderSeenWords([]);
 let k=0;
 function flash(){
  if(k>=words.length){ask(q, words);return}
  $("flashBox").innerHTML=`<div class="word">${words[k++]}</div>`;
  setTimeout(()=>{$("flashBox").innerHTML="";setTimeout(flash,90)},720);
 }
 flash();
}
function ask(q, wordsForDisplay){
 $("flashBox").innerHTML=`<div class="prompt"><span class="jpQ">${q.q}</span><span class="enQ">${englishQuestion(q.q)}</span><small>出た単語から推測しよう</small></div>`;
 renderSeenWords(wordsForDisplay || []);
 $("choices").innerHTML="";
 const order=shuffle(q.c.map((txt,i)=>({txt,i})));
 order.forEach(o=>{
   const b=document.createElement("button");
   b.className="choice";
   b.textContent=o.txt;
   b.onclick=()=>answer(o.i===q.a,b);
   $("choices").appendChild(b);
 });
}
function answer(ok,btn){
 const q=roundQuestions[idx] || current.questionPool[0];
 document.querySelectorAll(".choice").forEach(b=>{
   b.classList.add("disabled");
   if(b.textContent===q.c[q.a]) b.classList.add("correct");
 });
 if(!ok) btn.classList.add("wrong");
 if(ok){earned++; $("feedback").textContent="GOOD!"; $("feedback").style.color="var(--accent)"}
 else{$("feedback").textContent="MISS"; $("feedback").style.color="var(--red)"}
 setTimeout(()=>{idx++; if(idx>=4) finish(); else play();},850);
}
function finish(){
 const before=stars(current.title);
 const rec=topicState(current.title);
 rec.stars=(rec.stars||0)+earned;
 rec.plays=(rec.plays||0)+1;
 state[current.title]=rec;
 localStorage.setItem("sushikan_v15",JSON.stringify(state));
 const after=stars(current.title);
 show("result");
 $("resultTitle").textContent=earned===4?"CLEAR!":"FINISH";
 $("resultStars").textContent="⭐ "+earned;
 $("resultText").textContent=`${current.icon} ${current.title} / 累計⭐ ${after} / ${rankName(after)} / Play ${plays(current.title)}`;
 $("learnCard").innerHTML=`<h3>${current.icon} 学習カード</h3>${current.learn.map(x=>`<span class="tag">${x}</span>`).join("")}<h3 style="margin-top:14px">今回の出題</h3>${roundQuestions.map(q=>`<span class="tag">${q.q}</span>`).join("")}`;
 updateStats();
 if(before===0 && after>0) showDiscovery("✨ NEW TOPIC ✨",`${current.icon} ${current.title}`,"図鑑に新しいトピックが追加されました。");
 else if(before<3 && after>=3) showDiscovery("🔴 UPGRADE",`${current.icon} ${current.title}`,"赤ランクに成長しました。");
 else if(before<10 && after>=10) showDiscovery("🟣 UPGRADE",`${current.icon} ${current.title}`,"紫ランクに成長しました。");
 else if(before<25 && after>=25) showDiscovery("👑 MASTER",`${current.icon} ${current.title}`,"完全習得です。");
}
function showDiscovery(label,title,text){
 $("discLabel").textContent=label; $("discTitle").textContent=title; $("discText").textContent=text;
 $("discovery").classList.add("show");
}
$("startBtn").onclick=()=>{show("dex");renderDex()};
$("homeBtn").onclick=()=>show("home");
$("randomHomeBtn").onclick=randomTopic;
$("randomBtn").onclick=randomTopic;
$("randomResultBtn").onclick=randomTopic;
$("quitBtn").onclick=()=>{show("dex");renderDex()};
$("backDexBtn").onclick=()=>{show("dex");renderDex()};
$("againBtn").onclick=()=>startTopic(current);
$("discBtn").onclick=()=>$("discovery").classList.remove("show");
$("resetBtn").onclick=()=>{if(confirm("ローカル進捗をリセットしますか？")){state={};localStorage.setItem("sushikan_v15","{}");renderDex();updateStats()}};
updateStats();
</script>
