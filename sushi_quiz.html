<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sushi Quiz v2</title>
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff7e8;color:#9a4b08}
#boot{display:grid;place-items:center;min-height:100vh;font-weight:900;font-size:22px;text-align:center;padding:24px}
</style>
</head>
<body><div id="boot">🍣 Sushi Quiz loading…</div>
<script>
(async()=>{
  const V='20260915-BOOT1';
  try{
    const res=await fetch('/sushi_quiz_core.html?v='+V,{cache:'no-store'});
    if(!res.ok) throw new Error('core '+res.status);
    let html=await res.text();

    // Remove the old shared-loader tag so a stale cached URL cannot win.
    html=html.replace(/<script[^>]+src=["'][^"']*sushigacha\/multi-game-lucky-gems\.js[^"']*["'][^>]*><\/script>/gi,'');

    const fresh=`
<script src="/sushigacha/multi-game-lucky-gems.js?v=${V}"><\/script>
<script src="/sushi_quiz_math_literature.js?v=${V}"><\/script>
<script>
window.__sushiQuizBootstrapVersion='${V}';
setTimeout(()=>{
  try{
    const qs=(typeof QUESTIONS!=='undefined'&&Array.isArray(QUESTIONS))?QUESTIONS:[];
    const counts={
      total:qs.length,
      math:qs.filter(q=>q.cat==='Math').length,
      literature:qs.filter(q=>/Literature/i.test(q.cat||'')).length,
      music:qs.filter(q=>/Music/i.test(q.cat||'')).length
    };
    console.info('Sushi Quiz bootstrap',counts);
    const pool=document.getElementById('soloPool')||document.querySelector('[data-pool]');
    if(pool && qs.length) pool.textContent=qs.length;
  }catch(e){console.warn('Sushi Quiz bootstrap diagnostic failed',e);}
},900);
<\/script>`;

    if(/<\/body>/i.test(html)) html=html.replace(/<\/body>/i,fresh+'</body>');
    else html+=fresh;
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML='<div style="padding:24px;text-align:center;font-weight:800">Sushi Quiz failed to load.<br>ページを再読み込みしてください。<br><small>'+String(err)+'</small></div>';
  }
})();
</script>
</body>
</html>
