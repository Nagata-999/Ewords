<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f28c28">
  <title>共通 Reading｜共通テスト英語リーディング練習</title>
  <meta name="description" content="大学入学共通テスト形式のオリジナル英語リーディング問題を、問1から問8まで大問別に無料で練習できます。">
  <link rel="stylesheet" href="css/reading.css?v=20260715-2">
</head>
<body class="libraryPage">
  <div class="libraryWrap">
    <header class="libraryHero">
      <div>
        <a class="backHome" href="../index.html">← 長文練習トップ</a>
        <h1>共通 Reading</h1>
        <p>大学入学共通テスト形式のオリジナル問題を、問1から問8まで大問ごとに練習できます。採点後は根拠と日本語解説を確認できます。</p>
      </div>
      <div class="heroStats" id="heroStats"></div>
    </header>

    <section class="dashboard" id="dashboard"></section>
    <main id="library"><div class="loading">Loading library…</div></main>
  </div>

<script>
'use strict';
const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const resultKey = id => `common_reading_${id}_result`;

function loadResult(id){
  try { return JSON.parse(localStorage.getItem(resultKey(id)) || 'null'); }
  catch { return null; }
}

function render(items){
  items = [...items].filter(item => item.status !== 'hidden').sort((a,b)=>(a.order||0)-(b.order||0));
  const results = items.map(item => ({item, result: loadResult(item.id)}));
  const completed = results.filter(x => x.result).length;
  const totalCorrect = results.reduce((sum,x)=>sum+(x.result?.score||0),0);
  const totalQuestions = results.reduce((sum,x)=>sum+(x.result?.total||0),0);
  const accuracy = totalQuestions ? Math.round(totalCorrect / totalQuestions * 100) : 0;

  document.querySelector('#heroStats').innerHTML = `
    <div class="heroStat"><b>${completed}</b><span>Completed</span></div>
    <div class="heroStat"><b>${accuracy}%</b><span>Overall accuracy</span></div>`;

  document.querySelector('#dashboard').innerHTML = completed ? `
    <div class="dashCard"><span class="dashLabel">Progress</span><b>${completed} / ${items.length}</b><div class="progressTrack"><span style="width:${Math.round(completed/items.length*100)}%"></span></div></div>
    <div class="dashCard"><span class="dashLabel">Total score</span><b>${totalCorrect} / ${totalQuestions}</b><small>この端末に保存されています。</small></div>
    <button class="btn" id="resetProgress">Reset local progress</button>` : `
    <div class="dashIntro"><b>まず1つ解いてみよう。</b><span>結果はこの端末に自動保存されます。</span></div>`;

  document.querySelector('#resetProgress')?.addEventListener('click',()=>{
    if(!confirm('共通 Readingの保存済み進捗をこの端末から削除しますか？')) return;
    Object.keys(localStorage).filter(k=>k.startsWith('common_reading_')).forEach(k=>localStorage.removeItem(k));
    location.reload();
  });

  document.querySelector('#library').innerHTML = `
    <section class="setSection commonQuestionSection">
      <div class="setHead"><h2>大問別練習</h2><span>問1〜問8</span></div>
      <div class="cards commonQuestionCards">
        ${items.map(item => {
          const r = loadResult(item.id);
          const subtitle = item.subtitle || item.description || '';
          return `<a class="card commonQuestionCard ${r?'completed':''}" href="reading.html?id=${encodeURIComponent(item.id)}">
            <div class="cardTop"><span class="cardCode">${esc(item.code || item.id)}</span>${r?'<span class="doneBadge">COMPLETED</span>':''}</div>
            <div class="cardTitle">${esc(item.title)}</div>
            ${subtitle ? `<div class="cardSubtitle">${esc(subtitle)}</div>` : ''}
            <div class="cardMeta">${esc(item.questionCount)}問・目安${esc(item.durationMinutes||10)}分</div>
            ${r ? `<div class="cardResult"><b>${r.score}/${r.total}</b><span>${Math.round(r.score/r.total*100)}%</span></div>` : '<div class="cardStart">練習を始める →</div>'}
          </a>`;
        }).join('')}
      </div>
    </section>`;
}

fetch('data/manifest.json?v=20260715-2',{cache:'no-store'})
  .then(response => {
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    return response.json();
  })
  .then(render)
  .catch(error => {
    document.querySelector('#library').innerHTML = `<div class="errorBox"><b>問題一覧を読み込めませんでした。</b><small>${esc(error.message)}</small></div>`;
  });
</script>
</body>
</html>
