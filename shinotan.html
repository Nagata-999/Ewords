<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>しの単</title></head><body><script>(async()=>{try{const r=await fetch('https://raw.githubusercontent.com/Nagata-999/Ewords/8ae84e1292e300605b27274dfba5e62b66042363%5E/shinotan.html',{cache:'no-store'});if(!r.ok)throw Error(r.status);let h=await r.text();const tracker=`<script>window.__sushiDirectDailyTrackerFor='shino';(()=>{const KEY='sushitan_login_bonus_v1';const day=()=>{const d=new Date();d.setHours(d.getHours()-6);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};function add(){let l={};try{l=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}const q=l.dailyQuests;if(!q||q.day!==day()||!Array.isArray(q.active)||!q.active.includes('shino'))return;q.progress=q.progress&&typeof q.progress==='object'?q.progress:{};q.claimed=q.claimed&&typeof q.claimed==='object'?q.claimed:{};if(q.claimed.shino)return;q.progress.shino=Math.min(20,(Number(q.progress.shino)||0)+1);if(q.progress.shino>=20){q.claimed.shino=true;l.gems=(Number.isSafeInteger(l.gems)?l.gems:0)+5}localStorage.setItem(KEY,JSON.stringify(l));window.dispatchEvent(new CustomEvent('sushi-daily-quest-change'))}document.addEventListener('click',e=>{const b=e.target.closest?.('.balloon[data-type="correct"]');if(!b||b.dataset.shinoDailyCounted==='1')return;b.dataset.shinoDailyCounted='1';add()},true)})();<\/script>`;h=h.replace('<body>','<body>'+tracker);h=h.replace(/sushigacha\/gem-system\.js\?v=[^"']+/g,'sushigacha/gem-system.js?v=20260914-7');document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<p style="font-family:sans-serif;padding:30px">読み込み中にエラーが発生しました。再読み込みしてください。</p>'}})();</script></body></html>
