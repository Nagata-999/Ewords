<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>しの単</title></head><body><script>(async()=>{try{const r=await fetch('https://raw.githubusercontent.com/Nagata-999/Ewords/8ae84e1292e300605b27274dfba5e62b66042363%5E/shinotan.html',{cache:'no-store'});if(!r.ok)throw Error(r.status);let h=await r.text();const tracker=`<script>(()=>{const KEY='sushitan_login_bonus_v1',ACTIVE_KEY='sushitan_daily_active_v1',ALL=['sushitan','shino','antoni','idiom','quiz','talk','world','run'];const day=()=>{const d=new Date();d.setHours(d.getHours()-6);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}function pick(date){let seed=hash('sushitan-daily-'+date),a=[...ALL];for(let i=a.length-1;i>0;i--){seed=(Math.imul(seed,1664525)+1013904223)>>>0;const j=seed%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,4)}function activeFor(today){try{const s=JSON.parse(localStorage.getItem(ACTIVE_KEY)||'null');if(s&&s.day===today&&Array.isArray(s.active)&&s.active.length===4)return s.active}catch(e){}const a=pick(today);localStorage.setItem(ACTIVE_KEY,JSON.stringify({day:today,active:a}));return a}function flash(n){let x=document.getElementById('shinoDailyToast');if(!x){x=document.createElement('div');x.id='shinoDailyToast';x.style.cssText='position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:999999;background:#173f37;color:#fff;padding:9px 14px;border-radius:999px;font:900 12px system-ui;box-shadow:0 6px 18px #0003;pointer-events:none';document.body.appendChild(x)}x.textContent='デイリー しの単 '+n+'/20';clearTimeout(x._t);x._t=setTimeout(()=>x.remove(),1200)}function add(){const today=day(),active=activeFor(today);if(!active.includes('shino'))return;let l={};try{l=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){};let q=l.dailyQuests;if(!q||q.day!==today){q=l.dailyQuests={day:today,active:[...active],progress:{},claimed:{},chestClaimed:false,chestReward:0}}else{q.active=[...active]}q.progress=q.progress&&typeof q.progress==='object'?q.progress:{};q.claimed=q.claimed&&typeof q.claimed==='object'?q.claimed:{};if(q.claimed.shino)return;q.progress.shino=Math.min(20,(Number(q.progress.shino)||0)+1);if(q.progress.shino>=20){q.claimed.shino=true;l.gems=(Number.isSafeInteger(l.gems)?l.gems:0)+5}localStorage.setItem(KEY,JSON.stringify(l));window.dispatchEvent(new CustomEvent('sushi-daily-quest-change'));flash(q.progress.shino)}function hit(e){const b=e.target.closest?.('.balloon[data-type="correct"]');if(!b||b.dataset.shinoDailyCounted==='1')return;b.dataset.shinoDailyCounted='1';add()}document.addEventListener('pointerdown',hit,true);document.addEventListener('click',hit,true)})();<\/script>`;h=h.replace('<body>','<body>'+tracker);h=h.replace(/sushigacha\/gem-system\.js\?v=[^"']+/g,'sushigacha/gem-system.js?v=20260914-8');document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<p style="font-family:sans-serif;padding:30px">読み込み中にエラーが発生しました。再読み込みしてください。</p>'}})();</script></body></html>
