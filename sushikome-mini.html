<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic UI",sans-serif;color:#172033}

textarea{width:100%;min-height:72px;margin-top:10px;border:2px solid #e7c9ab;border-radius:12px;padding:10px;font:inherit;resize:vertical}.send{width:100%;margin-top:7px;background:linear-gradient(135deg,#f4511e,#fb923c);color:white;border:0}.status{text-align:center;min-height:18px;font-size:12px;color:var(--muted);margin:7px 0 0}
button:disabled{opacity:.5}
</style>
</head>

<button class="random" id="random">🎲 ランダム</button></div>
<textarea id="text" maxlength="120" placeholder="自由入力…"></textarea><button class="send" id="send">送信</button><p class="status" id="status"></p></div>
<script>

const status=document.getElementById('status');
async function send(body){
 body=String(body||'').trim();if(!/^\d{4}$/.test(room)){status.textContent='授業コードがありません';return}
 if(!body)return;document.querySelectorAll('button').forEach(b=>b.disabled=true);status.textContent='送信中…';

}
