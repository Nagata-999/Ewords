let state={time:60,score:0,combo:0,maxCombo:0,correct:0,wrong:0,playing:false,current:null,locked:false,last:0};
const $=id=>document.getElementById(id);
const shuffled=a=>[...a].sort(()=>Math.random()-.5);
function init(){ $('playerName').value=localStorage.getItem('sushiIdiomName')||''; $('bestScore').textContent=localStorage.getItem('sushiIdiomBest')||0; updateMastered(); }
function updateMastered(){const m=JSON.parse(localStorage.getItem('sushiIdiomMastery')||'{}'); $('mastered').textContent=Object.values(m).filter(v=>v>=3).length;}
function startGame(){let name=$('playerName').value.trim()||localStorage.getItem('sushiIdiomName')||'GUEST'; localStorage.setItem('sushiIdiomName',name); $('playerName').value=name; state={time:60,score:0,combo:0,maxCombo:0,correct:0,wrong:0,playing:true,current:null,locked:false,last:performance.now()}; $('intro').style.display='none';$('result').style.display='none';$('game').style.display='block';$('gamebox').classList.remove('fever'); renderStats(); nextQ(); requestAnimationFrame(tick);}
function multiplier(){return state.combo>=20?2:state.combo>=10?1.5:state.combo>=5?1.2:1}
function renderStats(){ $('time').textContent=Math.max(0,state.time).toFixed(1);$('score').textContent=state.score.toLocaleString();$('combo').textContent=state.combo;$('mult').textContent='×'+multiplier().toFixed(1);$('timebar').style.width=(Math.max(0,state.time)/60*100)+'%';$('gamebox').classList.toggle('fever',state.combo>=10);}
function tick(t){if(!state.playing)return;let d=(t-state.last)/1000;state.last=t;state.time-=d;if(state.time<=0){state.time=0;renderStats();finish();return}renderStats();requestAnimationFrame(tick)}
function nextQ(){state.locked=false;let pool=QUESTIONS;if(state.current&&pool.length>1){do{state.current=pool[Math.floor(Math.random()*pool.length)]}while(state.current.key===window._lastKey)}else state.current=pool[Math.floor(Math.random()*pool.length)];window._lastKey=state.current.key;let q=state.current;$('qtype').textContent=q.type==='en2jp'?'ENGLISH → JAPANESE':'JAPANESE → ENGLISH';$('prompt').textContent=q.prompt;$('hint').textContent=q.type==='en2jp'?'日本語の意味を選べ':'対応する英語のイディオムを選べ';$('feedback').textContent='';let box=$('choices');box.innerHTML='';shuffled(q.choices).forEach(c=>{let b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(c,b);box.appendChild(b)});}
function answer(choice,btn){if(state.locked||!state.playing)return;state.locked=true;let q=state.current;let ok=choice===q.answer;[...$('choices').children].forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add('good')});let mastery=JSON.parse(localStorage.getItem('sushiIdiomMastery')||'{}');if(ok){state.correct++;state.combo++;state.maxCombo=Math.max(state.maxCombo,state.combo);let gain=Math.round(100*multiplier());state.score+=gain;mastery[q.key]=(mastery[q.key]||0)+1;$('feedback').textContent='⭕ +'+gain+'　'+q.note;if(state.combo%5===0)pop(state.combo+' COMBO!')}else{state.wrong++;state.combo=0;state.time=Math.max(0,state.time-2);btn.classList.add('bad');mastery[q.key]=Math.max(0,(mastery[q.key]||0)-1);$('feedback').textContent='❌ -2秒　'+q.note}localStorage.setItem('sushiIdiomMastery',JSON.stringify(mastery));renderStats();setTimeout(()=>{if(state.playing)nextQ()},650)}
function pop(t){let p=$('comboPop');p.textContent=t;p.classList.remove('show');void p.offsetWidth;p.classList.add('show')}
async function finish(){state.playing=false;$('game').style.display='none';$('result').style.display='block';$('finalScore').textContent=state.score.toLocaleString();$('finalCorrect').textContent=state.correct;$('finalWrong').textContent=state.wrong;$('finalCombo').textContent=state.maxCombo;let best=+(localStorage.getItem('sushiIdiomBest')||0);if(state.score>best){localStorage.setItem('sushiIdiomBest',state.score);$('rankMsg').textContent='🎉 NEW PERSONAL BEST!'}else $('rankMsg').textContent='';updateMastered();await submitScore();loadRanking('today')}
async function submitScore(){if(!dbReady)return;try{const accuracy=(state.correct+state.wrong)?Math.round(state.correct/(state.correct+state.wrong)*100):0;const {error}=await sb.rpc('save_high_score',{p_player_name:(localStorage.getItem('sushiIdiomName')||'GUEST').slice(0,14),p_score:state.score,p_max_combo:state.maxCombo,p_accuracy:accuracy,p_mode:MODE_NAME});if(error)throw error;}catch(e){console.warn(e);$('rankStatus').textContent='ランキング送信に失敗しました。';}}
async function loadRanking(mode='today'){let body=$('rankBody');body.innerHTML='';if(!dbReady){$('rankStatus').textContent='Supabase設定後にランキングが表示されます。';return} $('rankStatus').textContent='読み込み中…';let q=sb.from(SCORE_TABLE).select('player_name,score,max_combo,created_at').eq('mode',MODE_NAME).order('score',{ascending:false}).order('max_combo',{ascending:false}).limit(30);if(mode==='today'){let d=new Date();d.setHours(0,0,0,0);q=q.gte('created_at',d.toISOString())}let {data,error}=await q;if(error){console.warn(error);$('rankStatus').textContent='ランキングを取得できませんでした。';return}$('rankStatus').textContent=mode==='today'?'TODAY RANKING':'ALL TIME RANKING';(data||[]).forEach((r,i)=>{let tr=document.createElement('tr');tr.innerHTML=`<td>${i+1<=3?['🥇','🥈','🥉'][i]:i+1}</td><td></td><td>${Number(r.score).toLocaleString()}</td><td>${r.max_combo||0}</td>`;tr.children[1].textContent=r.player_name||'名無し';body.appendChild(tr)})}
