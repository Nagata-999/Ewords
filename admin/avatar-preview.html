<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アバター描画比較</title><style>body{margin:0;background:#f5f2e8;color:#3e332e;font:15px system-ui}main{padding:16px}select,button{font:inherit;padding:8px;border:1px solid #cac6b8;border-radius:8px;background:white;margin:4px}section{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.tile{background:#fffdf7;border-radius:14px;text-align:center;padding:8px}.tile svg{width:100%;max-width:180px}h2{font-size:18px}p{line-height:1.6}label{display:inline-block}@media(max-width:500px){section{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><script defer src="/sushigacha/avatar.js"></script><script defer src="/sushigacha/avatar-engine.js?v=20261012-b1"></script><script defer src="/admin/avatar-preview.js"></script></head><body><main><p id="status">管理者画面から起動してください。</p><div id="preview" hidden><p>現在のアバターから比較します。ここでの着せ替えはプレビュー専用です。</p><label>衣装<select id="top"></select></label><label>靴<select id="shoes"></select></label><label>動き<select id="action"><option value="idle">待機</option><option value="walk">歩く</option><option value="wave">挨拶</option><option value="sit">座る</option><option value="celebrate">喜ぶ</option></select></label><button id="reset">現在のアバターに戻す</button><h2>B · 素材の陰影と細い輪郭</h2><section id="painted"></section><h2>従来の表示</h2><section id="classic"></section></div></main></body></html>
