<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ｜すし単</title>
  <meta name="description" content="すし単へのお問い合わせページです。ゲームの不具合、ご意見、ご要望はこちらからご連絡ください。">
  <style>
    :root{
      --bg:#fbf4ea;--card:#fffaf2;--line:#f1d7bc;--text:#172033;
      --muted:#64748b;--orange:#f4511e;--teal:#0f766e;
      --shadow:0 14px 34px rgba(15,23,42,.07)
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 18% 8%,rgba(251,146,60,.14),transparent 30%),
        radial-gradient(circle at 86% 12%,rgba(20,184,166,.10),transparent 28%),
        var(--bg);
      color:var(--text)
    }
    main{max-width:760px;margin:0 auto;padding:56px 20px}
    .card{
      background:var(--card);border:1px solid var(--line);border-radius:24px;
      box-shadow:var(--shadow);padding:28px
    }
    h1{margin:0 0 18px;font-size:clamp(30px,5vw,46px)}
    p{line-height:1.9;color:#475569}
    .mail{
      margin:24px 0;padding:18px;border-radius:16px;background:#fff;
      border:1px solid var(--line);text-align:center
    }
    .mail a{
      color:var(--orange);font-weight:900;word-break:break-all;text-decoration:none
    }
    .mail a:hover{text-decoration:underline}
    .back{
      display:inline-block;margin-top:8px;color:var(--teal);
      font-weight:900;text-decoration:none
    }
    .back:hover{text-decoration:underline}
    footer{margin-top:22px;text-align:center;color:var(--muted);font-size:12px}
    footer a{color:var(--teal);font-weight:800;margin:0 6px}
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>お問い合わせ</h1>
      <p>すし単をご利用いただきありがとうございます。</p>
      <p>
        ゲームの不具合、ご意見、ご要望、学校や授業での利用についてのお問い合わせは、
        下記メールアドレスまでご連絡ください。
      </p>
      <div class="mail">
        <a href="mailto:sushisushitantan@gmail.com">sushisushitantan@gmail.com</a>
      </div>
      <p>内容を確認のうえ、必要に応じて返信いたします。</p>
      <a class="back" href="index.html">← トップページへ戻る</a>
    </section>
    <footer>
      © すし単
      <a href="privacy.html">Privacy Policy</a>
      <a href="contact.html">Contact</a>
    </footer>
  </main>
</body>
</html>
