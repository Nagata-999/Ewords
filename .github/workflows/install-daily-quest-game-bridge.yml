name: Install daily quest game bridge

on:
  push:
    paths:
      - '.github/workflows/install-daily-quest-game-bridge.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject direct antoni daily quest tracking
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('antonitan.html')
          text = p.read_text(encoding='utf-8')

          helper = r'''
    // ===== あんとに単 デイリークエスト直結 =====
    function recordAntoniDailyQuest() {
      const KEY='sushitan_login_bonus_v1';
      const ACTIVE_KEY='sushitan_daily_active_v1';
      const GOAL=20, REWARD=5;
      const d=new Date(); d.setHours(d.getHours()-6);
      const today=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      let active=[];
      try {
        const a=JSON.parse(localStorage.getItem(ACTIVE_KEY)||'null');
        if(a&&a.day===today&&Array.isArray(a.active)) active=a.active;
      } catch(e) {}
      if(!active.includes('antoni')) return;

      let l={};
      try { l=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; } catch(e) {}
      let q=l.dailyQuests;
      if(!q||q.day!==today){
        q=l.dailyQuests={day:today,active:[...active],progress:{},claimed:{},chestClaimed:false,chestReward:0};
      } else {
        q.active=[...active];
      }
      q.progress=q.progress&&typeof q.progress==='object'?q.progress:{};
      q.claimed=q.claimed&&typeof q.claimed==='object'?q.claimed:{};
      if(q.claimed.antoni) return;

      q.progress.antoni=Math.min(GOAL,(Number(q.progress.antoni)||0)+1);
      let achieved=false;
      if(q.progress.antoni>=GOAL){
        q.claimed.antoni=true;
        l.gems=(Number.isSafeInteger(l.gems)?l.gems:0)+REWARD;
        achieved=true;
      }
      localStorage.setItem(KEY,JSON.stringify(l));
      window.dispatchEvent(new CustomEvent('sushi-daily-quest-change'));

      let x=document.getElementById('antoniDailyToast');
      if(!x){
        x=document.createElement('div');
        x.id='antoniDailyToast';
        x.style.cssText='position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:1000000;background:#173f37;color:#fff;padding:9px 14px;border-radius:999px;font:900 12px system-ui;box-shadow:0 6px 18px #0003;pointer-events:none;white-space:nowrap';
        document.body.appendChild(x);
      }
      x.textContent=achieved ? '✅ デイリー あんとに単 '+GOAL+'/'+GOAL+'　+'+REWARD+'💎' : 'デイリー あんとに単 '+q.progress.antoni+'/'+GOAL;
      clearTimeout(x._t);
      x._t=setTimeout(()=>x.remove(),1400);
    }
    // ===== デイリークエスト直結ここまで =====
'''

          marker = "    function handleTap(button) {"
          if 'function recordAntoniDailyQuest()' not in text:
              if marker not in text:
                  raise SystemExit('handleTap marker not found')
              text = text.replace(marker, helper + '\n' + marker, 1)

          needle = "        GAME.correctCount += 1;\n        handleComboOnCorrect(now);"
          replacement = "        GAME.correctCount += 1;\n        recordAntoniDailyQuest();\n        handleComboOnCorrect(now);"
          if 'recordAntoniDailyQuest();' not in text:
              if needle not in text:
                  raise SystemExit('correct-answer marker not found')
              text = text.replace(needle, replacement, 1)

          # Keep the normal shared UI scripts, but direct tracking no longer depends on the bridge.
          p.write_text(text, encoding='utf-8')
          print('patched antonitan.html direct correct-answer tracking')
          PY

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add antonitan.html
          git commit -m 'Track antoni daily quest inside correct answer handler'
          git push origin HEAD
