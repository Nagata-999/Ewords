name: Extend direct daily tracking and navigation

on:
  push:
    paths:
      - '.github/workflows/install-daily-quest-game-bridge.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch script
        run: python .github/scripts/patch_daily_rest_world_nav.py
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Complete direct daily tracking and restore world quick quiz'
          git push origin HEAD
