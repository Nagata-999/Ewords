name: Install avatar widget

on:
  push:
    paths:
      - '.github/workflows/install-avatar-widget.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh shared avatar widget
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          targets = [Path('sushitan.html'), Path('sushitype.html')]
          versions = [
              '<script src="sushigacha/avatar-widget.js?v=20260912-1"></script>',
              '<script src="sushigacha/avatar-widget.js?v=20260912-2"></script>',
          ]
          new = '<script src="sushigacha/avatar-widget.js?v=20260912-3"></script>'
          for p in targets:
              text = p.read_text(encoding='utf-8')
              changed = False
              for old in versions:
                  if old in text:
                      text = text.replace(old, new)
                      changed = True
              if 'sushigacha/avatar-widget.js' not in text:
                  if '</body>' not in text:
                      raise SystemExit(f'{p}: </body> not found')
                  text = text.replace('</body>', new + '\n</body>', 1)
                  changed = True
              if changed:
                  p.write_text(text, encoding='utf-8')
                  print(f'{p}: refreshed to v3')
              else:
                  print(f'{p}: already v3')
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sushitan.html sushitype.html
          git commit -m 'Load English avatar reactions'
          git push
