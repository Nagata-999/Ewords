name: Install avatar widget

on:
  push:
    paths:
      - '.github/workflows/install-avatar-widget.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject shared avatar widget
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          targets = [Path('sushitan.html'), Path('sushitype.html')]
          tag = '<script src="sushigacha/avatar-widget.js?v=20260912-1"></script>'
          for p in targets:
              text = p.read_text(encoding='utf-8')
              if 'sushigacha/avatar-widget.js' in text:
                  print(f'{p}: already installed')
                  continue
              if '</body>' not in text:
                  raise SystemExit(f'{p}: </body> not found')
              text = text.replace('</body>', tag + '\n</body>', 1)
              p.write_text(text, encoding='utf-8')
              print(f'{p}: installed')
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sushitan.html sushitype.html
          git commit -m 'Show saved avatar in SushiTan and SushiType'
          git push
