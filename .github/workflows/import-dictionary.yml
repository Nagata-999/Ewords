name: Generate dictionary import
on:
  push:
    branches: [codex/sushi-dictionary-beta]
    paths: [.github/workflows/import-dictionary.yml]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/build-dictionary.py
      - run: python scripts/check-dictionary.py
      - name: Commit generated dictionary pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dictionary data/dictionary-generated.json data/dictionary-build-report.json 404.html
          if ! git diff --cached --quiet; then
            git commit -m 'Generate all 13500 dictionary beta pages'
            git push origin HEAD:codex/sushi-dictionary-beta
          fi
