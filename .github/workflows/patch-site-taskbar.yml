name: Patch Site Taskbar
on:
  push:
    paths:
      - 'scripts/patch_site_taskbar.py'
      - '.github/workflows/patch-site-taskbar.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_site_taskbar.py
      - run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add sushigacha/site-taskbar.js
          git diff --cached --quiet || git commit -m "Fix login bonus reflection"
          git push
