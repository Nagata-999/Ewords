name: TOEIC Question Bank QA
on:
  push:
    paths:
      - 'toeic/index.html'
      - 'toeic/validate-bank.mjs'
      - '.github/workflows/toeic-qa.yml'
  pull_request:
    paths:
      - 'toeic/index.html'
      - 'toeic/validate-bank.mjs'
      - '.github/workflows/toeic-qa.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate TOEIC Part 5 bank
        run: node toeic/validate-bank.mjs
