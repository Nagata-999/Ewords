name: Dictionary staged data validation
on:
  workflow_dispatch:
  push:
    branches: [automation/dictionary-pipeline]
    paths:
      - 'data/dictionary-auto/**'
      - 'scripts/validate_dictionary_candidates.py'
      - 'scripts/stage_dictionary_merge.py'
      - '.github/workflows/dictionary-staged-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate all staged candidates
        run: python scripts/validate_dictionary_candidates.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_dictionary_staging.py' -v
      - name: Check merger script syntax
        run: python -m py_compile scripts/stage_dictionary_merge.py
      - name: Production merge remains disabled
        run: echo "No base ZIP has been independently verified in CI; deployment is blocked."
