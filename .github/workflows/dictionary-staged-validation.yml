name: Dictionary staged data validation
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    paths:
      - 'data/dictionary-auto/**'
      - 'scripts/validate_dictionary_candidates.py'
      - '.github/workflows/dictionary-staged-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate staged additions when present
        run: |
          if [ -f data/dictionary-auto/new-entries.json ]; then
            python scripts/validate_dictionary_candidates.py
          else
            echo "No staged candidate file on this branch; nothing to validate."
          fi
