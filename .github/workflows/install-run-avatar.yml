name: Install SushiRun avatar runner

on:
  push:
    paths:
      - '.github/workflows/install-run-avatar.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject SushiRun avatar script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('sushi_run.html')
          text=p.read_text(encoding='utf-8')
          tag='<script src="sushigacha/run-avatar.js?v=20260913-1"></script>'

          if 'sushigacha/run-avatar.js' in text:
              text=re.sub(r'<script src="sushigacha/run-avatar\.js\?v=[^"]+"></script>', tag, text)
          else:
              if '</body>' not in text:
                  raise SystemExit('sushi_run.html: </body> not found')
              text=text.replace('</body>', tag+'\n</body>', 1)

          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sushi_run.html
          git commit -m 'Show saved avatar as SushiRun runner'
          git push
