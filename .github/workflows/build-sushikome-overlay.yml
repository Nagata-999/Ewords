name: Build Sushi Kome Overlay

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/sushikome-overlay/**"
      - ".github/workflows/build-sushikome-overlay.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/sushikome-overlay
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/sushikome-overlay/package.json

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Sushi-Kome-Overlay-Windows
          path: desktop/sushikome-overlay/dist/*.exe
          if-no-files-found: error

      - name: Publish latest installer
        uses: ncipollo/release-action@v1
        with:
          tag: sushikome-overlay-latest
          name: Sushi Kome Overlay for Windows
          artifacts: desktop/sushikome-overlay/dist/Sushi-Kome-Overlay-Setup.exe
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          body: "すし米 教員用 Windows オーバーレイ。PowerPointや教材の上に授業コメントを表示します。"
