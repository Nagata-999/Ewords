name: Sync DB usage
on:
  pull_request:
    paths:
      - 'cloudflare/pin-sync/assets/**'
      - 'sushigacha/achievement-transport.js'
      - 'tests/sync-db-usage.cjs'
      - '.github/workflows/sync-db-usage.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/sync-db-usage.cjs
