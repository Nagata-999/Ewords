name: Install Sushi Giri

on:
  push:
    paths:
      - '.github/workflows/install-sushigiri.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game
        run: |
          python3 -c 'from pathlib import Path; p=Path("sushigiri.html"); s=p.read_text(); s=s.replace("https://sushitan.net/sushizan.html","https://sushitan.net/sushigiri.html").replace("./data/words_2000.json","./data/words_master_v1.json").replace("./audio/bgm/bgm.mp3","./Marketplace_Sprint.mp3").replace("if(!Array.isArray(data)||data.length<2000)throw new Error(\"2000語データ不足\");\n    words=data.slice(0,2000).map(x=>[String(x.word||\"\").trim(),String(x.meaning||x.ja||\"\").trim()]).filter(x=>x[0]&&x[1]);","if(!Array.isArray(data))throw new Error(\"共通辞書の形式エラー\");\n    const pool=data.filter(x=>Array.isArray(x.games)&&x.games.includes(\"sushitan\")&&String(x.word||\"\").trim()&&String(x.ja||\"\").trim());\n    if(pool.length<2000)throw new Error(`すし単語彙不足 ${pool.length}`);\n    words=pool.slice(0,2000).map(x=>[String(x.word).trim(),String(x.ja).trim()]);").replace("data/words_2000.json の配置を確認してください。","data/words_master_v1.json を確認してください。"); p.write_text(s)'
      - name: Commit
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add sushigiri.html
          git diff --cached --quiet || git commit -m 'Fix Sushi Giri assets vocabulary and SEO'
          git push
