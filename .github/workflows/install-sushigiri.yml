name: Install Sushi Giri

on:
  push:
    paths:
      - '.github/workflows/install-sushigiri.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Sushi Giri home card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'href="sushigiri.html"' not in s:
              marker='<div class="game-item"><a class="card green" href="sushitype.html">'
              card='<div class="game-item"><a class="card orange" href="sushigiri.html">すし斬り<small>英語タイピング × 30秒斬撃</small></a><button aria-label="説明を開く" class="game-info-toggle" type="button">▽</button><div class="game-info"><h3>すし斬り</h3><p>迫ってくる寿司を英単語タイピングで斬る30秒スコアアタック。並は1〜1000番、上は1001〜2000番の英単語から出題されます。</p><h4>このゲームで身につくこと</h4><ul><li>英単語のスペル</li><li>英語タイピングの速度</li><li>語彙の瞬発力</li><li>集中して英語を処理する力</li></ul></div></div>\n'
              if marker not in s:
                  raise SystemExit('sushitype marker not found')
              s=s.replace(marker,card+marker,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Add Sushi Giri to home page'
          git push
