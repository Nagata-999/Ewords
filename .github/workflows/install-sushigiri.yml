name: Install Sushi Giri

on:
  push:
    paths:
      - '.github/workflows/install-sushigiri.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Sushi Giri
        run: python3 scripts/patch_sushigiri.py
      - name: Commit changes
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add sushigiri.html
          git diff --cached --quiet || git commit -m "Fix Sushi Giri layout and personal best ranking"
          git push
