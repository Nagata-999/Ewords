name: Install Sushi Giri

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-sushigiri.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Sushi Giri into shared vocabulary and home page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          game = Path('sushigiri.html')
          s = game.read_text(encoding='utf-8')
          s = s.replace('./data/words_2000.json', './data/words_master_v1.json')
          old = '''    if(!Array.isArray(data)||data.length<2000)throw new Error("2000語データ不足");
    words=data.slice(0,2000).map(x=>[String(x.word||"").trim(),String(x.meaning||x.ja||"").trim()]).filter(x=>x[0]&&x[1]);'''
          new = '''    if(!Array.isArray(data))throw new Error("共通辞書の形式エラー");
    const pool=data.filter(x=>Array.isArray(x.games)&&x.games.includes("sushitan")&&String(x.word||"").trim()&&String(x.ja||"").trim());
    if(pool.length<2000)throw new Error(`すし単語彙不足 ${pool.length}`);
    words=pool.slice(0,2000).map(x=>[String(x.word).trim(),String(x.ja).trim()]);'''
          s = s.replace(old, new)
          s = s.replace('data/words_2000.json の配置を確認してください。', 'data/words_master_v1.json を確認してください。')
          game.write_text(s, encoding='utf-8')

          home = Path('index.html')
          h = home.read_text(encoding='utf-8')
          if 'href="sushigiri.html"' not in h:
              marker = '<div class="game-item"><a class="card blue" href="sushitan.html">すし単<small>英単語</small></a>'
              card = '''<div class="game-item"><a class="card orange" href="sushigiri.html">すし斬り<small>英語タイピング × 30秒斬撃</small></a><button aria-label="説明を開く" class="game-info-toggle" type="button">▽</button><div class="game-info"><h3>すし斬り</h3><p>迫ってくる寿司を英単語タイピングで斬る30秒スコアアタックです。並は1〜1000番、上は1001〜2000番の語彙から出題。コンボとオンラインランキングでハイスコアを狙えます。</p><h4>このゲームで身につくこと</h4><ul><li>英単語のスペル</li><li>英語タイピングの速度</li><li>語彙の瞬発力</li><li>集中して英語を処理する力</li></ul></div></div>\n'''
              if marker not in h:
                  raise SystemExit('index insertion marker not found')
              h = h.replace(marker, card + marker, 1)
              home.write_text(h, encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sushigiri.html index.html
          git diff --cached --quiet && exit 0
          git commit -m "Integrate Sushi Giri into site"
          git push
