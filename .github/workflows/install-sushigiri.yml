name: Install Sushi Giri

on:
  push:
    paths:
      - '.github/workflows/install-sushigiri.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix one tap iOS keyboard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sushigiri.html')
          s=p.read_text(encoding='utf-8')
          old='''document.querySelector("#startBtn").onclick=async()=>{\n const ok=await loadVocab();\n if(!ok || words.length!==2000)return;\n usedWordIndexes.clear();\n startSushiSlashBgm();\n  setTimeout(focusMobileTyping,0);'''
          new='''document.querySelector("#startBtn").onclick=async()=>{\n // iOS: focus MUST happen synchronously inside this user tap, before any await.\n if(mobileTypingMode){\n   mobileTypingInput.value="";\n   try{mobileTypingInput.focus({preventScroll:true})}catch(e){mobileTypingInput.focus()}\n }\n const ok=await loadVocab();\n if(!ok || words.length!==2000){ mobileTypingInput.blur(); return; }\n usedWordIndexes.clear();\n startSushiSlashBgm();'''
          if old not in s:
              raise SystemExit('start handler marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add sushigiri.html
          git diff --cached --quiet || git commit -m 'Open iPhone keyboard from start tap'
          git push
