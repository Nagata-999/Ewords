name: Achievement ledger tests
on:
  push:
    branches:
      - feature/achievement-rank-colors
    paths:
      - 'sushigacha/achievement-*.js'
      - 'tests/achievement-*.test.cjs'
      - '.github/workflows/achievement-tests.yml'
  pull_request:
    paths:
      - 'sushigacha/achievement-*.js'
      - 'tests/achievement-*.test.cjs'
      - '.github/workflows/achievement-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/achievement-merge.test.cjs tests/achievement-ledger.test.cjs tests/achievement-transport.test.cjs tests/achievement-sync-bridge.test.cjs tests/achievement-rewards.test.cjs tests/achievement-metrics.test.cjs tests/achievement-milestones.test.cjs
