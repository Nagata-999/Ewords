name: Reading60 static QA

on:
  pull_request:
    paths:
      - 'reading60/**'
      - 'tests/reading60-static-qa.cjs'
      - '.github/workflows/reading60-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reading60-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Reading60 question bank
        run: node tests/reading60-static-qa.cjs
      - name: Validate isolated progress scheduler
        run: node --test tests/reading60-progress-store.test.cjs
