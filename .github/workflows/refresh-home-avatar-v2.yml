name: Refresh home avatar walker v2

on:
  push:
    paths:
      - '.github/workflows/refresh-home-avatar-v2.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bust home avatar walker cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          text=re.sub(r'<script src="sushigacha/home-avatar-walker\.js\?v=[^"]+"></script>', '<script src="sushigacha/home-avatar-walker.js?v=20260913-2"></script>', text)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load richer home avatar motions'
          git push
