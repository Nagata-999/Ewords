name: Import dictionary v2.44
on:
  push:
    branches: [codex/dictionary-v2-44]
    paths: [.github/workflows/import-dictionary-v244.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import verified dictionary sources
        run: |
          python - <<'PY'
          import pathlib, zipfile, hashlib
          payload=pathlib.Path('.github/dictionary-v244.zip')
          assert hashlib.sha256(payload.read_bytes()).hexdigest()=='34b03bbdbb406f0241e7ce6080a4e7de34f1ccee9c2f8bd72f0f33427dfbaf01'
          allowed={'scripts/build-dictionary.py','scripts/check-dictionary.py','scripts/dictionary-data.py','shared/dictionary.css','tests/dictionary-browser.cjs','tests/dictionary-data.py','.github/workflows/check-dictionary.yml','docs/dictionary-v2.44.md'}
          with zipfile.ZipFile(payload) as z:
              for name in z.namelist():
                  assert name in allowed or (name.startswith('data/dictionary/') and name.endswith('.json') and len(pathlib.PurePosixPath(name).parts)==3),name
                  p=pathlib.Path(name)
                  assert p.resolve().is_relative_to(pathlib.Path.cwd())
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(z.read(name))
          PY
      - run: python scripts/build-dictionary.py
      - run: python scripts/check-dictionary.py
      - run: python tests/dictionary-data.py
      - run: node tests/dictionary.cjs
      - run: node tests/shared-learning.cjs
      - name: Commit generated dictionary only
        run: |
          python - <<'PY'
          from pathlib import Path
          Path('.github/dictionary-v244.zip').unlink()
          Path('.github/workflows/import-dictionary-v244.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dictionary data/dictionary-generated.json data/dictionary-build-report.json dictionary 404.html scripts/build-dictionary.py scripts/check-dictionary.py scripts/dictionary-data.py shared/dictionary.css tests/dictionary-browser.cjs tests/dictionary-data.py .github/workflows/check-dictionary.yml docs/dictionary-v2.44.md
          git add -u -- .github/dictionary-v244.zip .github/workflows/import-dictionary-v244.yml
          git commit -m 'Integrate v2.44 dictionary and rebuild verified pages'
          git push origin HEAD:codex/dictionary-v2-44
