<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>すし米 Overlay</title>
<style>
:root{font-family:"Segoe UI","Yu Gothic UI",sans-serif;color:#172033;background:#fffaf2}
*{box-sizing:border-box}body{margin:0;padding:28px}.wrap{max-width:380px;margin:auto}
h1{margin:0 0 6px;font-size:28px}p{color:#667085;line-height:1.6}
label{display:block;font-weight:800;margin:22px 0 8px}
input,select{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:12px;font-size:18px;background:white}
.room{font-size:32px;text-align:center;letter-spacing:8px;font-weight:900}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
button{border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:800;cursor:pointer}
.primary{background:#f97316;color:white}.secondary{background:#e7f7f4;color:#11665d}.danger{background:#f2f4f7;color:#344054}
.status{margin-top:12px;min-height:24px;font-weight:800;color:#11665d}.hint{font-size:12px;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
<h1>🍚 すし米 Overlay</h1>
<p>PowerPointや教材の上に、授業コメントを流します。</p>
<label for="room">4桁の部屋番号</label>
<input id="room" class="room" inputmode="numeric" maxlength="4" placeholder="1234">
<button id="connect" class="primary" style="width:100%;margin-top:10px">接続する</button>
<div id="status" class="status">未接続</div>
<label for="size">文字サイズ</label>
<select id="size"><option value="32">小</option><option value="42" selected>標準</option><option value="54">大</option><option value="68">特大</option></select>
<label for="speed">流れる速さ</label>
<select id="speed"><option value="16">ゆっくり</option><option value="11" selected>標準</option><option value="7">速い</option></select>
<div class="row"><button id="show" class="secondary">表示</button><button id="hide" class="danger">非表示</button></div>
<button id="clear" class="danger" style="width:100%;margin-top:10px">画面上のコメントを消す</button>
<p class="hint">Ctrl + Shift + K：表示/非表示　／　Ctrl + Shift + S：この設定画面を開く</p>
</div>
<script>
const { ipcRenderer } = require('electron');
</script>
</body>
</html>
