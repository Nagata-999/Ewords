<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071a2b;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#fff;touch-action:none}
  #game{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hud{position:fixed;inset:0;pointer-events:none;padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between}
  .top{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px}
  .pill{background:rgba(3,13,24,.74);border:1px solid rgba(255,255,255,.15);box-shadow:0 8px 24px rgba(0,0,0,.22);backdrop-filter:blur(8px);border-radius:16px;padding:8px 13px;font-weight:900;text-shadow:0 2px 4px #0005}
  #score{grid-column:1;grid-row:1;justify-self:start}.wordbox{grid-column:1/-1;grid-row:2;justify-self:center;text-align:center;min-width:min(82vw,520px);padding:10px 20px}.wordbox small{display:block;font-size:10px;color:#8fdef7;letter-spacing:.14em}.wordbox b{display:block;font-size:clamp(32px,8vw,50px);line-height:1.05;letter-spacing:.025em}.wordbox span{font-size:12px;color:#cbd9e4}
  #bgmToggle{position:fixed;right:14px;top:max(58px,calc(env(safe-area-inset-top) + 46px));z-index:6;border:1px solid #ffffff40;border-radius:10px;background:#061523dd;color:#fff;padding:7px 10px;font:700 12px system-ui;cursor:pointer;touch-action:manipulation}
  #best{grid-column:3;grid-row:1;justify-self:end}.bottom{display:flex;align-items:end;justify-content:space-between;gap:12px}.help{font-size:11px;color:#cee4ef;background:#061523aa;border-radius:12px;padding:7px 10px}.hearts{font-size:22px;letter-spacing:2px;filter:drop-shadow(0 2px 3px #000)}
  #controls{position:fixed;right:18px;bottom:max(22px,env(safe-area-inset-bottom));width:210px;height:138px;pointer-events:auto;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:7px}
  .key{min-width:0;min-height:64px;padding:0;border:2px solid #ffffff42;background:#081a2de8;color:#fff;border-radius:17px;font-size:29px;font-weight:900;box-shadow:0 5px 0 #020a12bb;backdrop-filter:blur(5px);touch-action:manipulation;cursor:pointer}.key:active{transform:translateY(3px);box-shadow:0 2px 0 #020a12aa;background:#173752f2}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
  #overlay{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#173f57dd,#04101bed 65%);padding:24px;z-index:5}
  .card{width:min(92vw,460px);text-align:center}.logo{font-size:clamp(44px,13vw,76px);line-height:1;margin:0;text-shadow:0 7px 0 #07121c,0 11px 24px #000}.logo em{font-style:normal;color:#ffca3a}.sub{margin:13px 0 26px;color:#bcecff;font-weight:800}.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 22px}.how div{background:#ffffff0e;border:1px solid #ffffff18;border-radius:15px;padding:12px 6px;font-size:12px}.how b{display:block;font-size:25px;margin-bottom:5px}
  #start{width:100%;border:0;border-radius:18px;padding:15px;background:linear-gradient(#ffdb59,#ffad14);color:#322000;font-size:20px;font-weight:1000;box-shadow:0 7px 0 #a95700,0 13px 30px #0007;cursor:pointer}#start:active{transform:translateY(4px);box-shadow:0 3px 0 #a95700}.result{display:none;margin:0 0 16px}.result strong{font-size:50px;display:block;color:#ffcf3f}.credit{font-size:10px;color:#91a9b6;margin-top:18px}
  #toast{position:fixed;left:50%;top:27%;transform:translate(-50%,-10px) scale(.9);opacity:0;pointer-events:none;font-weight:1000;font-size:clamp(24px,7vw,42px);text-shadow:0 4px 0 #000,0 7px 14px #000;z-index:4;transition:.18s}.show{opacity:1!important;transform:translate(-50%,0) scale(1)!important}
  .word-swap{animation:wordSwap .34s cubic-bezier(.2,1.5,.4,1)}@keyframes wordSwap{0%{transform:scale(.62);opacity:.25}100%{transform:scale(1);opacity:1}}
  @media(max-width:620px){#controls{width:204px;height:134px;right:10px;bottom:max(14px,env(safe-area-inset-bottom))}.key{min-height:62px}.help{max-width:105px}.pill{padding:7px 10px}.wordbox{min-width:78vw}.wordbox span{display:block}}

  #overlay .card{max-height:calc(100dvh - 48px);overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:0 4px 12px}
  #start:disabled{opacity:.65;cursor:wait}
  .cross-note{font-size:12px;color:#c0d7e4;line-height:1.6;margin:12px 0}
  .cross-secondary{border:1px solid #ffffff40;background:#102b40;color:#fff;border-radius:12px;padding:10px 16px;font:700 14px system-ui;cursor:pointer}
  #openRanking{margin-top:17px}
  #saveRanking{margin:18px 0 12px;padding:12px;border:1px solid #ffffff25;border-radius:12px;text-align:left}
  #saveRanking label{display:block;font-size:13px;margin-bottom:6px}
  #playerName{width:100%;padding:10px;border:1px solid #8cabbf;border-radius:8px;background:#fff;color:#17202b;font:16px system-ui;touch-action:manipulation}
  #saveScore{width:100%;margin-top:8px}#saveScore:disabled{opacity:.65}
  #rankingDialog{background:#071a2b;color:#fff;border:1px solid #456176;border-radius:18px;width:min(94vw,520px);max-height:85dvh;padding:18px;overflow:auto;touch-action:pan-y}
  #rankingDialog::backdrop{background:#000a}#rankingDialog h2{font-size:22px;margin:0 0 12px}
  #rankingDialog table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
  #rankingDialog th,#rankingDialog td{padding:10px 4px;border-bottom:1px solid #ffffff22;text-align:right;overflow-wrap:anywhere}
  #rankingDialog th:nth-child(2),#rankingDialog td:nth-child(2){text-align:left;width:42%}
  #rankingDialog th:first-child{width:12%}.ranking-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
</style>

<link rel="canonical" href="https://sushitan.net/sushicross">

<meta name="description" content="車や電車、川などの障害物に注意して進む、英単語とアクションを組み合わせたゲームです。移動は矢印キー・WASD・スワイプに対応し、語彙の問題では選択肢をタップして答えます。">
</head>
<body>
<canvas id="game" aria-label="すしクロスのゲーム画面"></canvas>
<div id="hud">
  <div class="top">
    <div class="pill" id="score">🍣 0</div>
    <div class="pill wordbox"><small>CHOOSE THE MEANING</small><b id="word">READY?</b><span>直前から進む／選択肢をタップしてワープ</span></div>
    <div class="pill" id="best">BEST 0</div>
  </div>
  <div class="bottom"><div><div class="hearts" id="hearts">❤️❤️❤️</div><div class="help">矢印・WASD・スワイプで移動</div></div></div>
</div>
<div id="controls" aria-label="方向操作">
  <button class="key up" data-dir="up" aria-label="前へ">▲</button>
  <button class="key left" data-dir="left" aria-label="左へ">◀</button>
  <button class="key down" data-dir="down" aria-label="後ろへ">▼</button>
  <button class="key right" data-dir="right" aria-label="右へ">▶</button>
</div>
<audio id="bgm" src="One_More_Quarter.mp3" loop preload="none"></audio>
<button id="bgmToggle" type="button" aria-label="BGMをオフにする" aria-pressed="true">BGM ON</button>
<div id="toast">GOOD!</div>
<div id="overlay">
  <div class="card">
    <h1 class="logo">すし<em>クロス</em></h1>
    <p class="sub">英単語ロードを渡りきれ！</p>
    <div class="result" id="result"><span>今回の記録</span><strong id="finalScore">0</strong><span id="finalReason"></span></div>
    <div class="how" id="how">
      <div><b>🚕</b>車をよける</div><div><b>🚃</b>電車に注意</div><div><b>🔤</b>意味を選ぶ</div>
    </div>
    <div data-sushi-player></div>
    <button id="start" disabled>単語を読み込み中…</button>
    <p id="wordStatus" class="cross-note" role="status">すし単と共通の辞書を読み込み中…</p>
    <form id="saveRanking" hidden>
      <label for="playerName">ランキングに表示する名前（20文字以内）</label>
      <input id="playerName" data-sushi-name name="playerName" maxlength="20" autocomplete="nickname" placeholder="名前" required>
      <button id="saveScore" data-auto-score-button hidden class="cross-secondary" type="submit">記録を登録</button>
      <p id="saveStatus" class="cross-note" role="status"></p>
    </form>
    <button id="openRanking" class="cross-secondary" type="button">ランキング</button>
    <div class="credit">SUSHITAN.NET • ORIGINAL LEARNING GAME</div>
  </div>
</div>
<dialog id="rankingDialog" aria-labelledby="rankingHeading">
  <h2 id="rankingHeading">すしクロス ランキング</h2>
  <p id="rankingStatus" class="cross-note" role="status"></p>
  <table><thead><tr><th scope="col">順位</th><th scope="col">名前</th><th scope="col">スコア</th><th scope="col">到達<br>ステージ</th></tr></thead><tbody id="rankingRows"></tbody></table>
  <div class="ranking-actions"><button id="refreshRanking" class="cross-secondary" type="button">更新</button><button id="closeRanking" class="cross-secondary" type="button">閉じる</button></div>
</dialog>

<script src="sushicross-ranking.js?v=20260923-2"></script>
<script>
(()=>{
"use strict";
const canvas=document.querySelector("#game"),ctx=canvas.getContext("2d");
const ui={score:document.querySelector("#score"),best:document.querySelector("#best"),word:document.querySelector("#word"),hearts:document.querySelector("#hearts"),overlay:document.querySelector("#overlay"),start:document.querySelector("#start"),result:document.querySelector("#result"),how:document.querySelector("#how"),finalScore:document.querySelector("#finalScore"),finalReason:document.querySelector("#finalReason"),toast:document.querySelector("#toast")};
const safeStorage={
 get(key,fallback="0"){try{return localStorage.getItem(key)??fallback}catch(_){return fallback}},
 set(key,value){try{localStorage.setItem(key,String(value))}catch(_){/* プレビュー環境では保存せず続行 */}}
};
let WORDS=[],wordDeck=null,loadingWords=false,answeredCount=0,correctCount=0;
const ranking=SushiCrossRanking.init(safeStorage);
async function loadWords(){
 if(loadingWords)return;loadingWords=true;ui.start.disabled=true;
 const status=document.querySelector("#wordStatus");
 ui.start.textContent="単語を読み込み中…";
 try{
  WORDS=await SushiCrossWords.load();wordDeck=SushiCrossWords.createDeck(WORDS);
  status.textContent="すし単と共通の辞書・"+WORDS.length.toLocaleString("ja-JP")+"語から出題";
  ui.start.textContent="ゲームスタート";
 }catch(_){status.textContent="単語を読み込めませんでした。通信を確認して再試行してください。";ui.start.textContent="再読み込み"}
 finally{loadingWords=false;ui.start.disabled=false}
}
function presentScore(){ranking.present({score:Math.round(score),stage,accuracy:answeredCount?Math.round(correctCount/answeredCount*100):0})}
const TYPES={GRASS:0,ROAD:1,WATER:2,RAIL:3,QUIZ:4,GOAL:5};
const THEMES=[
 {sky1:"#7ed6ed",sky2:"#c5f1dc",ground:"#183a46",grass1:"#48b968",grass2:"#54c877",grassSide:"#257645",water:"#1599cf",quiz:"#583f7d"},
 {sky1:"#ffb37f",sky2:"#ffe2ad",ground:"#66464b",grass1:"#75ad54",grass2:"#89c15e",grassSide:"#477435",water:"#278caf",quiz:"#76516f"},
 {sky1:"#7184bd",sky2:"#bbcce8",ground:"#293653",grass1:"#398768",grass2:"#499a77",grassSide:"#245d49",water:"#286fa3",quiz:"#4f4d87"},
 {sky1:"#a8dced",sky2:"#edf8ff",ground:"#47636d",grass1:"#73a886",grass2:"#84ba95",grassSide:"#4b735d",water:"#56a4c4",quiz:"#695886"}
];
let W,H,dpr,tileX,tileY,centerX,baseY;
let state="menu",stage=1,stageLength=30,lanes=[],player,score,distance,hearts,best=+(safeStorage.get("sushiCrossBest","0")||0),camera=0,scrollAge=0,pressureWarned=false,last=0,shake=0,quiz=null,toastTimer=0,particles=[],ripples=[],screenFlash=0,flashColor="255,255,255";

const bgm=document.querySelector("#bgm");
bgm.loop=true;
bgm.volume=0.35;
bgm.preload="none";
const bgmToggle=document.querySelector("#bgmToggle");
let bgmEnabled=safeStorage.get("sushiCrossBgm","on")!=="off";
function updateBgmButton(){
 bgmToggle.textContent=bgmEnabled?"BGM ON":"BGM OFF";
 bgmToggle.setAttribute("aria-pressed",String(bgmEnabled));
 bgmToggle.setAttribute("aria-label",bgmEnabled?"BGMをオフにする":"BGMをオンにする");
}
function syncBgm(){
 if(!bgmEnabled||document.hidden||state!=="playing"){bgm.pause();return}
 const playing=bgm.play();
 if(playing)playing.catch(()=>{/* 再生できない場合もゲームは継続する */});
}
bgmToggle.addEventListener("click",()=>{
 bgmEnabled=!bgmEnabled;
 safeStorage.set("sushiCrossBgm",bgmEnabled?"on":"off");
 updateBgmButton();
 syncBgm();
});
document.addEventListener("visibilitychange",syncBgm);
addEventListener("pagehide",()=>bgm.pause());
addEventListener("pageshow",syncBgm);
updateBgmButton();

const rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const theme=()=>THEMES[(stage-1)%THEMES.length],difficulty=()=>Math.min(stage-1,10);

function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0);tileX=clamp(W/9.1,43,76);tileY=tileX*.61;centerX=W/2;baseY=H*.77}
addEventListener("resize",resize);resize();ui.best.textContent="BEST "+best;

function laneFor(row){return lanes.find(l=>l.row===row)}
function addLane(row,type){
 let l={row,type,objects:[],speed:0,dir:Math.random()<.5?-1:1,phase:rand(0,10),quiz:null};
 if(type===TYPES.ROAD){l.speed=rand(.9,1.75)*(1+row/180)*(1+difficulty()*.1);let n=Math.min(5,(Math.random()<.5?2:3)+Math.floor(difficulty()/3));for(let i=0;i<n;i++)l.objects.push({x:rand(-8,8)+i*(16/n),color:pick(["#ff4b55","#ffd23f","#24a8e0","#8d67d8","#f38b35"]),kind:Math.random()<.25?"truck":"car"})}
 if(type===TYPES.WATER){l.speed=rand(.35,.7)*(1+difficulty()*.075)*l.dir;let n=Math.min(5,3+Math.floor(difficulty()/4));for(let i=0;i<n;i++)l.objects.push({x:-7+i*(15/n)+rand(-.7,.7),len:rand(1.8,2.8)})}
 if(type===TYPES.RAIL){l.speed=0;l.timer=rand(Math.max(1.7,2-difficulty()*.05),Math.max(3.8,6-difficulty()*.2));l.warning=false;l.trainX=-14*l.dir}
 lanes.push(l);return l;
}
function buildWorld(){
 lanes=[];for(let r=-4;r<=stageLength+4;r++){let type=TYPES.GRASS;if(r===stageLength)type=TYPES.GOAL;else if(r>2&&r<stageLength){if(r%7===0)type=TYPES.QUIZ;else{let p=Math.random(),d=difficulty();type=p<.44+d*.012?TYPES.ROAD:p<.67-d*.006?TYPES.GRASS:p<.86?TYPES.WATER:TYPES.RAIL}}addLane(r,type)}
}
function ensureWorld(){/* ステージはゴールまでの固定盤面 */}

function begin(){if(!WORDS.length){loadWords();return}ranking.reset();if(state==="stageclear")stage++;else{stage=1;score=0;hearts=3;wordDeck=SushiCrossWords.createDeck(WORDS);answeredCount=0;correctCount=0}state="playing";syncBgm();distance=0;camera=0;scrollAge=0;pressureWarned=false;quiz=null;particles=[];ripples=[];screenFlash=0;player={x:0,row:0,px:0,prow:0,move:1,hop:0,hidden:false};buildWorld();primeQuizzes();ui.result.style.display="none";ui.how.style.display="block";ui.overlay.style.display="none";updateHUD();last=performance.now()}
function updateHUD(){ui.score.textContent="STAGE "+stage+"　🍣 "+score;ui.best.textContent="BEST "+best;ui.hearts.textContent="❤️".repeat(hearts)+"🖤".repeat(3-hearts)}
function showToast(text,color="#fff"){ui.toast.textContent=text;ui.toast.style.color=color;ui.toast.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>ui.toast.classList.remove("show"),650)}
function end(reason){if(state!=="playing")return;state="over";syncBgm();best=Math.max(best,score);safeStorage.set("sushiCrossBest",best);updateHUD();ui.finalScore.textContent=score;ui.finalReason.textContent=reason;ui.result.style.display="block";ui.how.style.display="none";ui.start.textContent="もう一度あそぶ";presentScore();setTimeout(()=>ui.overlay.style.display="grid",950)}
function clearStage(){if(state!=="playing")return;state="stageclear";syncBgm();best=Math.max(best,score);safeStorage.set("sushiCrossBest",best);updateHUD();showToast("STAGE CLEAR!","#ffe36e");ui.finalScore.textContent="CLEAR!";ui.finalReason.textContent="STAGE "+stage+"　SCORE "+score;ui.result.style.display="block";ui.how.style.display="none";ui.start.textContent="次のステージ";presentScore();setTimeout(()=>ui.overlay.style.display="grid",650)}

function nextWordEntry(){return wordDeck.next()}
function startQuiz(lane,activate=true){
 if(!lane.quiz){let w=nextWordEntry(),answers=SushiCrossWords.choices(w,WORDS),xs=[-3,0,3],choices=answers.map((a,i)=>({...a,x:xs[i]}));lane.quiz={word:w.en,correct:w.label,choices,answered:false,aim:1}}
 if(activate){let changed=!quiz||quiz!==lane.quiz;quiz=lane.quiz;ui.word.textContent=lane.quiz.word;if(changed){ui.word.classList.remove("word-swap");void ui.word.offsetWidth;ui.word.classList.add("word-swap")}}
}
function primeQuizzes(){
 let future=lanes.filter(l=>l.type===TYPES.QUIZ&&l.row>player.row&&!l.quiz?.answered).sort((a,b)=>a.row-b.row);future.slice(0,2).forEach(l=>startQuiz(l,false));let active=future.find(l=>l.quiz&&!l.quiz.answered);if(active)startQuiz(active,true)
}
function move(dir){
 if(state!=="playing"||ranking.isOpen()||player.move<1)return;let nx=player.x,nr=player.row,ahead=laneFor(player.row+1);
 if(ahead&&ahead.type===TYPES.QUIZ&&!ahead.quiz?.answered){
  startQuiz(ahead);
  if(dir==="up"){let best=0;for(let i=1;i<ahead.quiz.choices.length;i++)if(Math.abs(ahead.quiz.choices[i].x-player.x)<Math.abs(ahead.quiz.choices[best].x-player.x))best=i;if(Math.abs(ahead.quiz.choices[best].x-player.x)>1.15){showToast("単語の正面へ！","#ffe36e");return}ahead.quiz.aim=best;nr++;nx=ahead.quiz.choices[best].x}else{if(dir==="down")nr--;if(dir==="left")nx--;if(dir==="right")nx++}
 }else{if(dir==="up")nr++;if(dir==="down")nr--;if(dir==="left")nx--;if(dir==="right")nx++}
 if(ahead&&ahead.type===TYPES.QUIZ&&!ahead.quiz?.answered&&nr===player.row){let best=0;for(let i=1;i<ahead.quiz.choices.length;i++)if(Math.abs(ahead.quiz.choices[i].x-nx)<Math.abs(ahead.quiz.choices[best].x-nx))best=i;ahead.quiz.aim=best}
 if(nx<-4||nx>4||nr<0)return;
 let target=laneFor(nr);if(!target)return;
 if(target.type===TYPES.QUIZ&&!target.quiz?.answered){startQuiz(target);nx=target.quiz.choices[target.quiz.aim].x}
 player.px=player.x;player.prow=player.row;player.x=nx;player.row=nr;player.move=0;player.hop=1;
 if(nr>distance){score+=nr-distance;distance=nr;updateHUD();ensureWorld()}
}

function scaleAt(row){return clamp(1-(row-camera)*.018,.58,1.12)}
function iso(x,row){let rel=row-camera,s=scaleAt(row),depth=Math.abs(rel)*tileY/(1+Math.max(rel,0)*.018);return{x:centerX+x*tileX*s,y:baseY-Math.sign(rel)*depth}}
function poly(points,fill,stroke){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function box3D(x,y,w,d,h,front,top,side="#24303a",shadow=true){
 const skew=d*.2,fl=[x-w/2,y+d/2],fr=[x+w/2,y+d/2],br=[x+w/2+skew,y-d/2],bl=[x-w/2+skew,y-d/2];
 const tfl=[fl[0],fl[1]-h],tfr=[fr[0],fr[1]-h],tbr=[br[0],br[1]-h],tbl=[bl[0],bl[1]-h];

function drawLane(l){

function drawObjects(l){

const ease=t=>1-Math.pow(1-t,3);

function hitEffect(kind){
 const p=iso(player.x,player.row),s=scaleAt(player.row),splash=kind==="water";player.hidden=true;shake=splash?9:18;screenFlash=splash?.28:.48;flashColor=splash?"87,210,255":"255,223,90";

function updateFX(dt){

function answerCheck(){let l=laneFor(player.row);if(!l||l.type!==TYPES.QUIZ||!l.quiz||l.quiz.answered)return;let c=l.quiz.choices.find(c=>Math.abs(c.x-player.x)<.7);if(!c)return;l.quiz.answered=true;l.quiz.crushed=true;l.quiz.choices.forEach(q=>q.answered=true);answeredCount++;if(c.correct){correctCount++;score+=5;showToast("GOOD! +5","#78ff9f")}else{hearts--;showToast("正解："+l.quiz.correct,"#ff9da2");shake=10;if(hearts<=0){updateHUD();end("英単語で3回ミス！");return}}updateHUD();primeQuizzes()}
function update(dt){
 updateFX(dt);if(state!=="playing")return;player.move=Math.min(1,player.move+dt*6.8);if(player.move>=.72){answerCheck();if(state!=="playing")return;let ahead=laneFor(player.row+1);if(ahead&&ahead.type===TYPES.QUIZ&&!ahead.quiz)startQuiz(ahead)}scrollAge+=dt;let follow=Math.max(0,player.row-3),scrollSpeed=.28+difficulty()*.025+Math.min(.12,Math.max(0,scrollAge-18)*.0025),forced=scrollAge>4?scrollSpeed*dt:0;camera=Math.max(camera+forced,camera+(follow-camera)*Math.min(1,dt*4));let pressure=camera-player.row;if(pressure>2.7&&!pressureWarned){pressureWarned=true;showToast("急いで！","#ff9b72")}else if(pressure<2.1)pressureWarned=false;if(pressure>4.4){player.hidden=true;shake=12;screenFlash=.35;flashColor="255,92,72";return end("画面外に押し出された！")}
 for(let l of lanes){l.phase+=dt;if(l.type===TYPES.ROAD){for(let o of l.objects){o.x+=l.dir*l.speed*dt;if(o.x>8)o.x=-8;if(o.x<-8)o.x=8}}
  if(l.type===TYPES.WATER){for(let o of l.objects){o.x+=l.speed*dt;if(o.x>8)o.x=-8;if(o.x<-8)o.x=8}}
  if(l.type===TYPES.RAIL){l.timer-=dt;if(!l.trainActive&&l.timer<1.35)l.warning=true;if(!l.trainActive&&l.timer<=0){l.trainActive=true;l.warning=false;l.trainX=-11*l.dir}if(l.trainActive){l.trainX+=l.dir*12*(1+difficulty()*.06)*dt;if(Math.abs(l.trainX)>12){l.trainActive=false;l.timer=rand(Math.max(2.8,4-difficulty()*.12),Math.max(4.2,7-difficulty()*.18))}}}
 }

}
function draw(){

 ctx.save();ctx.translate(rand(-shake,shake),rand(-shake,shake));let visible=lanes.filter(l=>{let y=iso(0,l.row).y;return y>-tileY*2&&y<H+tileY*2}).sort((a,b)=>b.row-a.row);for(let l of visible)drawLane(l);for(let l of visible)drawObjects(l);if(player)drawSushi();ctx.restore();drawFX();if(state==="playing"&&player){let danger=clamp((camera-player.row-2)/2.4,0,.42);if(danger>0){let edge=ctx.createLinearGradient(0,H*.7,0,H);edge.addColorStop(0,"rgba(255,62,42,0)");edge.addColorStop(1,`rgba(255,62,42,${danger})`);ctx.fillStyle=edge;ctx.fillRect(0,H*.7,W,H*.3)}}

function quizPointer(x,y,warp=false){
 if(state!=="playing"||!quiz||quiz.answered)return false;let lane=lanes.find(l=>l.quiz===quiz);if(!lane||Math.abs(player.row-(lane.row-1))>.01)return false;let s=scaleAt(lane.row);
