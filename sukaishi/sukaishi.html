<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4511e"><title>す界し｜英語でめぐる世界史</title><link rel="stylesheet" href="style.css"></head>
<body><main class="wrap"><header class="top"><a class="brand" href="sukaishi.html"><span class="mark">史</span><span>す界し<small> SUSHITAN WORLD HISTORY</small></span></a><a class="home" href="../index.html">すし単トップ ↗</a></header>
