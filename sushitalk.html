<style>
:root{--bg:#fffaf2;--card:#fff;--ink:#24313f;--muted:#637083;--brand:#ef6c3e;--brand2:#1f8a70;--line:#eadfce;--soft:#fff2df;--blue:#eaf4ff;--danger:#e11d48;--gold:#f59e0b;--green:#22c55e;--purple:#8b5cf6}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#fffaf2;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",Meiryo,sans-serif}body{background:linear-gradient(180deg,#fff7eb 0%,#fffaf2 40%,#fff 100%)}button{font-family:inherit}#app{width:min(100vw,560px);min-height:100dvh;margin:auto;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:visible}.header{display:flex;justify-content:space-between;align-items:center;gap:8px}.logo{font-size:22px;font-weight:900;color:var(--brand)}.smallLink{color:var(--brand2);font-weight:800;text-decoration:none;font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:15px;box-shadow:0 12px 32px rgba(75,49,22,.08)}.title{font-size:46px;line-height:1;font-weight:1000;color:var(--brand);text-align:center;margin-top:8px}.lead{color:#435064;text-align:center;line-height:1.75;font-weight:700}.btn{border:none;border-radius:999px;padding:14px 18px;background:var(--brand);color:#fff;font-size:18px;font-weight:900;box-shadow:0 8px 18px rgba(239,108,62,.25)}.btn.secondary{background:var(--brand2)}.btn:active,.characterSelect:active,.choice:active{transform:scale(.985)}.loadingNote{margin-top:10px;color:#637083;font-size:13px;font-weight:800;text-align:center}.status{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.stat{background:#fff8ee;border:1px solid #f2dec5;border-radius:16px;padding:8px;text-align:center}.statLabel{color:var(--muted);font-size:10px;font-weight:900}.statValue{color:var(--brand);font-size:21px;font-weight:1000}.heartLine{text-align:center;font-size:27px;letter-spacing:2px;line-height:1.2}.heartHint{text-align:center;font-size:12px;font-weight:900;color:var(--muted);margin-top:3px}.timerWrap{height:10px;background:#fff3e6;border:1px solid #f2dec5;border-radius:999px;overflow:hidden}.timerFill{height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#f59e0b,#ef4444);transition:width .08s linear}.characterList{display:grid;gap:8px}.characterSelect{width:100%;border:1px solid var(--line);border-radius:22px;background:#fff;padding:12px;display:grid;grid-template-columns:82px 1fr;gap:12px;text-align:left;box-shadow:0 8px 18px rgba(75,49,22,.06);color:var(--ink)}.miniSpriteWrap{width:82px;height:102px;overflow:hidden;border-radius:18px;background:#fff8ee;border:1px solid #f2dec5;position:relative}.miniSprite,.sprite{background-image:var(--sheet);background-size:500% 100%;background-repeat:no-repeat;background-position:0% 50%}.miniSprite{width:82px;height:102px}.selectName{font-size:24px;font-weight:1000;line-height:1.1}.selectType{display:inline-block;margin:5px 0;background:var(--soft);color:var(--brand);border:1px solid #ffd3b8;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:900}.ruleGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.ruleBox{border-radius:14px;padding:8px;font-size:12px;font-weight:900;line-height:1.35}.ruleBox.good{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}.ruleBox.bad{background:#fff1f2;color:#be123c;border:1px solid #fecdd3}.conversationCard{padding:14px;overflow:hidden}.conversationHero{display:grid;grid-template-columns:112px 1fr;gap:8px;align-items:start}.spriteWrap{width:112px;height:154px;overflow:hidden;border-radius:18px;background:linear-gradient(180deg,#fff8ee,#fff);border:1px solid var(--line);display:flex;align-items:flex-start;justify-content:center;position:relative}.spriteWrap::after{content:"";position:absolute;inset:auto 10px 8px;height:14px;border-radius:50%;background:rgba(0,0,0,.08);filter:blur(5px)}.sprite{width:112px;height:154px;transition:background-position .14s ease,filter .18s ease;position:relative;z-index:2}.sprite.normal{background-position:0% 50%}.sprite.good{background-position:25% 50%;filter:drop-shadow(0 0 16px rgba(31,138,112,.25))}.sprite.bad{background-position:50% 50%;filter:drop-shadow(0 0 16px rgba(239,108,62,.25))}.sprite.shock{background-position:75% 50%;filter:drop-shadow(0 0 16px rgba(59,130,246,.25))}.sprite.love{background-position:100% 50%;filter:drop-shadow(0 0 20px rgba(244,114,182,.35))}.charName{font-size:24px;font-weight:1000;line-height:1.15}.charType{display:inline-block;margin-top:5px;background:var(--soft);color:var(--brand);border:1px solid #ffd3b8;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:900}.comboBadge{display:inline-block;margin-top:6px;background:#ecfdf5;color:#047857;border:1px solid #a7f3d0;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:1000}.bubble{position:relative;background:var(--blue);border-radius:18px;padding:11px 12px;margin-top:10px;color:#1d3448}.bubble::before{content:"";position:absolute;left:-8px;top:28px;width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;border-right:10px solid var(--blue)}.sceneInBubble{font-size:14px;font-weight:900;line-height:1.45;margin-bottom:6px;color:var(--ink)}.bubble .en{font-size:19px;font-weight:1000;line-height:1.35}.bubble .ja{color:#435064;margin-top:4px;font-size:12px;font-weight:700}.choiceAreaInCard{margin-top:12px;display:grid;gap:8px}.choice{text-align:left;border:none;border-radius:20px;padding:12px 13px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 18px rgba(75,49,22,.06);color:var(--ink);position:relative;overflow:hidden}.choiceEN{font-size:18px;font-weight:1000}.choiceJA{color:var(--muted);font-size:13px;margin-top:4px;font-weight:700}.choice.locked{opacity:.38;pointer-events:none}.choice.selected{opacity:1;border:2px solid var(--brand);background:#fff8ee}.replyBubble{position:relative;background:#fff8ee;border:1px solid #f2dec5;border-radius:20px;padding:14px 15px;margin-top:12px;text-align:center;cursor:pointer}.hidden{display:none}.tapNext{color:var(--brand2);font-size:12px;font-weight:1000;letter-spacing:.12em}.delta{font-size:38px;font-weight:1000;margin-top:4px;color:var(--brand2)}.delta.bad{color:var(--danger)}.replyEN{font-size:22px;font-weight:1000;line-height:1.35}.replyJA{color:var(--muted);margin-top:5px;font-weight:700}.resultRank{text-align:center;font-size:44px;font-weight:1000;color:var(--brand);line-height:1.05}.log{display:grid;gap:8px}.logRow{background:#fff8ee;border:1px solid #f2dec5;border-radius:14px;padding:10px;font-size:13px;line-height:1.55}.flash{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:0}.flash.good{background:rgba(34,197,94,.22);animation:flash .38s ease}.flash.bad{background:rgba(225,29,72,.25);animation:flash .38s ease}.flash.best{background:rgba(250,204,21,.28);animation:flash .55s ease}@keyframes flash{0%{opacity:0}35%{opacity:1}100%{opacity:0}}.shake{animation:shake .25s ease}@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}100%{transform:translateX(0)}}.pop{animation:pop .25s ease}@keyframes pop{0%{transform:scale(.82);opacity:.4}100%{transform:scale(1);opacity:1}}.float{animation:float 2.2s ease-in-out infinite}@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-3px)}100%{transform:translateY(0)}}@media(max-width:420px){#app{padding:9px}.title{font-size:39px}.characterSelect{grid-template-columns:70px 1fr}.miniSpriteWrap,.miniSprite{width:70px;height:90px}.selectName{font-size:21px}.ruleGrid{grid-template-columns:1fr}.conversationHero{grid-template-columns:102px 1fr}.spriteWrap,.sprite{width:102px;height:142px}.bubble .en{font-size:17px}.choiceEN{font-size:17px}.card{padding:13px}.statValue{font-size:18px}.heartLine{font-size:23px}}

/* v3: 4 choices + clearer character differentiation */
.choiceAreaInCard{gap:7px}
.choice{padding:9px 11px;border-radius:16px}
.choiceEN{font-size:16px}
.choiceJA{font-size:12px}
@media(max-width:420px){.choice{padding:8px 10px}.choiceEN{font-size:15px}}
.history{margin-top:12px;padding:10px;border-radius:12px;background:#f7f7f7;font-size:12px;line-height:1.5;overflow-wrap:anywhere}.history span{color:var(--muted)}.phraseNote{font-size:13px;line-height:1.6;color:var(--ink)}
</style>

<meta name="description" content="会話の場面を読み、4つの返答候補から相手に合う表現を選びます。相手の好みや反応を確認しながら、日常会話やスラングの使い方を考えるゲームです。">
<script defer src="/sushigacha/site-taskbar.js?v=20261010-1"></script></head>
<body>
<div id="app"></div><div class="flash" id="flash"></div>
<script src="shared/sushitalk-conversations.js?v=20261010-2"></script>
<script>
const INFO_HTML = `
<details class="card" style="margin-bottom:4px">
<summary style="cursor:pointer;font-weight:900;color:var(--brand);font-size:18px;">&#9661; このゲームで学べること</summary>
<div style="margin-top:12px;line-height:1.8;color:#435064;font-weight:700">
<p><strong>Sushi Talk</strong> は、ネイティブが日常会話でよく使う自然な英語表現を学ぶゲームです。</p>
<p>学校ではあまり習わない <b>We'll see.</b>、<b>I feel you.</b>、<b>Fair enough.</b> のような日常表現から、<b>No cap.</b>、<b>Straight up.</b> などのスラングまで、実際によく使われる英語を楽しく学べます。</p>

<p>1つの話題で2往復。4択から返答を選びます。<b>I screwed up.</b>（やらかした）、<b>I freaked out.</b>（すごく焦った）など、日常のくだけた表現も学べます。</p>
<p>日常英会話・スラング・リアクション表現をゲーム感覚で学びたい人におすすめです。</p>
</div>
</details>`;

const SPRITE_FILES=["assets/SL-01.webp","assets/SL-02.webp","assets/SL-03.webp","assets/SL-04.webp","assets/SL-05.webp"];
function preloadSprites(){return Promise.all(SPRITE_FILES.map(src=>new Promise(resolve=>{const img=new Image();img.onload=resolve;img.onerror=resolve;img.src=src;})));}
function a(en,ja,tags){return{en,ja,tags};}
function esc(s){return String(s).replace(/[&<>'"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[m]));}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(arr){const out=[...arr];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
function sample(arr,n){return shuffle(arr).slice(0,n);}
function uniqueChoices(list){const seen=new Set(),out=[];for(const x of list){if(x&&!seen.has(x.en)){seen.add(x.en);out.push(x);}}return out;}

const CHARACTERS=[
{id:"sushi",name:"Sushi",type:"普通の人",sheet:"assets/SL-01.webp",likes:["friendly","honest","empathy","casual","daily","safe"],hates:["slang","meme","rude","too_edgy","chaotic","cold"],best:"自然・共感・やさしい返答",worst:"スラング連発・攻撃的な返答",time:22,profile:"普通に会話ができる相手。I feel you / Sounds good / No worries などの自然表現が強い。日常のくだけた表現は自然。ネットスラングの連発は苦手。"},
{id:"ally",name:"Ally",type:"ネット民",sheet:"assets/SL-02.webp",likes:["meme","weird","relatable","slang","internet"],hates:["formal","lecture","basic","stiff"],best:"ミーム・ネット感・共感",worst:"堅すぎる返答・説教",time:18,profile:"Pain / cooked / lore / NPC / no cap みたいなネット感が刺さる。丁寧すぎると弱い。"},
{id:"mark",name:"Mark",type:"陽キャ・オラオラ",sheet:"assets/SL-03.webp",likes:["hype","bold","challenge","positive","slang"],hates:["passive","cold","formal","careful"],best:"盛り上げ・強気・前向き",worst:"冷たい返答・弱い返答・堅い返答",time:20,profile:"Huge W / You got this / LET'S GOOO 系が強い。共感だけで終わるより前に押す返答が好き。"},
{id:"susie",name:"Susie",type:"ギャル",sheet:"assets/SL-04.webp",likes:["slang","hype","friendly","tease","cute"],hates:["formal","rude","lecture","stiff"],best:"ノリ・褒め・友達感",worst:"堅い返答・上から目線",time:15,profile:"slay / ate / fire / obsessed みたいな明るいノリが好き。失礼な煽りはNG。"},
{id:"malia",name:"Malia",type:"堅そうな人",sheet:"assets/SL-05.webp",likes:["polite","honest","empathy","careful","safe"],hates:["slang","meme","rude","too_edgy","chaotic","internet"],best:"丁寧・誠実・配慮",worst:"スラング・雑なノリ・失礼な返答",time:25,profile:"丁寧さと配慮を見ている。No cap / cooked / delulu 系はほぼ地雷。"}
];

const REPLIES={time:{en:"Too late!",ja:"時間切れ。次は時間内に返してみよう。"}};
let exchange=0,previousChoice=null,selectedChar=null,route=[],charRoute=[],turn=0,heart=5,combo=0,maxCombo=0,locked=false,timer=null,timeLeft=0,totalTime=0,log=[],recentAnswers=[];
const MAX_HEART=15,MIN_HEART=0,app=document.getElementById("app"),flash=document.getElementById("flash");
function showTitle(){app.innerHTML=INFO_HTML+`<div class="header"><div class="logo">🍣 Sushi Talk</div><a class="smallLink" href="./index.html">すし単へ</a></div><div class="card"><div class="title">Sushi Talk</div><button class="btn" style="width:100%;margin-top:8px" onclick="startSet()">START</button></div>`;}
async function showCharacterSelect(){await preloadSprites();app.innerHTML=INFO_HTML+`<div class="header"><div class="logo">🍣 Sushi Talk</div><a class="smallLink" href="./index.html">すし単へ</a></div><div class="card"><div class="title" style="font-size:36px;margin-top:4px">誰と話す？</div><p class="lead" style="margin-bottom:0">同じ返答でも、相手によってスコアが変わります。</p></div><div class="characterList">${CHARACTERS.map(ch=>`<button class="characterSelect" onclick="startRoute('${ch.id}')"><div class="miniSpriteWrap"><div class="miniSprite" style="--sheet:url('${ch.sheet}')"></div></div><div><div class="selectName">${ch.name}</div><span class="selectType">${ch.type}</span><div class="ruleGrid"><div class="ruleBox good">👍 最高<br>${ch.best}</div><div class="ruleBox bad">👎 マイナス<br>${ch.worst}</div></div><div style="margin-top:6px;color:var(--muted);font-size:12px;font-weight:800;line-height:1.45">${ch.profile}</div></div></button>`).join("")}</div>`;}
function startSet(){charRoute=shuffle(CHARACTERS).slice(0,5);clearInterval(timer);route=sample(window.SushiTalkConversations,5);turn=0;exchange=0;previousChoice=null;heart=5;combo=0;maxCombo=0;locked=false;log=[];recentAnswers=[];nextTurn();}
function startRoute(id){selectedChar=CHARACTERS.find(c=>c.id===id);charRoute=[selectedChar];clearInterval(timer);route=sample(window.SushiTalkConversations,5);turn=0;exchange=0;previousChoice=null;heart=5;combo=0;maxCombo=0;locked=false;log=[];recentAnswers=[];nextTurn();}
function nextTurn(){clearInterval(timer);if(turn>=route.length||(heart<=0&&exchange===0)){showResult();return;}selectedChar=charRoute[turn%charRoute.length];locked=false;renderTurn();startTimer(selectedChar.time);}
function renderHearts(){let full=Math.max(0,Math.min(MAX_HEART,heart));return "❤️".repeat(full)+"🤍".repeat(Math.max(0,10-full));}

function hasTag(ans,tag){return (ans.tags||[]).includes(tag);}
function scoreAnswer(char,ans){
  let s=0;
  const tags=ans.tags||[];
  for(const t of tags){
    if(char.likes.includes(t))s+=2;
    if(char.hates.includes(t))s-=3;
  }
  if(tags.includes("rude"))s-=40;
  if(tags.includes("too_edgy"))s-=3;
  if(tags.includes("cold"))s-=3;
  if(tags.includes("chaotic"))s-=2;
  if(tags.includes("empathy"))s+=1;
  if(tags.includes("honest"))s+=.8;
  if(tags.includes("safe"))s+=.8;
  if(tags.includes("daily"))s+=.8;

  // キャラ差をはっきり出す
  if(char.id==="sushi"){
    if(tags.includes("slang"))s-=2.5;
    if(tags.includes("meme")||tags.includes("internet"))s-=2;
    if(tags.includes("polite"))s+=.3;
    if(tags.includes("friendly")||tags.includes("empathy"))s+=1.2;
  }
  if(char.id==="malia"){
    if(tags.includes("slang"))s-=5;
    if(tags.includes("meme")||tags.includes("internet"))s-=4;
    if(tags.includes("polite")||tags.includes("careful"))s+=2;
    if(tags.includes("safe"))s+=1.5;
  }
  if(char.id==="ally"){
    if(tags.includes("polite")||tags.includes("formal")||tags.includes("stiff"))s-=2.5;
    if(tags.includes("meme")||tags.includes("internet"))s+=1.8;
  }
  if(char.id==="mark"){
    if(tags.includes("polite")||tags.includes("formal")||tags.includes("passive"))s-=2;
    if(tags.includes("positive")||tags.includes("challenge")||tags.includes("hype"))s+=1.5;
  }
  if(char.id==="susie"){
    if(tags.includes("polite")||tags.includes("formal")||tags.includes("stiff"))s-=2;
    if(tags.includes("cute")||tags.includes("friendly")||tags.includes("hype"))s+=1.3;
  }
  return s;
}
function buildChoices(sc,char){
  const ranked=sc.answers.map(x=>({...x,score:scoreAnswer(char,x)})).sort((a,b)=>b.score-a.score);
  return shuffle(ranked.map((x,i)=>({...x,delta:[3,1,0,-3][i],role:["best","good","zero","bad"][i]})));
}
function currentScenario(){return exchange===0?route[turn]:route[turn].followup;}
function renderTurn(){const sc=currentScenario();const choices=buildChoices(sc,selectedChar);window.currentChoices=choices;app.innerHTML=INFO_HTML+`<div class="header"><div class="logo">🍣 Sushi Talk</div><a class="smallLink" href="./index.html">すし単へ</a></div><div class="status"><div class="stat"><div class="statLabel">会話 · 往復</div><div class="statValue">${turn+1}/${route.length} · ${exchange+1}/2</div></div><div class="stat"><div class="statLabel">TARGET</div><div class="statValue" style="font-size:17px">${selectedChar.name}</div></div><div class="stat"><div class="statLabel">COMBO</div><div class="statValue">${combo}</div></div></div><div class="card"><div class="heartLine">${renderHearts()}</div><div class="heartHint">4択・2往復。相手の性格で返答の印象が変わる。</div></div><div class="timerWrap"><div class="timerFill" id="timerFill"></div></div><div class="card conversationCard" id="characterCard"><div class="conversationHero"><div class="spriteWrap"><div class="sprite normal float" id="sprite" style="--sheet:url('${selectedChar.sheet}')"></div></div><div><div class="charName">${selectedChar.name}</div><span class="charType">${selectedChar.type}</span><div class="comboBadge">${combo>1?combo+" COMBO":"VIBE CHECK"}</div><div class="bubble"><div class="sceneInBubble">${esc(sc.s)}</div><div class="en">${esc(sc.en)}</div><div class="ja">${esc(sc.ja)}</div></div></div></div>${previousChoice?`<div class="history"><b>前の会話</b><br>${esc(route[turn].en)}<br><b>YOU:</b> ${esc(previousChoice.en)}<br><span>${esc(previousChoice.ja)}</span></div>`:""}<div class="choiceAreaInCard">${choices.map((choice,i)=>`<button class="choice" onclick="choose(${i})"><div class="choiceEN">${esc(choice.en)}</div><div class="choiceJA">${esc(choice.ja)}</div></button>`).join("")}</div><div class="replyBubble hidden" id="feedback"></div></div>`;}
function startTimer(sec){totalTime=sec;timeLeft=sec;const fill=()=>{const el=document.getElementById("timerFill");if(el)el.style.width=Math.max(0,(timeLeft/totalTime)*100)+"%";};fill();timer=setInterval(()=>{if(locked)return;timeLeft-=.1;fill();if(timeLeft<=0)timeoutChoose();},100);}
function choose(index){if(locked)return;locked=true;clearInterval(timer);const choice=window.currentChoices[index];if(!choice){locked=false;return;}applyResult(choice,choice.delta,index,false);}
function timeoutChoose(){if(locked)return;locked=true;clearInterval(timer);applyResult({en:"TIME OUT",ja:"時間切れ",delta:-3,role:"bad"},-3,null,true);}
function applyResult(choice,delta,index,isTimeout){window.SushiAchievementEvents?.answer('sushitalk',selectedChar.id+':'+route[turn].id+':'+exchange,!isTimeout&&delta>0);heart=Math.max(MIN_HEART,Math.min(MAX_HEART,heart+delta));if(delta===3){combo++;}else{combo=0;}maxCombo=Math.max(maxCombo,combo);const tier=isTimeout?"time":delta===3?"best":delta===1?"good":delta===0?"zero":"bad";const expression=delta===3?"love":delta===1?"good":delta===0?"shock":"bad";const reply=exchange===0?{en:(isTimeout?"Still there? ":delta<0?"That felt a little harsh. ":"")+route[turn].followup.en,ja:(isTimeout?"聞いてる？ ":delta<0?"ちょっときつい言い方だったね。 ":"")+route[turn].followup.ja}:isTimeout?REPLIES.time:delta<0?{en:"I wish you’d been more considerate.",ja:"もう少し気遣ってほしかったな。"}:route[turn].ending;log.push({turn:turn+1,char:selectedChar.name,exchange:exchange+1,scene:currentScenario().ja,choice:choice.en,ja:choice.ja,delta,replyEN:reply.en,replyJA:reply.ja,role:choice.role||tier});if(choice.en!=="TIME OUT"){recentAnswers.push(choice.en);recentAnswers=recentAnswers.slice(-22);}document.querySelectorAll(".choice").forEach((btn,i)=>{btn.classList.add("locked");if(i===index)btn.classList.add("selected");});const sprite=document.getElementById("sprite");sprite.className="sprite "+expression+" pop";const card=document.getElementById("characterCard");if(delta<0)card.classList.add("shake");triggerFlash(delta===3?"best":delta<0?"bad":"good");const feedback=document.getElementById("feedback");feedback.classList.remove("hidden");feedback.innerHTML=`<div class="tapNext">${exchange===0?"次の返答へ（2/2）":turn+1===route.length||heart<=0?"結果を見る":"次の会話へ"}</div><div class="delta ${delta<0?'bad':''}">${delta>0?"+"+delta:delta}</div><div class="replyEN">${esc(reply.en)}</div><div class="replyJA">${esc(reply.ja)}</div>${exchange===1?`<p class="phraseNote">${esc(route[turn].note)}</p>`:""}<div class="heartLine" style="font-size:23px;margin-top:8px">${renderHearts()}</div>`;let advanced=false;feedback.onclick=()=>{if(advanced)return;advanced=true;if(exchange===0){previousChoice=choice;exchange=1;}else{turn++;exchange=0;previousChoice=null;}nextTurn();};feedback.setAttribute("role","button");feedback.tabIndex=0;feedback.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();feedback.onclick();}};feedback.scrollIntoView({block:"nearest",behavior:"smooth"});}
function triggerFlash(type){flash.className="flash "+type;setTimeout(()=>flash.className="flash",600);}
function showResult(){clearInterval(timer);let rank="CLASSMATE",comment="会話は成立した。でも攻略にはまだ遠い。";if(heart>=13){rank="BEST FRIEND";comment="かなり自然に会話できた。";}else if(heart>=10){rank="GOOD FRIEND";comment="かなり好印象。空気は読めている。";}else if(heart>=7){rank="FRIEND";comment="悪くない。自然な返答も選べている。";}else if(heart>=4){rank="AWKWARD";comment="少し気まずい。返答のノリを見直そう。";}else{rank="GAME OVER";comment="空気が崩壊した。地雷表現を確認しよう。";}app.innerHTML=INFO_HTML+`<div class="header"><div class="logo">🍣 Sushi Talk</div><a class="smallLink" href="./index.html">すし単へ</a></div><div class="card"><div class="title" style="font-size:36px;margin-top:4px">RESULT</div><div class="resultRank">${rank}</div><div class="heartLine" style="margin-top:10px">${renderHearts()}</div><p class="lead">${comment}<br>MAX COMBO：${maxCombo}</p><button class="btn" style="width:100%" onclick="startSet()">もう一回</button><button class="btn secondary" style="width:100%;margin-top:10px" onclick="showTitle()">タイトルへ</button></div><div class="card"><b>会話ログ</b><div class="log">${log.map(l=>`<div class="logRow"><b>${l.turn}.${l.exchange} ${esc(l.char||"")}</b>：${esc(l.scene)}<br>${esc(l.choice)}（${esc(l.ja)}） <b>${l.delta>0?"+"+l.delta:l.delta}</b><br>${esc(l.replyEN)}<br><span style="color:var(--muted)">${esc(l.replyJA)}</span></div>`).join("")}</div></div>`;}
showTitle();
</script>
