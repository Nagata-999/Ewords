function hasTag(ans,tag){return (ans.tags||[]).includes(tag);}
function scoreAnswer(char,ans){
  let s=0;
  const tags=ans.tags||[];
  for(const t of tags){
    if(char.likes.includes(t))s+=2;
    if(char.hates.includes(t))s-=3;
  }
  if(tags.includes("rude"))s-=4;
  if(tags.includes("too_edgy"))s-=3;
  if(tags.includes("cold"))s-=3;
  if(tags.includes("chaotic"))s-=2;
  if(tags.includes("empathy"))s+=1;
  if(tags.includes("honest"))s+=.8;
  if(tags.includes("safe"))s+=.8;
  if(tags.includes("daily"))s+=.8;

  // キャラ差をはっきり出す
  if(char.id==="sushi"){
    if(tags.includes("slang"))s-=2.5;
    if(tags.includes("meme")||tags.includes("internet"))s-=2;
    if(tags.includes("polite"))s+=.3;
    if(tags.includes("friendly")||tags.includes("empathy"))s+=1.2;
  }
  if(char.id==="malia"){
    if(tags.includes("slang"))s-=5;
    if(tags.includes("meme")||tags.includes("internet"))s-=4;
    if(tags.includes("polite")||tags.includes("careful"))s+=2;
    if(tags.includes("safe"))s+=1.5;
  }
  if(char.id==="ally"){
    if(tags.includes("polite")||tags.includes("formal")||tags.includes("stiff"))s-=2.5;
    if(tags.includes("meme")||tags.includes("internet"))s+=1.8;
  }
  if(char.id==="mark"){
    if(tags.includes("polite")||tags.includes("formal")||tags.includes("passive"))s-=2;
    if(tags.includes("positive")||tags.includes("challenge")||tags.includes("hype"))s+=1.5;
  }
  if(char.id==="susie"){
    if(tags.includes("polite")||tags.includes("formal")||tags.includes("stiff"))s-=2;
    if(tags.includes("cute")||tags.includes("friendly")||tags.includes("hype"))s+=1.3;
  }
  return s;
}

function flattenPools(obj){return Object.values(obj||{}).flat().filter(Boolean);}
function allAnswersFor(cat){return uniqueChoices([...flattenPools(poolsFor(cat)),...GLOBAL_RESPONSES,...ZERO_ANSWERS,...BAD_ANSWERS]);}
function getPoolForChar(cat,char){

  else if(char.id==="sushi")list=[...(p.friendly||[]),...(p.polite||[]),...GLOBAL_RESPONSES];
  else if(char.id==="ally")list=[...(p.meme||[]),...(p.slang||[]),...GLOBAL_RESPONSES,...(p.friendly||[])];
  else if(char.id==="mark")list=[...(p.slang||[]),...(p.meme||[]),...GLOBAL_RESPONSES,...(p.friendly||[])];
  else if(char.id==="susie")list=[...(p.slang||[]),...(p.friendly||[]),...GLOBAL_RESPONSES,...(p.meme||[])];
  else list=[...(p.friendly||[]),...(p.polite||[]),...GLOBAL_RESPONSES,...(p.slang||[]),...(p.meme||[])];
  return uniqueChoices(list).filter(x=>!recentAnswers.includes(x.en));
}
function rankedCandidates(list,char,exclude){
  return uniqueChoices(list)
    .filter(x=>x && !exclude.has(x.en) && !recentAnswers.includes(x.en))
    .map(x=>({x,score:scoreAnswer(char,x)}))
    .sort((a,b)=>b.score-a.score);
}
function takeByRange(list,char,min,max,exclude,n){
  const out=[];
  const ranked=rankedCandidates(list,char,exclude).filter(o=>o.score>=min&&o.score<=max);
  for(const o of ranked){
    if(out.length>=n)break;
    exclude.add(o.x.en);
    out.push(o.x);
  }
  return out;
}
function fillRandom(out,list,exclude,n,role,delta){
  const cands=shuffle(uniqueChoices(list).filter(x=>x && !exclude.has(x.en) && !recentAnswers.includes(x.en)));
  for(const x of cands){
    if(out.length>=n)break;
    exclude.add(x.en);
    out.push({...x,role,delta});
  }
}
function buildChoices(sc,char){
  const used=new Set();

  const all=allAnswersFor(sc.cat);

  const choices=[];
  const best=takeByRange([...main,...all],char,4.5,99,used,1);
  best.forEach(x=>choices.push({...x,delta:3,role:"best"}));

  let good=takeByRange([...main,...all],char,2.2,4.49,used,2);
  good.forEach(x=>choices.push({...x,delta:1,role:"good"}));

  let zero=takeByRange([...all],char,-.5,2.19,used,3);

  let bad=takeByRange([...all],char,-99,-.51,used,4);
  bad.forEach(x=>choices.push({...x,delta:-3,role:"bad"}));

  // 足りない場合の保険。必ず6択に近づける。
  fillRandom(choices,[...ZERO_ANSWERS,...GLOBAL_RESPONSES],used,6,"zero",0);
  fillRandom(choices,[...BAD_ANSWERS,...all],used,10,"bad",-3);

  // ベストが取れなかった場合は、最高スコアのものを1つだけ正解にする。
  if(!choices.some(x=>x.role==="best")){
    const top=rankedCandidates([...main,...all],char,used)[0];
    if(top){used.add(top.x.en);choices.unshift({...top.x,delta:3,role:"best"});}
  }

  return shuffle(choices.slice(0,6));
}
function renderTurn(){const sc=route[turn];const choices=buildChoices(sc,selectedChar);window.currentChoices=choices;app.innerHTML=INFO_HTML+`<div class="header"><div class="logo">🍣 Sushi Talk</div><a class="smallLink" href="./index.html">すし単へ</a></div><div class="status"><div class="stat"><div class="statLabel">TURN</div><div class="statValue">${turn+1}/${route.length}</div></div><div class="stat"><div class="statLabel">TARGET</div><div class="statValue" style="font-size:17px">${selectedChar.name}</div></div><div class="stat"><div class="statLabel">COMBO</div><div class="statValue">${combo}</div></div></div><div class="card"><div class="heartLine">${renderHearts()}</div><div class="heartHint">好感度：6択。相手の性格で正解が変わる。</div></div><div class="timerWrap"><div class="timerFill" id="timerFill"></div></div><div class="card conversationCard" id="characterCard"><div class="conversationHero"><div class="spriteWrap"><div class="sprite normal float" id="sprite" style="--sheet:url('${selectedChar.sheet}')"></div></div><div><div class="charName">${selectedChar.name}</div><span class="charType">${selectedChar.type}</span><div class="comboBadge">${combo>1?combo+" COMBO":"VIBE CHECK"}</div><div class="bubble"><div class="sceneInBubble">${esc(sc.s)}</div><div class="en">${esc(sc.en)}</div><div class="ja">${esc(sc.ja)}</div></div></div></div><div class="choiceAreaInCard">${choices.map((choice,i)=>`<button class="choice" onclick="choose(${i})"><div class="choiceEN">${esc(choice.en)}</div><div class="choiceJA">${esc(choice.ja)}</div></button>`).join("")}</div><div class="replyBubble hidden" id="feedback"></div></div>`;}
function startTimer(sec){totalTime=sec;timeLeft=sec;const fill=()=>{const el=document.getElementById("timerFill");if(el)el.style.width=Math.max(0,(timeLeft/totalTime)*100)+"%";};fill();timer=setInterval(()=>{if(locked)return;timeLeft-=.1;fill();if(timeLeft<=0)timeoutChoose();},100);}
function choose(index){if(locked)return;locked=true;clearInterval(timer);const choice=window.currentChoices[index];applyResult(choice,choice.delta,index,false);}
function timeoutChoose(){if(locked)return;locked=true;clearInterval(timer);applyResult({en:"TIME OUT",ja:"時間切れ",delta:-3,role:"bad"},-3,null,true);}
function applyResult(choice,delta,index,isTimeout){heart=Math.max(MIN_HEART,Math.min(MAX_HEART,heart+delta));if(delta===3){combo++;}else{combo=0;}maxCombo=Math.max(maxCombo,combo);const tier=isTimeout?"time":delta===3?"best":delta===1?"good":delta===0?"zero":"bad";const expression=delta===3?"love":delta===1?"good":delta===0?"shock":"bad";const reply=getReply(tier);log.push({turn:turn+1,scene:route[turn].ja,choice:choice.en,ja:choice.ja,delta,replyEN:reply.en,replyJA:reply.ja,role:choice.role||tier});if(choice.en!=="TIME OUT"){recentAnswers.push(choice.en);recentAnswers=recentAnswers.slice(-22);}document.querySelectorAll(".choice").forEach((btn,i)=>{btn.classList.add("locked");if(i===index)btn.classList.add("selected");});const sprite=document.getElementById("sprite");sprite.className="sprite "+expression+" pop";const card=document.getElementById("characterCard");if(delta<0)card.classList.add("shake");triggerFlash(delta===3?"best":delta<0?"bad":"good");const feedback=document.getElementById("feedback");feedback.classList.remove("hidden");feedback.innerHTML=`<div class="tapNext">TAP TO CONTINUE</div><div class="delta ${delta<0?'bad':''}">${delta>0?"+"+delta:delta}</div><div class="replyEN">${esc(reply.en)}</div><div class="replyJA">${esc(reply.ja)}</div><div class="heartLine" style="font-size:23px;margin-top:8px">${renderHearts()}</div>`;feedback.onclick=()=>{turn++;nextTurn();};}
function getReply(tier){if(tier==="time")return REPLIES.time;const pool=REPLIES[tier];const i=Math.floor(Math.random()*pool.en.length);return{en:pool.en[i],ja:pool.ja[i]};}
function triggerFlash(type){flash.className="flash "+type;setTimeout(()=>flash.className="flash",600);}
function showResult(){clearInterval(timer);let rank="CLASSMATE",comment="会話は成立した。でも攻略にはまだ遠い。";if(heart>=13){rank="BEST FRIEND";comment="完全攻略。相手のノリを読み切った。";}else if(heart>=10){rank="GOOD FRIEND";comment="かなり好印象。あと一歩で親友。";}else if(heart>=7){rank="FRIEND";comment="悪くない。空気はだいたい読めている。";}else if(heart>=4){rank="AWKWARD";comment="少し気まずい。地雷を踏みすぎた。";}else{rank="GAME OVER";comment="空気が崩壊した。相手の嫌いな返答を確認しよう。";}app.innerHTML=INFO_HTML+`<div class="header"><div class="logo">🍣 Sushi Talk</div><a class="smallLink" href="./index.html">すし単へ</a></div><div class="card"><div class="title" style="font-size:36px;margin-top:4px">RESULT</div><div class="resultRank">${rank}</div><div class="heartLine" style="margin-top:10px">${renderHearts()}</div><p class="lead">${selectedChar.name}：${comment}<br>MAX COMBO：${maxCombo}</p><button class="btn" style="width:100%" onclick="startRoute('${selectedChar.id}')">同じ相手でもう一回</button><button class="btn secondary" style="width:100%;margin-top:10px" onclick="showCharacterSelect()">相手を変える</button></div><div class="card"><b>会話ログ</b><div class="log">${log.map(l=>`<div class="logRow"><b>${l.turn}. ${selectedChar.name}</b>：${esc(l.scene)}<br>${esc(l.choice)}（${esc(l.ja)}） <b>${l.delta>0?"+"+l.delta:l.delta}</b><br>${esc(l.replyEN)}<br><span style="color:var(--muted)">${esc(l.replyJA)}</span></div>`).join("")}</div></div>`;}
showTitle();
</script>


<script>
/* Sushi Talk fixed start: 5 rounds, all 5 characters once */
(function(){
  function shuffleArray(arr){
    return [...arr].sort(function(){ return Math.random() - 0.5; });
  }

  window.startFiveSet = function(){
    if(typeof CHARACTERS === "undefined") return;
    window.__sushiTalkCharacterQueue = shuffleArray(CHARACTERS).slice(0,5);
    window.__sushiTalkRoundLimit = 5;
    window.__sushiTalkRoundIndex = 0;

    const first = window.__sushiTalkCharacterQueue[0];

    try{
      if(typeof startGame === "function"){
        // 元コードが startGame(character) 型ならこちらで動く
        if(startGame.length >= 1){
          return startGame(first);
        }
        // 元コードが state.selectedCharacter を読む型に備える
        if(typeof state !== "undefined"){
          state.character = first;
          state.currentCharacter = first;
          state.selectedCharacter = first;
          state.round = 0;
          state.maxRound = 5;
          state.totalRounds = 5;
        }
        window.currentCharacter = first;
        return startGame();
      }
    }catch(e){
      console.error(e);
    }
  };

  // STARTボタンのonclickを安全に上書き
  function patchStartButtons(){
    document.querySelectorAll("button, .btn").forEach(function(btn){
      const txt = (btn.textContent || "").trim().toLowerCase();
      if(txt.includes("start") || txt.includes("スタート")){
        btn.onclick = function(ev){
          ev.preventDefault();
          window.startFiveSet();
        };
      }
    });
  }

  document.addEventListener("DOMContentLoaded", patchStartButtons);
  setTimeout(patchStartButtons, 300);
  setTimeout(patchStartButtons, 1000);
})();
</script>
