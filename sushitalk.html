/* unified conversation UI */
.conversationCard{position:relative;overflow:visible;padding-top:20px}
.conversationHero{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:end}
.conversationCard .spriteWrap{margin-top:-10px;margin-left:-2px;box-shadow:0 16px 30px rgba(75,49,22,.08)}
.talkPanel{min-width:0;padding-bottom:4px}
.bubble{position:relative;background:var(--blue);border-radius:20px;padding:13px 15px;margin-top:12px;color:#1d3448}
.bubble::before{content:"";position:absolute;left:-10px;top:24px;width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-right:12px solid var(--blue)}
.bubble .en{font-size:22px;font-weight:1000;line-height:1.35}
.bubble .ja{color:#435064;margin-top:4px;font-size:14px;font-weight:700}
.choiceAreaInCard{margin-top:12px;display:grid;gap:10px}
.replyBubble{position:relative;background:#fff8ee;border:1px solid #f2dec5;border-radius:20px;padding:14px 15px;margin-top:12px;text-align:center;cursor:pointer}
.replyBubble::before{content:"";position:absolute;left:28px;top:-10px;width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:11px solid #fff8ee}
.sceneInBubble{font-size:16px;font-weight:900;line-height:1.45;margin-bottom:8px;color:var(--ink)}
@media(max-width:480px){
.conversationHero{grid-template-columns:130px 1fr;gap:10px;align-items:end}
.bubble .en{font-size:18px}.bubble{padding:11px 12px;border-radius:17px}
.bubble::before{left:-8px;top:22px;border-top:8px solid transparent;border-bottom:8px solid transparent;border-right:10px solid var(--blue)}
}

.conversationCard .sprite,

  window.currentChoices=choices;
}
function startTimer(sec){totalTime=sec;timeLeft=sec;const fill=()=>{const el=document.getElementById("timerFill");if(el)el.style.width=Math.max(0,(timeLeft/totalTime)*100)+"%"};fill();timer=setInterval(()=>{if(locked)return;timeLeft-=.1;fill();if(timeLeft<=0)timeoutChoose()},100)}function timeoutChoose(){if(locked)return;locked=true;clearInterval(timer);combo=0;applyResult(null,{score:0,tier:"worst",expression:"shock",reply:["時間切れ。。。！","Too late! The vibe is gone."],affinityDelta:-8},true)}function choose(index){if(locked)return;locked=true;clearInterval(timer);const choice=window.currentChoices[index],result=evaluate(currentChar,choice);applyResult(choice,result,false,index)}function applyResult(choice,result,isTimeout,index){score+=result.score;affinity[currentChar.id]=Math.max(0,Math.min(100,affinity[currentChar.id]+result.affinityDelta));if(result.score>=70)combo++;else combo=0;maxCombo=Math.max(maxCombo,combo);log.push({turn:turn+1,char:currentChar.name,scene:currentScenario.promptJA,choice:choice?choice.en:"TIME OUT",ja:choice?choice.ja:"時間切れ",score:result.score,reply:result.reply[0],replyJA:result.reply[1],combo});document.querySelectorAll(".choice").forEach((btn,i)=>{btn.classList.add("locked");if(i===index)btn.classList.add("selected")});const sprite=document.getElementById("sprite");sprite.className="sprite "+result.expression+" pop";const card=document.getElementById("characterCard");if(result.score<=20)card.classList.add("shake");triggerFlash(result.score>=100?"best":result.score>=70?"good":result.score<=20?"bad":"good");const feedback=document.getElementById("feedback");feedback.classList.remove("hidden");feedback.innerHTML=`<div class="tapNext">TAP TO CONTINUE</div><div class="score ${result.score<30?'bad':''}">+${result.score}</div><div class="replyEN">${result.reply[0]}</div><div class="replyJA">${result.reply[1]}</div>`;feedback.onclick=()=>{turn++;nextTurn()}}
function evaluate(char,choice){let s=choice.base;for(const tag of choice.tags){if(char.likes.includes(tag))s+=16;if(char.hates.includes(tag))s-=24}const speedBonus=timeLeft>totalTime*.65?8:timeLeft>totalTime*.35?4:0;s+=speedBonus;if(combo>=2)s+=Math.min(8,combo*2);s=Math.max(0,Math.min(110,s));let tier="mid",expression="shock",affinityDelta=0;if(s<=20){tier="worst";expression="bad";affinityDelta=-10}else if(s<=60){tier="mid";expression="shock";affinityDelta=0}else if(s<100){tier="good";expression="good";affinityDelta=5}else{tier="best";expression="love";affinityDelta=10}const pool=REPLIES[char.id][tier],reply=pool[Math.floor(Math.random()*pool.length)];return{score:s,tier,expression,reply,affinityDelta}}function triggerFlash(type){flash.className="flash "+type;setTimeout(()=>flash.className="flash",600)}function showResult(){clearInterval(timer);let rank="Kinda awkward";if(score>=720)rank="Perfect Vibes";else if(score>=600)rank="Great Vibes";else if(score>=470)rank="Pretty Good";else if(score>=330)rank="Not Bad";const topAffinity=[...CHARACTERS].sort((a,b)=>affinity[b.id]-affinity[a.id])[0];app.innerHTML=`<div class="header"><div class="logo">🍣 Sushi Talk</div><a class="smallLink" href="./index.html">すし単へ</a></div><div class="card"><div class="title">RESULT</div><div class="resultScore">${score}</div><p class="lead">評価：${rank}<br>MAX COMBO：${maxCombo}<br>ベスト相性：${topAffinity.name} ❤ ${affinity[topAffinity.id]}</p><button class="btn" style="width:100%" onclick="startGame()">もう一回</button></div><div class="card"><b>キャラ好感度</b>${renderAffinity()}</div><div class="card"><b>会話ログ</b><div class="log">${log.map(l=>`<div class="logRow"><b>${l.turn}. ${l.char}</b>：${l.scene}<br>${l.choice}（${l.ja}） <b>+${l.score}</b><br>${l.reply}<br><span style="color:var(--muted)">${l.replyJA}</span></div>`).join("")}</div></div>`}function shuffle(arr){return[...arr].sort(()=>Math.random()-.5)}showTitle();
</script>
