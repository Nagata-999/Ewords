const FINAL_PROMPTS=[

];
const REPLIES={best:{en:["Perfect vibe!","You nailed it!","That was exactly right!","That landed perfectly."],ja:["最高。完全に刺さった。","これは大当たり。","空気読み、完璧。","相手の好みにかなり合った。"]},good:{en:["Nice answer.","That works.","Pretty good.","Good enough."],ja:["いい返答。","悪くない。","ちゃんと伝わった。","会話はかなり自然。"]},zero:{en:["Hmm. Okay.","Not bad, not great.","I guess that works.","A little plain."],ja:["まあ普通。","刺さりはしない。","会話は続くけど弱い。","無難だが決め手に欠ける。"]},bad:{en:["That was not it.","Ouch.","Nope.","Wrong vibe."],ja:["それは地雷。","空気が死んだ。","かなり印象ダウン。","相手の嫌いなノリを踏んだ。"]},time:{en:"Too late!",ja:"時間切れ。空気が流れた。"}};
let selectedChar=null,route=[],turn=0,heart=5,combo=0,maxCombo=0,locked=false,timer=null,timeLeft=0,totalTime=0,log=[];const MAX_HEART=15,MIN_HEART=0,app=document.getElementById("app"),flash=document.getElementById("flash");
function a(en,ja,tags){return{en,ja,tags};}
function esc(s){return String(s).replace(/[&<>'"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[m]));}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function sample(arr,n){return shuffle(arr).slice(0,n);}
function showTitle(){app.innerHTML=`<div class="header"><div class="logo">🍣 Sushi Talk</div><a class="smallLink" href="./index.html">すし単へ</a></div><div class="card"><div class="title">Sushi Talk</div><p class="lead">キャラの性格を読んで、英語の返答を選ぶ会話攻略ゲーム。<br>選択肢は毎回シャッフル＆生成。暗記より「空気読み」。</p><button class="btn" style="width:100%;margin-top:14px" onclick="showCharacterSelect()">START</button><div class="loadingNote">初回のみ画像を読み込みます</div></div>`;}
async function showCharacterSelect(){await preloadSprites();app.innerHTML=`<div class="header"><div class="logo">🍣 Sushi Talk</div><a class="smallLink" href="./index.html">すし単へ</a></div><div class="card"><div class="title" style="font-size:36px;margin-top:4px">誰と話す？</div><p class="lead">攻略する相手を選ぼう。ヒントは相手のノリだけ。答えの丸暗記では勝ちにくい。</p></div><div class="characterList">${CHARACTERS.map(ch=>`<button class="characterSelect" onclick="startRoute('${ch.id}')"><div class="miniSpriteWrap"><div class="miniSprite" style="--sheet:url('${ch.sheet}')"></div></div><div><div class="selectName">${ch.name}</div><span class="selectType">${ch.type}</span><div class="ruleGrid"><div class="ruleBox good">👍 最高<br>${ch.best}</div><div class="ruleBox bad">👎 マイナス<br>${ch.worst}</div></div><div style="margin-top:6px;color:var(--muted);font-size:12px;font-weight:800;line-height:1.45">${ch.profile}</div></div></button>`).join("")}</div>`;}
function startRoute(id){selectedChar=CHARACTERS.find(c=>c.id===id);route=sample(SCENARIOS,6);route.push(pick(FINAL_PROMPTS));turn=0;heart=5;combo=0;maxCombo=0;locked=false;log=[];nextTurn();}
function nextTurn(){clearInterval(timer);if(turn>=route.length||heart<=0){showResult();return;}locked=false;renderTurn();startTimer(selectedChar.time);}
function renderHearts(){let full=Math.max(0,Math.min(MAX_HEART,heart));return "❤️".repeat(full)+"🤍".repeat(Math.max(0,10-full));}
function getPoolForChar(cat,char){const pools=ANSWERS[cat]||ANSWERS.relate; if(char.id==="susie")return pools.slang.concat(pools.friendly||[]); if(char.id==="malia")return pools.polite.concat(pools.friendly||[]); if(char.id==="ally")return pools.meme.concat(pools.slang||[]); if(char.id==="mark")return pools.slang.concat(pools.friendly||[],pools.meme||[]); return pools.friendly.concat(pools.polite||[],pools.slang||[]);}
function scoreAnswer(char,ans){let s=0;for(const t of ans.tags||[]){if(char.likes.includes(t))s+=2;if(char.hates.includes(t))s-=3;}if((ans.tags||[]).includes("rude"))s-=2;if((ans.tags||[]).includes("cold"))s-=1;if((ans.tags||[]).includes("empathy"))s+=1;return s;}
function uniqueChoices(list){const seen=new Set(),out=[];for(const x of list){if(!seen.has(x.en)){seen.add(x.en);out.push(x);}}return out;}
function buildChoices(sc,char){let candidates=uniqueChoices(getPoolForChar(sc.cat,char));candidates.sort((x,y)=>scoreAnswer(char,y)-scoreAnswer(char,x));let best=candidates.find(x=>scoreAnswer(char,x)>=3)||candidates[0]||pick(ZERO_ANSWERS);let good=candidates.find(x=>x.en!==best.en&&scoreAnswer(char,x)>=1)||pick(ZERO_ANSWERS);let zero=pick(ZERO_ANSWERS.filter(x=>x.en!==best.en&&x.en!==good.en));let bads=uniqueChoices(BAD_ANSWERS.slice().sort((x,y)=>scoreAnswer(char,x)-scoreAnswer(char,y)));let bad=bads.find(x=>x.en!==best.en&&x.en!==good.en&&x.en!==zero.en)||pick(BAD_ANSWERS);return shuffle([{...best,delta:3,role:"best"},{...good,delta:1,role:"good"},{...zero,delta:0,role:"zero"},{...bad,delta:-3,role:"bad"}]);}
function renderTurn(){const sc=route[turn];const choices=buildChoices(sc,selectedChar);window.currentChoices=choices;app.innerHTML=`<div class="header"><div class="logo">🍣 Sushi Talk</div><a class="smallLink" href="./index.html">すし単へ</a></div><div class="status"><div class="stat"><div class="statLabel">TURN</div><div class="statValue">${turn+1}/${route.length}</div></div><div class="stat"><div class="statLabel">TARGET</div><div class="statValue" style="font-size:17px">${selectedChar.name}</div></div><div class="stat"><div class="statLabel">COMBO</div><div class="statValue">${combo}</div></div></div><div class="card"><div class="heartLine">${renderHearts()}</div><div class="heartHint">好感度：数字は見えない。反応で読め。</div></div><div class="timerWrap"><div class="timerFill" id="timerFill"></div></div><div class="card conversationCard" id="characterCard"><div class="conversationHero"><div class="spriteWrap"><div class="sprite normal float" id="sprite" style="--sheet:url('${selectedChar.sheet}')"></div></div><div><div class="charName">${selectedChar.name}</div><span class="charType">${selectedChar.type}</span><div class="comboBadge">${combo>1?combo+" COMBO":"VIBE CHECK"}</div><div class="bubble"><div class="sceneInBubble">${esc(sc.s)}</div><div class="en">${esc(sc.en)}</div><div class="ja">${esc(sc.ja)}</div></div></div></div><div class="choiceAreaInCard">${choices.map((choice,i)=>`<button class="choice" onclick="choose(${i})"><div class="choiceEN">${esc(choice.en)}</div><div class="choiceJA">${esc(choice.ja)}</div></button>`).join("")}</div><div class="replyBubble hidden" id="feedback"></div></div>`;}
function startTimer(sec){totalTime=sec;timeLeft=sec;const fill=()=>{const el=document.getElementById("timerFill");if(el)el.style.width=Math.max(0,(timeLeft/totalTime)*100)+"%";};fill();timer=setInterval(()=>{if(locked)return;timeLeft-=.1;fill();if(timeLeft<=0)timeoutChoose();},100);}
function choose(index){if(locked)return;locked=true;clearInterval(timer);const choice=window.currentChoices[index];applyResult(choice,choice.delta,index,false);}
function timeoutChoose(){if(locked)return;locked=true;clearInterval(timer);applyResult({en:"TIME OUT",ja:"時間切れ",delta:-3,role:"bad"},-3,null,true);}
function applyResult(choice,delta,index,isTimeout){heart=Math.max(MIN_HEART,Math.min(MAX_HEART,heart+delta));if(delta===3){combo++;}else{combo=0;}maxCombo=Math.max(maxCombo,combo);const tier=isTimeout?"time":delta===3?"best":delta===1?"good":delta===0?"zero":"bad";const expression=delta===3?"love":delta===1?"good":delta===0?"shock":"bad";const reply=getReply(tier);log.push({turn:turn+1,scene:route[turn].ja,choice:choice.en,ja:choice.ja,delta,replyEN:reply.en,replyJA:reply.ja,role:choice.role||tier});document.querySelectorAll(".choice").forEach((btn,i)=>{btn.classList.add("locked");if(i===index)btn.classList.add("selected");});const sprite=document.getElementById("sprite");sprite.className="sprite "+expression+" pop";const card=document.getElementById("characterCard");if(delta<0)card.classList.add("shake");triggerFlash(delta===3?"best":delta<0?"bad":"good");const feedback=document.getElementById("feedback");feedback.classList.remove("hidden");feedback.innerHTML=`<div class="tapNext">TAP TO CONTINUE</div><div class="delta ${delta<0?'bad':''}">${delta>0?"+"+delta:delta}</div><div class="replyEN">${esc(reply.en)}</div><div class="replyJA">${esc(reply.ja)}</div><div class="heartLine" style="font-size:23px;margin-top:8px">${renderHearts()}</div>`;feedback.onclick=()=>{turn++;nextTurn();};}
function getReply(tier){if(tier==="time")return REPLIES.time;const pool=REPLIES[tier];const i=Math.floor(Math.random()*pool.en.length);return{en:pool.en[i],ja:pool.ja[i]};}
function triggerFlash(type){flash.className="flash "+type;setTimeout(()=>flash.className="flash",600);}
function showResult(){clearInterval(timer);let rank="CLASSMATE",comment="会話は成立した。でも攻略にはまだ遠い。";if(heart>=13){rank="BEST FRIEND";comment="完全攻略。相手のノリを読み切った。";}else if(heart>=10){rank="GOOD FRIEND";comment="かなり好印象。あと一歩で親友。";}else if(heart>=7){rank="FRIEND";comment="悪くない。空気はだいたい読めている。";}else if(heart>=4){rank="AWKWARD";comment="少し気まずい。地雷を踏みすぎた。";}else{rank="GAME OVER";comment="空気が崩壊した。相手の嫌いな返答を確認しよう。";}app.innerHTML=`<div class="header"><div class="logo">🍣 Sushi Talk</div><a class="smallLink" href="./index.html">すし単へ</a></div><div class="card"><div class="title" style="font-size:36px;margin-top:4px">RESULT</div><div class="resultRank">${rank}</div><div class="heartLine" style="margin-top:10px">${renderHearts()}</div><p class="lead">${selectedChar.name}：${comment}<br>MAX COMBO：${maxCombo}</p><button class="btn" style="width:100%" onclick="startRoute('${selectedChar.id}')">同じ相手でもう一回</button><button class="btn secondary" style="width:100%;margin-top:10px" onclick="showCharacterSelect()">相手を変える</button></div><div class="card"><b>会話ログ</b><div class="log">${log.map(l=>`<div class="logRow"><b>${l.turn}. ${selectedChar.name}</b>：${esc(l.scene)}<br>${esc(l.choice)}（${esc(l.ja)}） <b>${l.delta>0?"+"+l.delta:l.delta}</b><br>${esc(l.replyEN)}<br><span style="color:var(--muted)">${esc(l.replyJA)}</span></div>`).join("")}</div></div>`;}
function shuffle(arr){return[...arr].sort(()=>Math.random()-.5);}
showTitle();
</script>
