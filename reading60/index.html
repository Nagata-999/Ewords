<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>すし読解60 | すし単</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#203044;background:#fbf4ea}*{box-sizing:border-box}body{margin:0}.wrap{max-width:920px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}a{color:#0f766e}.card{background:#fffaf3;border:1px solid #f0d6bb;border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 6px 24px #1720330a}h1{margin:4px 0;font-size:clamp(26px,5vw,38px)}h2{font-size:21px}.muted{color:#657286}.pill{background:#e5f5f1;color:#0f766e;border-radius:30px;padding:6px 12px;font-weight:700;font-size:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}button,select{font:inherit;border:1px solid #d8c7b5;border-radius:12px;padding:12px 16px;background:white;color:#203044}button{cursor:pointer}button.primary{background:#f4511e;border-color:#f4511e;color:white;font-weight:800}button:disabled{opacity:.45;cursor:not-allowed}.passage{line-height:1.9;font-size:17px;white-space:pre-line}.passage mark{background:#fff0a8;border-radius:4px;padding:2px}.option{display:block;border:1px solid #e7d9c9;border-radius:12px;padding:13px;margin:9px 0;background:white;cursor:pointer}.option:has(input:checked){border-color:#0f766e;background:#eefbf6}.option input{margin-right:10px}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:16px;background:#fff;border-radius:14px;text-align:center}.stat strong{display:block;font-size:24px}.feedback{background:#eff8f6;border-left:4px solid #0f766e;padding:16px;border-radius:8px;line-height:1.7}.timer{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}.small{font-size:13px}.bar{height:9px;background:#e9dfd3;border-radius:10px;overflow:hidden}.bar>div{height:100%;background:#0f766e;width:0%}@media(max-width:600px){.wrap{padding:12px}.card{padding:16px}.stats{gap:6px}.stat{padding:10px}.stat strong{font-size:19px}}
</style></head><body><main class="wrap"><header><a href="/">← すし単に戻る</a><span class="pill">IELTS READING</span></header><h1>🍣 すし読解60</h1><p class="muted">根拠を読み、60秒を目安に答えよう。時間切れでも続けられます。</p>
<section class="card"><div class="row space"><h2>学習状況</h2><button id="reset" class="small">履歴をリセット</button></div><div class="stats"><div class="stat"><strong id="attempts">0</strong><span class="small muted">解答数</span></div><div class="stat"><strong id="accuracy">—</strong><span class="small muted">初回正答率</span></div><div class="stat"><strong id="average">—</strong><span class="small muted">平均秒数</span></div></div><p class="small muted" id="reviewCount"></p><div class="bar"><div id="progress"></div></div></section>
<section class="card"><div class="row space"><div><span id="type" class="pill"></span><p class="small muted" id="counter"></p></div><span class="timer" id="timer">01:00</span></div><h2 id="title"></h2><div class="passage" id="passage"></div><h2>Question</h2><p id="question"></p><div id="choices"></div><div class="row"><button class="primary" id="submit">解答する</button><button id="skip">スキップ</button></div><div id="feedback" class="feedback hidden"></div><button id="next" class="primary hidden" style="margin-top:14px">次の問題 →</button></section><p class="small muted">学習履歴は現在この端末内に保存されます。PIN同期は今後の実装対象です。掲載問題は開発用サンプルです。</p></main>
<script>
'use strict';
const questions=[
{id:'r60-001',type:'TRUE / FALSE / NOT GIVEN',title:'Urban Green Spaces',before:'Urban parks can provide residents with opportunities for exercise and relaxation.',focus:'A recent survey found that the frequency of visits was more strongly associated with reduced stress than the total area of a park.',after:'The researchers recommended improving access to small neighborhood parks.',question:'The survey found that larger parks reduced stress more effectively than smaller parks.',options:['TRUE','FALSE','NOT GIVEN'],answer:1,explanation:'「公園の面積」より「訪問頻度」の方がストレス低減と強く関連していた。設問の主張とは矛盾する。',translation:'最近の調査では、公園の総面積よりも訪問頻度の方が、ストレスの軽減と強く関連していることが判明した。',paraphrase:'larger parks → total area of a park'},
{id:'r60-002',type:'Summary Completion',title:'The History of Paper',before:'Early paper was made using several kinds of plant fibers.',focus:'By the eighth century, papermakers in parts of Asia were using discarded cloth as a source of fiber.',after:'The technique later spread to other regions through trade.',question:'Some early papermakers reused old ______ as raw material.',options:['cloth','metal','glass','stone'],answer:0,explanation:'discarded cloth（捨てられた布）を原料としていた。old と discarded は言い換え。',translation:'8世紀までに、アジアの一部の製紙業者は繊維源として廃棄された布を使っていた。',paraphrase:'reused old → using discarded'},
{id:'r60-003',type:'Multiple Choice',title:'Coral Reef Monitoring',before:'Scientists use several methods to observe coral reefs.',focus:'Although satellite images cover large areas quickly, divers can record small changes in individual coral colonies that may not be visible from space.',after:'Both approaches are therefore used in long-term monitoring projects.',question:'What is one advantage of observations made by divers?',options:['They eliminate the need for satellite images.','They cover larger areas than satellites.','They reveal small changes in particular corals.','They require no specialist training.'],answer:2,explanation:'ダイバーは個々のサンゴ群体の小さな変化を記録できる。衛星画像の利点は広域を素早く観察できること。',translation:'衛星画像は広範囲を素早くカバーするが、ダイバーは宇宙からは見えないかもしれない個々のサンゴ群体の小さな変化を記録できる。',paraphrase:'record small changes → reveal small changes'},
{id:'r60-004',type:'Sentence Completion',title:'Public Libraries',before:'Many libraries have expanded beyond traditional book lending.',focus:'In several cities, libraries now lend equipment such as cameras and musical instruments to registered members.',after:'These services are intended to make expensive resources more accessible.',question:'Registered members can borrow cameras and ______ from some libraries.',options:['musical instruments','office buildings','school uniforms','sports tickets'],answer:0,explanation:'本文の cameras and musical instruments に直接対応する。',translation:'いくつかの都市では、図書館は登録会員にカメラや楽器などの機材を貸し出している。',paraphrase:'lend → borrow（視点の転換）'},
{id:'r60-005',type:'Matching Information',title:'How Animals Navigate',before:'Paragraph A: Some birds rely on the position of the sun during migration.',focus:'Paragraph B: Certain sea turtles appear to detect variations in the Earth’s magnetic field when traveling across oceans.',after:'Paragraph C: Many insects use visual landmarks to return to their nests.',question:'Which paragraph mentions navigation using the Earth’s magnetic field?',options:['Paragraph A','Paragraph B','Paragraph C','None of the paragraphs'],answer:1,explanation:'地磁気（Earth’s magnetic field）による移動はParagraph Bに記載されている。',translation:'一部のウミガメは海を渡る際、地球の磁場の変化を感知しているようだ。',paraphrase:'detect variations in the Earth’s magnetic field → navigation using the Earth’s magnetic field'}
];
const key='sushitan-reading60-v1';let state;try{state=JSON.parse(localStorage.getItem(key))||{history:[],queue:[],seen:{}}}catch{state={history:[],queue:[],seen:{}}}if(!Array.isArray(state.history))state.history=[];if(!Array.isArray(state.queue))state.queue=[];if(!state.seen)state.seen={};
const $=id=>document.getElementById(id);let current=null,start=0,tick=null,finished=false,served=0;let deck=questions.map(q=>q.id).sort(()=>Math.random()-.5);
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){console.warn('Storage unavailable',e)}}function fmt(t){return t<=60?'00:'+String(Math.max(0,60-t)).padStart(2,'0'):'+'+String(Math.floor((t-60)/60)).padStart(2,'0')+':'+String((t-60)%60).padStart(2,'0')}
function stats(){const h=state.history,first=h.filter(x=>x.first),right=first.filter(x=>x.correct).length;$('attempts').textContent=h.length;$('accuracy').textContent=first.length?Math.round(right/first.length*100)+'%':'—';$('average').textContent=h.length?Math.round(h.reduce((s,x)=>s+x.seconds,0)/h.length)+'秒':'—';$('reviewCount').textContent='復習待ち '+state.queue.length+'問 / サンプル '+questions.length+'問';$('progress').style.width=Math.min(100,Object.keys(state.seen).length/questions.length*100)+'%'}
function choose(){if(!deck.length)deck=questions.map(q=>q.id).sort(()=>Math.random()-.5);let eligible=state.queue.find(x=>x.due<=served);let id;if(eligible){id=eligible.id;state.queue=state.queue.filter(x=>x!==eligible)}else{id=deck.shift()}return questions.find(q=>q.id===id)||questions[0]}
function render(){clearInterval(tick);finished=false;current=choose();served++;$('type').textContent=current.type;$('counter').textContent='問題 '+current.id;$('title').textContent=current.title;$('passage').replaceChildren();for(const [i,t] of [current.before,current.focus,current.after].entries()){const el=document.createElement(i===1?'mark':'span');el.textContent=t;$('passage').append(el,document.createTextNode(i<2?'\n\n':''))}$('question').textContent=current.question;$('choices').replaceChildren();current.options.forEach((o,i)=>{const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type='radio';input.name='answer';input.value=i;label.append(input,document.createTextNode(o));$('choices').append(label)});$('feedback').classList.add('hidden');$('next').classList.add('hidden');$('submit').disabled=false;$('submit').classList.remove('hidden');$('skip').classList.remove('hidden');start=Date.now();$('timer').textContent='01:00';tick=setInterval(()=>{$('timer').textContent=fmt(Math.floor((Date.now()-start)/1000))},250);stats()}
function finish(skip=false){if(finished)return;const selected=document.querySelector('input[name=answer]:checked');if(!skip&&!selected){alert('答えを選んでください');return}finished=true;clearInterval(tick);const correct=!skip&&Number(selected.value)===current.answer,seconds=Math.floor((Date.now()-start)/1000),first=!state.seen[current.id];state.seen[current.id]=true;state.history.push({id:current.id,correct,first,seconds,date:new Date().toISOString()});if(!correct&&!state.queue.some(x=>x.id===current.id))state.queue.push({id:current.id,due:served+5});save();$('feedback').replaceChildren();const p=document.createElement('p');p.textContent=(correct?'✅ 正解！':skip?'⏭ スキップ':'❌ 不正解')+' 正解：'+current.options[current.answer]+'（'+seconds+'秒）';const d=document.createElement('p');d.textContent=current.explanation;const tr=document.createElement('p');tr.textContent='根拠の和訳：'+current.translation;const pa=document.createElement('p');pa.textContent='言い換え：'+current.paraphrase;$('feedback').append(p,d,tr,pa);$('feedback').classList.remove('hidden');$('next').classList.remove('hidden');$('submit').classList.add('hidden');$('skip').classList.add('hidden');document.querySelectorAll('input[name=answer]').forEach(x=>x.disabled=true);stats()}
$('submit').onclick=()=>finish(false);$('skip').onclick=()=>finish(true);$('next').onclick=render;$('reset').onclick=()=>{if(confirm('この端末の学習履歴を削除しますか？')){state={history:[],queue:[],seen:{}};save();stats()}};render();
</script></body></html>
