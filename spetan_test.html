<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スペたん｜昇格テスト</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#fbf4ea;color:#172033}.app{max-width:720px;margin:auto;padding:24px 16px}.head{display:flex;justify-content:space-between;align-items:center}.badge{background:#fff;border:1px solid #efd4b8;border-radius:999px;padding:9px 14px;font-weight:900}.bar{height:12px;background:#eadfd2;border-radius:99px;overflow:hidden;margin:18px 0}.fill{height:100%;background:#f4511e;width:5%}.card{background:#fffaf2;border:1px solid #efd4b8;border-radius:24px;padding:25px}.es{text-align:center;font-size:clamp(34px,8vw,56px);font-weight:900;margin:20px 0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{min-height:64px;border:2px solid #ead4bd;border-radius:16px;background:#fff;padding:13px;font-weight:800;cursor:pointer}.choice.correct{background:#ecfdf5;border-color:#34d399}.choice.wrong{background:#fef2f2;border-color:#fca5a5}.next{display:none;width:100%;margin-top:16px;border:0;border-radius:14px;background:#f4511e;color:#fff;padding:15px;font-weight:900}.result{display:none;margin-top:15px;padding:14px;background:#fff;border-radius:14px}.finish{text-align:center;padding:25px}.back{display:inline-block;background:#0f766e;color:#fff;text-decoration:none;padding:14px 20px;border-radius:14px;font-weight:900}@media(max-width:520px){.choices{grid-template-columns:1fr}}</style></head><body><main class="app" id="app"><div class="head"><div><strong>🇪🇸 スペたん 昇格テスト</strong><div id="target"></div></div><span class="badge" id="count">1 / 20</span></div><div class="bar"><div class="fill" id="fill"></div></div><section class="card"><div class="es" id="es">読み込み中...</div><div class="choices" id="choices"></div><div class="result" id="result"></div><button class="next" id="next">次の問題</button></section></main><script src="spetan_test.js"></script></body></html>
