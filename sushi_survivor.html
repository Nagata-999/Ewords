<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>すしサバイバー v0.10</title>
<style>
:root{--bg1:#fff8ef;--bg2:#ffe2b3;--ink:#2d2116;--sub:#826146;--orange:#ff8a1d;--orange2:#ffb34e;--red:#ef493d;--green:#2ca86b;--blue:#2f7ee6;--purple:#8e44ad;--gold:#d99816;--card:#fffdf8;--line:#efcf9d;--shadow:rgba(102,58,12,.18)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--ink);touch-action:none}button{font:inherit;border:0;border-radius:16px;padding:11px 15px;font-weight:1000;background:linear-gradient(180deg,var(--orange2),var(--orange));color:white;box-shadow:0 5px 0 #bb5d00;cursor:pointer}button:active{transform:translateY(3px);box-shadow:0 2px 0 #bb5d00}button.secondary{background:white;color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 #d9af72}button.ghost{background:#fff7e8;color:var(--ink);box-shadow:none;border:2px solid #efd2a5}button:disabled{opacity:.42;filter:grayscale(.3);cursor:not-allowed}.hidden{display:none!important}
#app{position:relative;width:100vw;height:100vh}.screen{position:absolute;inset:0;padding:14px;display:flex;justify-content:center;align-items:center}.panel{width:min(1100px,97vw);max-height:95vh;overflow:auto;background:rgba(255,253,248,.96);border:3px solid #f4c077;border-radius:30px;padding:20px;box-shadow:0 20px 55px var(--shadow)}h1{margin:0 0 7px;font-size:clamp(30px,5vw,56px);letter-spacing:.02em}.lead{font-weight:900;color:var(--sub);margin:0 0 16px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card{background:white;border:2px solid var(--line);border-radius:20px;padding:13px;box-shadow:0 8px 20px rgba(116,65,10,.07)}.big{font-size:27px;font-weight:1000}.muted{color:var(--sub);font-weight:750}.pill{display:inline-flex;align-items:center;gap:5px;background:white;border:2px solid var(--line);border-radius:999px;padding:6px 10px;font-weight:1000}.statbar{height:12px;background:#fff2db;border:2px solid #ebc487;border-radius:999px;overflow:hidden}.statbar>i{display:block;height:100%;background:linear-gradient(90deg,#ffb34e,#ff7a1d);width:50%}.sectionTitle{font-size:18px;font-weight:1000;margin:16px 0 8px}.part{display:inline-flex;align-items:center;gap:4px;margin:4px;padding:7px 10px;border-radius:13px;background:#fff1d9;border:2px solid #e6bd81;font-weight:1000;cursor:pointer;user-select:none}.part b{font-size:11px;background:#2d2116;color:white;border-radius:999px;padding:1px 5px}.part.used{opacity:.35}.part.lv2{background:#eaf3ff;border-color:#85b8f5}.part.lv3{background:#f4e9ff;border-color:#bd8fe8}.part.lv4{background:#fff3bd;border-color:#d99816}.slot{background:white;border:2px dashed #d7ad76;border-radius:18px;padding:10px;min-height:70px;font-weight:1000}.slot.full{border-style:solid;border-color:var(--orange);box-shadow:inset 0 0 0 2px #fff0dc}.weaponCard{display:flex;justify-content:space-between;gap:10px;align-items:center;background:white;border:2px solid var(--line);border-radius:18px;padding:11px;margin:7px 0}.weaponCard.equipped{border-color:var(--orange);background:#fff5e7}.rarity-common{color:#6b6b6b}.rarity-rare{color:var(--blue)}.rarity-epic{color:var(--purple)}.rarity-legend{color:var(--gold)}
.craftBoard{background:linear-gradient(180deg,#fff8ec,#fff);border:3px solid #eabf83;border-radius:24px;padding:14px}.tray{min-height:74px;border:3px dashed #dfb071;border-radius:20px;background:#fffaf2;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tray.empty:before{content:'部品をタップしてここに並べる';color:#9c7658;font-weight:900}.resultBox{margin-top:10px;background:#2d2116;color:white;border-radius:18px;padding:12px;font-weight:1000}.resultBox.ok{background:linear-gradient(135deg,#1f9d63,#2ecb7e)}.resultBox.no{background:linear-gradient(135deg,#5d4a3a,#2d2116)}
#game{background:radial-gradient(circle at 50% 50%,#fff9e9 0,#ffe2ad 55%,#ffc979 100%)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.hud{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.hudBox{background:rgba(255,255,255,.9);border:2px solid #e7ba78;border-radius:16px;padding:7px 11px;font-weight:1000;box-shadow:0 6px 16px rgba(86,48,8,.12)}.bottomHud{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;pointer-events:none}.weaponChip{background:rgba(255,255,255,.92);border:2px solid #e9bd7b;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:1000}.hpWrap{display:inline-flex;align-items:center;gap:7px}.hpBar{width:92px;height:10px;background:#ffe3d6;border:2px solid #e7a06d;border-radius:99px;overflow:hidden}.hpBar i{display:block;height:100%;background:linear-gradient(90deg,#2ca86b,#8ad65e);width:100%}.rollBox{margin:12px auto;background:linear-gradient(180deg,#fff6df,#fff);border:4px solid #e9bd7b;border-radius:26px;width:min(440px,90vw);padding:20px;text-align:center;box-shadow:inset 0 0 0 3px #fff4dc}.rollPart{font-size:54px;font-weight:1000;letter-spacing:.04em}.titleGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.miniStage{display:flex;justify-content:space-between;align-items:center;text-align:left;margin:8px 0;padding:12px 14px;border:3px solid #e9bd7b;border-radius:18px;background:#fff;font-weight:1000;cursor:pointer}.miniStage:hover{transform:translateY(-2px);border-color:var(--orange)}.miniStage.locked{opacity:.42;filter:grayscale(.7);cursor:not-allowed}.miniDexItem{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #f0d7b2}.stageBtn{display:flex;justify-content:space-between;align-items:center;text-align:left}.stageBtn.locked{opacity:.45;filter:grayscale(.7)}.stick{position:absolute;left:22px;bottom:24px;width:118px;height:118px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(255,255,255,.8);display:none}.knob{position:absolute;left:38px;top:38px;width:38px;height:38px;border-radius:50%;background:rgba(255,138,29,.82)}.toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);background:rgba(45,33,22,.94);color:white;border-radius:18px;padding:12px 18px;font-size:22px;font-weight:1000;z-index:40;pointer-events:none;animation:pop .9s ease forwards}@keyframes pop{0%{transform:translate(-50%,-8px) scale(.9);opacity:0}15%{opacity:1}100%{transform:translate(-50%,-42px) scale(1.04);opacity:0}}.treasure{font-size:56px;text-align:center;animation:bob 1s infinite alternate}@keyframes bob{to{transform:translateY(-8px)}}.choice{background:white;border:3px solid #e9bd7b;border-radius:20px;padding:14px;text-align:center;font-weight:1000;cursor:pointer;transition:.12s}.choice:hover{transform:translateY(-3px);border-color:var(--orange)}.dexItem{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px;border-bottom:1px solid #f0d7b2}.dexItem b{font-size:19px}.modalBg{position:absolute;inset:0;background:rgba(45,33,22,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.modal{width:min(520px,94vw);background:white;border:3px solid #f4c077;border-radius:26px;padding:20px;box-shadow:0 18px 60px rgba(0,0,0,.25);text-align:center}.shake{animation:shake .25s}@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}.titlePanel{text-align:center;max-width:760px}.homeMenu{display:grid;grid-template-columns:1fr 112px 112px;gap:16px;align-items:stretch;margin-top:22px}.stageMainBtn{font-size:26px;min-height:112px}.iconBtn{font-size:46px;min-height:112px;padding:0}.stageBtn{min-height:110px;display:flex;align-items:center;justify-content:space-between;text-align:left}

/* ===== v0.15 logo/title polish ===== */
html,body{background:#fffaf2!important;}
#title{background:#fffaf2!important;}
.titlePanel{background:#fff!important;border-color:#f1d7bc!important;box-shadow:0 18px 45px rgba(15,23,42,.08)!important;}
.titleLogo{width:min(620px,92vw);display:block;margin:0 auto 14px;padding:8px;background:#fff;border-radius:22px;filter:drop-shadow(0 10px 18px rgba(90,43,8,.12));}
.logoFallback{font-size:clamp(42px,9vw,76px);line-height:.9;font-weight:1000;color:#ff7a1d;text-shadow:0 5px 0 #fff1dc,0 12px 20px rgba(90,43,8,.18);margin:0 auto 22px;}
.topReturnBtn{margin-top:14px;background:#fff!important;color:#2d2116!important;border:2px solid #efcf9d!important;box-shadow:0 5px 0 #d9af72!important;}
.screenTopActions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:800px){.homeMenu{grid-template-columns:1fr 84px 84px!important;gap:10px}.stageMainBtn,.iconBtn{min-height:86px}.iconBtn{font-size:38px}.titleLogo{width:min(520px,96vw);padding:4px}}

@media(max-width:800px){.titleGrid{grid-template-columns:1fr}.stick{display:block}.panel{padding:14px;border-radius:23px}.grid{grid-template-columns:1fr}.hud{font-size:12px}.weaponChip{font-size:10px;padding:5px 7px}.screen{padding:9px}.big{font-size:23px}}


/* ===== v16 global navigation fixes ===== */
.globalNav{
  position:fixed;
  top:12px;
  right:12px;
  z-index:9999;
  display:flex;
  gap:8px;
  align-items:center;
  pointer-events:auto;
}
.globalNav button{
  width:48px;
  height:48px;
  padding:0;
  border-radius:15px;
  font-size:22px;
  box-shadow:0 5px 0 #d9af72,0 10px 22px rgba(116,65,10,.12);
  background:#fff;
  color:#2d2116;
  border:2px solid #efcf9d;
}
.globalNav button.titleHomeBtn{
  background:linear-gradient(180deg,#ffb34e,#ff8a1d);
  color:white;
  border:0;
  box-shadow:0 5px 0 #bb5d00,0 10px 22px rgba(116,65,10,.18);
}
.globalNav button:active{transform:translateY(3px)}
.gameHomeBtn{
  position:absolute;
  top:68px;
  right:10px;
  z-index:30;
  width:52px;
  height:52px;
  padding:0;
  border-radius:16px;
  font-size:24px;
  background:#fff;
  color:#2d2116;
  border:2px solid #efcf9d;
  box-shadow:0 6px 16px rgba(86,48,8,.12);
}
@media(max-width:800px){
  .globalNav{top:8px;right:8px;gap:6px}
  .globalNav button{width:42px;height:42px;font-size:19px;border-radius:13px}
  .gameHomeBtn{top:62px;right:8px;width:44px;height:44px;font-size:20px}
}

</style>
</head>
<body>
<div id="app">
<div class="globalNav" id="globalNav" aria-label="quick navigation"><button class="titleHomeBtn" onclick="showTitle()" title="タイトルへ戻る">🏠</button><button onclick="showForge()" title="装備">⚔️</button><button onclick="showDex()" title="図鑑">📖</button></div>
<section id="title" class="screen"><div class="panel titlePanel"><img src="images/logo.png" class="titleLogo" alt="Sushi Survivor" onerror="this.style.display='none';document.getElementById('logoFallback').classList.remove('hidden');"><div id="logoFallback" class="logoFallback hidden">SUSHI<br>SURVIVOR</div><div class="homeMenu"><button id="stageSelectBtn" class="stageMainBtn" onclick="showStageSelect()">ステージ選択</button><button id="dexIconBtn" class="iconBtn" onclick="showDex()" aria-label="図鑑">📖</button><button id="equipIconBtn" class="iconBtn" onclick="showForge()" aria-label="装備">⚔️</button></div><button class="topReturnBtn" onclick="goSushitanTop()">すし単トップに戻る</button></div></section>
<section id="stageSelect" class="screen hidden"><div class="panel"><div class="row between"><h1 style="font-size:32px">🗺 ステージ選択</h1><div class="screenTopActions"><button class="secondary" onclick="goSushitanTop()">すし単トップ</button><button class="secondary" onclick="showTitle()">タイトルへ戻る</button></div></div><div id="stageList" class="grid"></div></div></section>
<section id="forge" class="screen hidden"><div class="panel"><div class="row between"><div><h1 style="font-size:33px">⚒ 武器編集</h1><div class="muted">挑戦ステージ: <b id="stageNo"></b> / 到達最高: <b id="bestStageNo"></b></div></div><div class="screenTopActions"><button class="secondary" onclick="goSushitanTop()">すし単トップ</button><div class="pill">Dex <span id="miniDex">0</span></div></div></div><div class="grid"><div class="card"><div class="sectionTitle">装備スロット 5</div><div id="slots"></div><div class="row" style="margin-top:10px"><button onclick="startGame()">討伐ステージ開始</button><button class="secondary" onclick="lowerStage()">前ステージ周回</button></div></div><div class="card"><div class="sectionTitle">所持武器</div><div id="weaponList"></div></div></div><div class="sectionTitle">手持ち部品</div><div id="partsBox" class="card"></div><div class="sectionTitle">部品クラフト</div><div class="craftBoard"><div id="tray" class="tray empty"></div><div id="resultBox" class="resultBox no">部品を並べて単語を作ってみよう。</div><div class="row" style="margin-top:10px"><button class="ghost" onclick="undoPart()">1つ戻す</button><button class="ghost" onclick="clearTray()">クリア</button><button id="confirmCraftBtn" onclick="openConfirm()" disabled>これで決定</button></div></div><div class="row" style="margin-top:14px"><button class="secondary" onclick="showTitle()">タイトルへ戻る</button><button class="secondary" onclick="showDex()">図鑑</button></div></div></section>
<section id="game" class="screen hidden"><canvas id="cv"></canvas><button class="gameHomeBtn" onclick="showTitle()" title="タイトルへ戻る">🏠</button><div class="hud"><div class="hudBox">Stage <span id="hudStage">1</span></div><div class="hudBox">🎯 <span id="goalTxt">0/20</span></div><div class="hudBox hpWrap">❤️ <span id="hpTxt">100</span><span class="hpBar"><i id="hpGauge"></i></span></div><div class="hudBox">敵 <span id="enemyTypeTxt">🦠</span> <span id="enemyHpTxt">-</span></div></div><div id="weaponHud" class="bottomHud"></div><div class="stick" id="stick"><div class="knob" id="knob"></div></div></section>
<section id="reward" class="screen hidden"><div class="panel"><div class="row between"><button class="secondary" onclick="showTitle()">タイトルへ戻る</button><button class="secondary" onclick="goSushitanTop()">すし単トップ</button></div><div class="treasure">🎁</div><h1 style="text-align:center;font-size:34px">Stage Clear!</h1><p class="muted" style="text-align:center">報酬ロールを回して、ランダム部品を獲得。</p><div class="rollBox"><div class="muted">REWARD ROLL</div><div id="rollPart" class="rollPart">?</div><div id="rollInfo" class="muted">ボタンを押してロール開始</div></div><div class="row" style="justify-content:center"><button id="rollBtn" onclick="startRewardRoll()">ロールを回す</button><button id="takeBtn" class="secondary" onclick="takeRolledPart()" disabled>受け取る</button></div></div></section>
<section id="dex" class="screen hidden"><div class="panel"><div class="row between"><h1 style="font-size:32px">📖 Word Dex</h1><div class="screenTopActions"><button class="secondary" onclick="goSushitanTop()">すし単トップ</button><div class="pill"><span id="dexCount">0</span>/<span id="dexTotal">0</span></div></div></div><div id="dexList"></div><div class="row" style="margin-top:14px"><button onclick="showTitle()">タイトルへ戻る</button><button class="secondary" onclick="showForge()">武器編集へ</button><button class="secondary" onclick="goSushitanTop()">すし単トップ</button></div></div></section>
<div id="confirmModal" class="modalBg hidden"><div class="modal"><div class="big" id="modalWord">word</div><p id="modalInfo" class="muted"></p><div class="row" style="justify-content:center"><button onclick="confirmCraft()">決定して武器化</button><button class="secondary" onclick="closeConfirm()">やっぱり戻る</button></div></div></div>
</div>
<script>
const KILL_BASE=20;
function stageGoal(stage){return stage===1?10:stage===2?15:20+(stage-3)*8}
const ENEMY_TYPES={
 slime:{icon:'S',name:'スライム',shape:'circle',r:12,hp:1,spd:1.35,damage:1,color:'#e74b35'},
 fast:{icon:'F',name:'ファスト',shape:'triangle',r:10,hp:.75,spd:2.35,damage:.8,color:'#2f7ee6'},
 tank:{icon:'T',name:'タンク',shape:'square',r:18,hp:2.45,spd:.85,damage:1.35,color:'#8e44ad'},
 shooter:{icon:'R',name:'レンジ',shape:'diamond',r:15,hp:1.25,spd:1.05,damage:1.1,color:'#009688',shootRate:1.15,bulletSpeed:220},
 elite:{icon:'E',name:'エリート',shape:'hex',r:21,hp:3.25,spd:1.05,damage:1.8,color:'#d99816',shootRate:1.45,bulletSpeed:235},
 boss:{icon:'B',name:'ボス',shape:'boss',r:34,hp:9.8,spd:.78,damage:2.2,color:'#ef493d',shootRate:.9,bulletSpeed:255}
};
const WORDS={
 import:{parts:['im','port'],jp:'輸入する',rarity:'common',type:'rapid',power:7,rate:.42,pierce:0,desc:'連射型'},
 export:{parts:['ex','port'],jp:'輸出する',rarity:'common',type:'pierce',power:12,rate:.85,pierce:1,desc:'貫通弾'},
 report:{parts:['re','port'],jp:'報告する',rarity:'common',type:'burst',power:9,rate:.65,pierce:0,desc:'2連射'},
 portable:{parts:['port','able'],jp:'持ち運べる',rarity:'rare',type:'orbit',power:14,rate:1.1,pierce:0,desc:'回転'},
 transport:{parts:['trans','port'],jp:'輸送する',rarity:'rare',type:'missile',power:24,rate:1.15,pierce:2,desc:'ミサイル'},
 transportation:{parts:['trans','port','ation'],jp:'輸送',rarity:'epic',type:'bomb',power:34,rate:1.8,pierce:0,desc:'範囲爆発'},
 respect:{parts:['re','spect'],jp:'尊敬する',rarity:'common',type:'beam',power:10,rate:.7,pierce:1,desc:'レーザー'},
 inspect:{parts:['in','spect'],jp:'検査する',rarity:'rare',type:'beam',power:15,rate:.75,pierce:2,desc:'貫通レーザー'},
 conspicuous:{parts:['con','spic','uous'],jp:'目立つ',rarity:'epic',type:'aura',power:20,rate:.8,pierce:0,desc:'周囲攻撃'},
 inconspicuous:{parts:['in','con','spic','uous'],jp:'目立たない',rarity:'legend',type:'ghost',power:38,rate:1.0,pierce:99,desc:'全方向貫通'},
 reproduce:{parts:['re','pro','duce'],jp:'再生産する',rarity:'rare',type:'split',power:14,rate:.9,pierce:0,desc:'分裂'},
 reproduction:{parts:['re','pro','duc','tion'],jp:'再生産',rarity:'epic',type:'split',power:22,rate:1.0,pierce:0,desc:'強化分裂'},
 respectful:{parts:['re','spect','ful'],jp:'礼儀正しい・敬意を示す',rarity:'rare',type:'beam',power:17,rate:.62,pierce:1,desc:'高速レーザー'},
 respectable:{parts:['re','spect','able'],jp:'立派な・尊敬に値する',rarity:'rare',type:'homing',power:18,rate:.82,pierce:1,desc:'ホーミング'},
 inspection:{parts:['in','spect','ion'],jp:'検査',rarity:'epic',type:'beam',power:24,rate:.72,pierce:3,desc:'多段レーザー'},
 exportable:{parts:['ex','port','able'],jp:'輸出できる',rarity:'rare',type:'pierce',power:18,rate:.78,pierce:2,desc:'強化貫通'},
 importer:{parts:['im','port','er'],jp:'輸入業者',rarity:'rare',type:'rapid',power:10,rate:.30,pierce:0,desc:'超連射'},
 portability:{parts:['port','able','ity'],jp:'携帯性',rarity:'epic',type:'orbit',power:23,rate:.92,pierce:0,desc:'強化回転'}
};
const PART_HINT={im:'import / importer',ex:'export / exportable',re:'report / respect',in:'inspect / inconspicuous',con:'conspicuous',trans:'transport',port:'import / export / transport',spect:'respect / inspect',spec:'conspicuous',spic:'conspicuous',uous:'conspicuous',able:'portable / exportable / respectable',ation:'transportation',pro:'reproduce',duce:'reproduce',duc:'reproduction',tion:'reproduction',ion:'inspection',ful:'respectful',er:'importer',ity:'portability'};

// すしParts由来の「厳密一致＋別ルート＋結合語」クラフト判定。
// 例：inspect + ion、in + spect + ion、con + spec + uous のような揺れを許可する。
const CRAFT_ROUTES={};
function addCraftRoute(word, routes){
  if(!CRAFT_ROUTES[word]) CRAFT_ROUTES[word]=[];
  (routes||[]).forEach(r=>{ if(Array.isArray(r)) CRAFT_ROUTES[word].push(r); });
}
Object.keys(WORDS).forEach(w=>addCraftRoute(w,[WORDS[w].parts,[w]]));
[
 ['import', [['im','port'],['import']]],
 ['export', [['ex','port'],['export']]],
 ['report', [['re','port'],['report']]],
 ['portable', [['port','able'],['portable']]],
 ['transport', [['trans','port'],['transport']]],
 ['transportation', [['trans','port','ation'],['transport','ation'],['transportation']]],
 ['respect', [['re','spect'],['respect']]],
 ['respectful', [['re','spect','ful'],['respect','ful'],['respectful']]],
 ['respectable', [['re','spect','able'],['respect','able'],['respectable']]],
 ['inspect', [['in','spect'],['inspect']]],
 ['inspection', [['in','spect','ion'],['inspect','ion'],['inspect','tion'],['inspection']]],
 ['conspicuous', [['con','spic','uous'],['con','spec','uous'],['con','spect','uous'],['conspicuous']]],
 ['inconspicuous', [['in','con','spic','uous'],['in','con','spec','uous'],['in','con','spect','uous'],['inconspicuous']]],
 ['exportable', [['ex','port','able'],['export','able'],['exportable']]],
 ['importer', [['im','port','er'],['import','er'],['importer']]],
 ['portability', [['port','able','ity'],['portable','ity'],['portability']]],
 ['reproduce', [['re','pro','duce'],['reproduce']]],

  else if(e.shape==='diamond'){ctx.beginPath();ctx.moveTo(e.x,e.y-e.r);ctx.lineTo(e.x+e.r,e.y);ctx.lineTo(e.x,e.y+e.r);ctx.lineTo(e.x-e.r,e.y);ctx.closePath();ctx.fill();ctx.stroke()}
  else if(e.shape==='hex'){ctx.beginPath();for(let i=0;i<6;i++){let a=Math.PI/6+i*Math.PI/3;ctx.lineTo(e.x+Math.cos(a)*e.r,e.y+Math.sin(a)*e.r)}ctx.closePath();ctx.fill();ctx.stroke()}
  else if(e.shape==='boss'){ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,rr=i%2?e.r*.62:e.r;ctx.lineTo(e.x+Math.cos(a)*rr,e.y+Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.stroke()}
  else{ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();ctx.stroke()}
  ctx.fillStyle='#fff';ctx.font=`bold ${e.type==='boss'?20:12}px system-ui`;ctx.fillText(e.icon,e.x,e.y+(e.type==='boss'?7:4));
  let bw=e.type==='boss'?78:34,bh=e.type==='boss'?8:4;ctx.fillStyle='#3b2b20';ctx.fillRect(e.x-bw/2,e.y-e.r-16,bw,bh);ctx.fillStyle=e.color;ctx.fillRect(e.x-bw/2,e.y-e.r-16,Math.max(0,bw*(e.hp/e.maxHp)),bh);if(e.type==='boss'){ctx.fillStyle='#2d2116';ctx.font='bold 12px system-ui';ctx.fillText('BOSS',e.x,e.y-e.r-23)}
}
function draw(){ctx.clearRect(0,0,W,H);ctx.textAlign='center';
  if(hasBarrier()){ctx.strokeStyle='rgba(44,168,107,.42)';ctx.lineWidth=5;ctx.beginPath();ctx.arc(player.x,player.y,66,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='rgba(47,126,230,.18)';ctx.lineWidth=9;ctx.beginPath();ctx.arc(player.x,player.y,78,0,Math.PI*2);ctx.stroke()}
  ctx.font='22px system-ui';ctx.fillText('🍣',player.x,player.y+8);
  enemies.forEach(drawEnemy);bullets.forEach(drawBullet);enemyBullets.forEach(drawBullet);
  orbs.forEach(o=>{let ox=player.x+Math.cos(o.a)*58,oy=player.y+Math.sin(o.a)*58;ctx.fillStyle=o.color||'#2ca86b';ctx.beginPath();ctx.arc(ox,oy,10,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 10px system-ui';ctx.fillText('P',ox,oy+3)});
  floatTexts.forEach(f=>{ctx.globalAlpha=Math.max(0,f.life/.55);ctx.fillStyle=f.color||'#ef493d';ctx.font=`bold ${f.size||18}px system-ui`;ctx.fillText(f.txt,f.x,f.y);ctx.globalAlpha=1})}
let rolledPart=null,rollTimer=null;
function buildRewardPool(){let near=Object.values(WORDS).flatMap(w=>w.parts.filter(p=>!save.parts[p]&&w.parts.filter(x=>save.parts[x]).length>=w.parts.length-1));let pool=[...ALL_PARTS];if(near.length){for(let n of near)pool.push(n,n,n)}if(runStage>=3){pool.push('trans','con','spect','spic','uous','ation','tion')}return pool}
function reward(){rolledPart=null;$('rollPart').textContent='?';$('rollInfo').textContent='ボタンを押してロール開始';$('rollBtn').disabled=false;$('takeBtn').disabled=true;screen('reward')}
function startRewardRoll(){let pool=buildRewardPool();$('rollBtn').disabled=true;$('takeBtn').disabled=true;let count=0;clearInterval(rollTimer);rollTimer=setInterval(()=>{let p=pool[Math.floor(Math.random()*pool.length)];$('rollPart').textContent=p;$('rollInfo').textContent=(save.parts[p]?`Lv${save.parts[p]} → Lv${save.parts[p]+1}`:'NEW PART')+' / 関連: '+PART_HINT[p];count++;if(count>18){clearInterval(rollTimer);rolledPart=p;$('takeBtn').disabled=false;$('rollInfo').textContent=(save.parts[p]?`LEVEL UP候補 Lv${save.parts[p]} → Lv${save.parts[p]+1}`:'NEW PART候補')+' / 関連: '+PART_HINT[p];}},65)}
function takeRolledPart(){if(!rolledPart)return;let p=rolledPart;save.parts[p]=(save.parts[p]||0)+1;persist();toast((save.parts[p]>1?'LEVEL UP: ':'NEW PART: ')+p);setTimeout(showForge,450)}
function toast(t){let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),900)}
let stick=$('stick'),knob=$('knob');stick.addEventListener('pointerdown',drag);stick.addEventListener('pointermove',drag);stick.addEventListener('pointerup',end);stick.addEventListener('pointercancel',end);function drag(e){stick.setPointerCapture(e.pointerId);let r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,x=e.clientX-cx,y=e.clientY-cy,l=Math.hypot(x,y),m=Math.min(l,42);joy.x=l?x/l:0;joy.y=l?y/l:0;knob.style.left=38+joy.x*m+'px';knob.style.top=38+joy.y*m+'px'}function end(){joy.x=joy.y=0;knob.style.left='38px';knob.style.top='38px'}

// v0.15 failsafe: inline onclickが効かない環境でもボタンを動かす
document.addEventListener('DOMContentLoaded',()=>{
  const bind=(id,fn)=>{const el=document.getElementById(id); if(el) el.addEventListener('click',fn);};
  bind('stageSelectBtn', showStageSelect);
  bind('dexIconBtn', showDex);
  bind('equipIconBtn', showForge);
});
showTitle();
