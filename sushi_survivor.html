<div id="app">
<section id="title" class="screen"><div class="panel titlePanel"><img src="images/logo.png" class="titleLogo" alt="Sushi Survivor"><div class="homeMenu"><button class="stageMainBtn" onclick="showStageSelect()">ステージ選択</button><button class="iconBtn" onclick="showDex()" aria-label="図鑑">📖</button><button class="iconBtn" onclick="showForge()" aria-label="装備">⚔️</button></div></div></section>
<section id="stageSelect" class="screen hidden"><div class="panel"><div class="row between"><h1 style="font-size:32px">🗺 ステージ選択</h1><button class="secondary" onclick="showTitle()">戻る</button></div><div id="stageList" class="grid"></div></div></section>
<section id="forge" class="screen hidden"><div class="panel"><div class="row between"><div><h1 style="font-size:33px">⚒ 武器編集</h1><div class="muted">挑戦ステージ: <b id="stageNo"></b> / 到達最高: <b id="bestStageNo"></b></div></div><div class="pill">Dex <span id="miniDex">0</span></div></div><div class="grid"><div class="card"><div class="sectionTitle">装備スロット 5</div><div id="slots"></div><div class="row" style="margin-top:10px"><button onclick="startGame()">討伐ステージ開始</button><button class="secondary" onclick="lowerStage()">前ステージ周回</button></div></div><div class="card"><div class="sectionTitle">所持武器</div><div id="weaponList"></div></div></div><div class="sectionTitle">手持ち部品</div><div id="partsBox" class="card"></div><div class="sectionTitle">部品クラフト</div><div class="craftBoard"><div id="tray" class="tray empty"></div><div id="resultBox" class="resultBox no">部品を並べて単語を作ってみよう。</div><div class="row" style="margin-top:10px"><button class="ghost" onclick="undoPart()">1つ戻す</button><button class="ghost" onclick="clearTray()">クリア</button><button id="confirmCraftBtn" onclick="openConfirm()" disabled>これで決定</button></div></div><div class="row" style="margin-top:14px"><button class="secondary" onclick="showTitle()">戻る</button><button class="secondary" onclick="showDex()">図鑑</button></div></div></section>
<section id="game" class="screen hidden"><canvas id="cv"></canvas><div class="hud"><div class="hudBox">Stage <span id="hudStage">1</span></div><div class="hudBox">🎯 <span id="goalTxt">0/20</span></div><div class="hudBox hpWrap">❤️ <span id="hpTxt">100</span><span class="hpBar"><i id="hpGauge"></i></span></div><div class="hudBox">敵 <span id="enemyTypeTxt">🦠</span> <span id="enemyHpTxt">-</span></div></div><div id="weaponHud" class="bottomHud"></div><div class="stick" id="stick"><div class="knob" id="knob"></div></div></section>

<section id="dex" class="screen hidden"><div class="panel"><div class="row between"><h1 style="font-size:32px">📖 Word Dex</h1><div class="pill"><span id="dexCount">0</span>/<span id="dexTotal">0</span></div></div><div id="dexList"></div><div class="row" style="margin-top:14px"><button onclick="showForge()">武器編集へ</button><button class="secondary" onclick="showTitle()">戻る</button></div></div></section>
<div id="confirmModal" class="modalBg hidden"><div class="modal"><div class="big" id="modalWord">word</div><p id="modalInfo" class="muted"></p><div class="row" style="justify-content:center"><button onclick="confirmCraft()">決定して武器化</button><button class="secondary" onclick="closeConfirm()">やっぱり戻る</button></div></div></div>
</div>

function variantsForPart(id){const base=PART_ALIASES[id]||[id];return [...new Set([id,...base])].slice(0,6)}

const WORD_MAP=new Map();
function addWordKey(map,parts,w){const k=(parts||[]).map(String).join("|"); if(k&&!map.has(k)) map.set(k,w)}
function addAliasKeys(map,wKey){
  const w=WORDS[wKey]; if(!w||!Array.isArray(w.parts))return;
  addWordKey(map,w.parts,wKey);
  if(Array.isArray(w.aliases)) w.aliases.forEach(a=>Array.isArray(a)&&addWordKey(map,a,wKey));
  const lists=w.parts.map(variantsForPart);
  let total=1; lists.forEach(a=>total*=a.length);
  if(total>220) return;
  const rec=(i,acc)=>{ if(i===lists.length){addWordKey(map,acc,wKey);return;} lists[i].forEach(v=>rec(i+1,[...acc,v])); };
  rec(0,[]);
}
Object.keys(WORDS).forEach(w=>addAliasKeys(WORD_MAP,w));

function lookupWordByIds(ids){return WORD_MAP.get((ids||[]).map(String).join("|"))||null}
function findWordByParts(parts){
  const ids=(parts||[]).map(x=>String(x||'').toLowerCase()).filter(Boolean);
  if(!ids.length)return null;
  const hit=lookupWordByIds(ids); if(hit)return hit;
  const joined=ids.join('');
  return Object.keys(WORDS).find(w=>w.toLowerCase()===joined)||null;
}

  if(save.equipped.length===0){toast('武器を装備してくれ');return}
  runStage=save.stage;ended=false;screen('game');player={x:W/2,y:H/2,r:15};enemies=[];bullets=[];enemyBullets=[];orbs=[];floatTexts=[];killGoal=stageGoal(runStage);ko=0;hp=100;cool={};spawnMeter=0;spawnedCount=0;last=performance.now();
  $('hudStage').textContent=runStage;$('goalTxt').textContent=`0/${killGoal}`;$('hpTxt').textContent=hp;$('hpGauge').style.width='100%';$('enemyTypeTxt').textContent=enemyPreview(runStage);$('enemyHpTxt').textContent='-';
  $('weaponHud').innerHTML=save.equipped.map(w=>{let v=WORD_VISUAL[WORDS[w].type]||WORD_VISUAL.rapid;return `<div class="weaponChip"><span style="color:${v.color}">${v.glyph}</span> ${w} <small>独立</small></div>`}).join('');
  requestAnimationFrame(loop)
}
function winGame(){if(ended)return;ended=true;save.stage=Math.max(save.stage,runStage+1);save.bestStage=Math.max(save.bestStage,save.stage);persist();reward()}
function loseGame(){if(ended)return;ended=true;save.stage=Math.max(1,runStage-1);persist();toast('Stage '+runStage+'失敗。Stage '+save.stage+'を周回しよう');setTimeout(showForge,1050)}
function enemyPreview(stage){let arr=['S'];if(stage>=2)arr.push('F');if(stage>=3)arr.push('T','R');if(stage>=4)arr.push('E');arr.push('B');return arr.join(' ')}
function chooseEnemyType(){
  let r=Math.random();
  if(spawnedCount===killGoal-1)return 'boss';
  if(runStage>=5 && r<Math.min(.08+runStage*.012,.28))return 'elite';
  if(runStage>=3 && r<.24)return 'shooter';
  if(runStage>=3 && r<.48)return 'tank';
  if(runStage>=2 && r<.70)return 'fast';
  return 'slime'
}
function spawn(){
  if(spawnedCount>=killGoal)return;
  let side=Math.floor(Math.random()*4),x=side<2?Math.random()*W:(side==2?-25:W+25),y=side>=2?Math.random()*H:(side==0?-25:H+25),type=chooseEnemyType(),t=ENEMY_TYPES[type],base=18+runStage*5;
  let hpMul=type==='boss'?(1+runStage*.32):1;
  enemies.push({x,y,r:t.r,hp:base*t.hp*hpMul,maxHp:base*t.hp*hpMul,spd:t.spd,type,damage:t.damage,icon:t.icon,color:t.color,shape:t.shape,shootCd:(t.shootRate||0)*(0.6+Math.random()*0.8)});spawnedCount++
}
function partBonus(w){let sum=0;WORDS[w].parts.forEach(p=>sum+=Math.max(0,partLv(p)-1));return 1+sum*.08}
function nearestEnemy(from){return enemies.reduce((a,e)=>!a||dist(from,e)<dist(from,a)?e:a,null)}
function fire(w,dt,slotIndex=0){
  let d=WORDS[w],bonus=partBonus(w),key=slotIndex+'_'+w;
  cool[key]=(cool[key]??0)-dt;
  if(cool[key]>0)return;
  let interval=Math.max(.16,d.rate/(1+bonus*.16));cool[key]+=interval;if(cool[key]<0)cool[key]=interval;
  let target=nearestEnemy(player);if(!target)return;
  let ang=Math.atan2(target.y-player.y,target.x-player.x);
  let vis=WORD_VISUAL[d.type]||WORD_VISUAL.rapid;
  let originOffset=(slotIndex-(save.equipped.length-1)/2)*9;
  let ox=player.x+Math.cos(ang+Math.PI/2)*originOffset, oy=player.y+Math.sin(ang+Math.PI/2)*originOffset;
  let mk=(ang,extra={})=>bullets.push({x:ox,y:oy,vx:Math.cos(ang)*(extra.spd||420),vy:Math.sin(ang)*(extra.spd||420),r:extra.r||5,p:d.power*bonus,life:extra.life||2,pierce:extra.pierce??d.pierce,type:d.type,word:w,color:vis.color,glyph:vis.glyph,shape:extra.shape||vis.shape,slot:slotIndex,homing:!!extra.homing});
  if(d.type==='burst'){mk(ang-.18,{shape:'star'});mk(ang+.18,{shape:'star'})}
  else if(d.type==='bomb')mk(ang,{r:10,spd:285,shape:'bomb'});
  else if(d.type==='ghost'){for(let i=0;i<10;i++)mk(i*Math.PI*2/10,{r:4,spd:540,life:1.15,shape:'ghost'})}
  else if(d.type==='orbit'){orbs.push({a:Math.random()*6.28+slotIndex*.9,life:1.25,p:d.power*bonus,word:w,color:vis.color,slot:slotIndex})}
  else if(d.type==='aura'){floatTexts.push({x:player.x,y:player.y-44-slotIndex*10,txt:'BARRIER',life:.45,color:vis.color,size:20});enemies.forEach(e=>{if(dist(player,e)<105)hit(e,d.power*bonus)})}
  else if(d.type==='split')mk(ang,{r:6,shape:'split'});
  else if(d.type==='missile')mk(ang,{r:8,spd:260,life:3.2,homing:true,shape:'homing'});
  else mk(ang,{r:d.type==='beam'?6:5,spd:d.type==='beam'?560:470});
}
function enemyShoot(e){
  let t=ENEMY_TYPES[e.type]; if(!t.shootRate)return;
  let a=Math.atan2(player.y-e.y,player.x-e.x);
  enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*(t.bulletSpeed||190),vy:Math.sin(a)*(t.bulletSpeed||190),r:e.type==='boss'?8:6,p:(e.type==='boss'?16:10)+runStage*1.2,life:4,color:e.color,shape:e.type==='boss'?'bossShot':'enemyShot'});
  if(e.type==='boss'){
    for(let off of [-.28,.28]) enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a+off)*(t.bulletSpeed*.82),vy:Math.sin(a+off)*(t.bulletSpeed*.82),r:6,p:10+runStage,life:3.2,color:'#d99816',shape:'enemyShot'});
  }
}
function updateEnemies(dt){
  enemies.forEach(e=>{
    let a=Math.atan2(player.y-e.y,player.x-e.x);
    let desiredRange=(e.type==='shooter'||e.type==='elite')?170:(e.type==='boss'?145:0);
    let dd=dist(player,e),moveDir=dd<desiredRange?-1:1;
    if(desiredRange && Math.abs(dd-desiredRange)<30) moveDir=0;
    e.x+=Math.cos(a)*e.spd*(92+runStage*9+(runStage>=3?28:0))*dt*moveDir;
    e.y+=Math.sin(a)*e.spd*(92+runStage*9+(runStage>=3?28:0))*dt*moveDir;
    if(ENEMY_TYPES[e.type].shootRate){e.shootCd-=dt;if(e.shootCd<=0){enemyShoot(e);e.shootCd=ENEMY_TYPES[e.type].shootRate*Math.max(.55,1-runStage*.025)}}
    if(dist(player,e)<player.r+e.r){let mul=hasBarrier()?.55:1;hp-=22*e.damage*mul*dt;if(hasBarrier()&&Math.random()<.12)floatTexts.push({x:player.x,y:player.y-30,txt:'BLOCK',life:.35,color:'#2ca86b',size:15});if(hp<=0)loseGame()}
  })
}
function updateBullets(dt){
  bullets.forEach(b=>{
    if(b.homing){let t=nearestEnemy(b);if(t){let targetAng=Math.atan2(t.y-b.y,t.x-b.x),speed=Math.hypot(b.vx,b.vy),cur=Math.atan2(b.vy,b.vx),diff=Math.atan2(Math.sin(targetAng-cur),Math.cos(targetAng-cur));cur+=Math.max(-4.2*dt,Math.min(4.2*dt,diff));b.vx=Math.cos(cur)*speed;b.vy=Math.sin(cur)*speed}}
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    enemies.forEach(e=>{if(!e.dead&&dist(b,e)<b.r+e.r){hit(e,b.p);b.pierce--; if(WORDS[b.word].type==='split'&&b.pierce>=0){for(let k=-1;k<=1;k+=2)bullets.push({x:b.x,y:b.y,vx:-b.vy*.75*k,vy:b.vx*.75*k,r:4,p:b.p*.45,life:.8,pierce:0,type:'mini',word:b.word,color:b.color,glyph:b.glyph,shape:'split'})} if(WORDS[b.word].type==='bomb')enemies.forEach(x=>{if(dist(b,x)<82)hit(x,b.p*.65)}); if(b.pierce<0)b.life=0;}})
  });
  bullets=bullets.filter(b=>b.life>0&&b.x>-60&&b.x<W+60&&b.y>-60&&b.y<H+60)
}
function updateEnemyBullets(dt){
  enemyBullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(dist(player,b)<player.r+b.r){let blocked=hasBarrier();hp-=b.p*(blocked?.45:1);floatTexts.push({x:player.x,y:player.y-24,txt:blocked?'BLOCK':'-'+Math.round(b.p),life:.45,color:blocked?'#2ca86b':'#ef493d',size:18});b.life=0;if(hp<=0)loseGame()}});
  enemyBullets=enemyBullets.filter(b=>b.life>0&&b.x>-80&&b.x<W+80&&b.y>-80&&b.y<H+80)
}
function updateOrbs(dt){orbs.forEach(o=>{o.life-=dt;o.a+=dt*8;let ox=player.x+Math.cos(o.a)*58,oy=player.y+Math.sin(o.a)*58;enemies.forEach(e=>{if(dist({x:ox,y:oy},e)<e.r+12)hit(e,o.p*dt*3)})});orbs=orbs.filter(o=>o.life>0)}
function loop(now){
  if($('game').classList.contains('hidden')||ended)return;requestAnimationFrame(loop);let dt=Math.min((now-last)/1000,.033);last=now;
  spawnMeter+=dt*(2.25+runStage*.28+(runStage>=3?1.05:0));
  while(spawnMeter>=1 && spawnedCount<killGoal && enemies.length<Math.min(killGoal-ko,10+runStage*2+(runStage>=3?5:0))){spawn();spawnMeter--}
  let mx=(keys['arrowright']||keys['d']?1:0)-(keys['arrowleft']||keys['a']?1:0)+joy.x,my=(keys['arrowdown']||keys['s']?1:0)-(keys['arrowup']||keys['w']?1:0)+joy.y;let len=Math.hypot(mx,my)||1;
  player.x=Math.max(18,Math.min(W-18,player.x+mx/len*220*dt));player.y=Math.max(18,Math.min(H-18,player.y+my/len*220*dt));
  save.equipped.forEach((w,i)=>fire(w,dt,i));updateEnemies(dt);updateBullets(dt);updateEnemyBullets(dt);updateOrbs(dt);
  floatTexts.forEach(f=>{f.y-=34*dt;f.life-=dt});floatTexts=floatTexts.filter(f=>f.life>0);enemies=enemies.filter(e=>!e.dead);updateEnemyHud();draw();
  $('hpTxt').textContent=Math.max(0,Math.floor(hp));$('hpGauge').style.width=Math.max(0,hp)+'%';$('goalTxt').textContent=Math.min(ko,killGoal)+'/'+killGoal;if(ko>=killGoal)winGame()
}
function hit(e,p){let dmg=Math.max(1,Math.round(p));e.hp-=p;floatTexts.push({x:e.x+(Math.random()*16-8),y:e.y-18,txt:String(dmg),life:.55,color:e.type==='boss'?'#ef493d':'#ef493d',size:e.type==='boss'?22:18});if(e.hp<=0&&!e.dead){e.dead=true;ko++}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function updateEnemyHud(){let boss=enemies.find(e=>e.type==='boss'&&!e.dead);let target=boss||enemies.reduce((a,e)=>!a||e.hp> a.hp?e:a,null);if(target){$('enemyTypeTxt').textContent=target.icon;$('enemyHpTxt').textContent=Math.ceil(target.hp)+'/'+Math.ceil(target.maxHp)}else{$('enemyTypeTxt').textContent=enemyPreview(runStage);$('enemyHpTxt').textContent='-'}}
function drawStar(x,y,r){ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:r*.45;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath();ctx.fill()}
function drawBullet(b){
  ctx.fillStyle=b.color||'#ff8a1d';ctx.strokeStyle=b.color||'#ff8a1d';ctx.lineWidth=3;
  if(b.shape==='diamond'||b.shape==='enemyShot'){ctx.beginPath();ctx.moveTo(b.x,b.y-b.r-2);ctx.lineTo(b.x+b.r+2,b.y);ctx.lineTo(b.x,b.y+b.r+2);ctx.lineTo(b.x-b.r-2,b.y);ctx.closePath();b.shape==='enemyShot'?ctx.stroke():ctx.fill()}
  else if(b.shape==='triangle'||b.shape==='homing'){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.vy,b.vx)+Math.PI/2);ctx.beginPath();ctx.moveTo(0,-b.r-5);ctx.lineTo(b.r+5,b.r+4);ctx.lineTo(-b.r-5,b.r+4);ctx.closePath();ctx.fill();ctx.restore()}
  else if(b.shape==='star'||b.shape==='split'){drawStar(b.x,b.y,b.r+5)}
  else if(b.shape==='beam'){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.vy,b.vx));ctx.fillRect(-10,-3,24,6);ctx.restore()}
  else if(b.shape==='ghost'){ctx.beginPath();ctx.arc(b.x,b.y,b.r+2,0,7);ctx.stroke()}
  else if(b.shape==='bomb'||b.shape==='bossShot'){ctx.beginPath();ctx.arc(b.x,b.y,b.r+2,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 10px system-ui';ctx.fillText(b.shape==='bossShot'?'!':'×',b.x,b.y+3)}
  else{ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()}
  if(b.word){ctx.fillStyle='#2d2116';ctx.font='10px system-ui';ctx.fillText(b.word[0],b.x,b.y+3)}
}
function drawEnemy(e){
  ctx.fillStyle=e.color;ctx.strokeStyle=e.type==='boss'?'rgba(239,73,61,.85)':'rgba(45,33,22,.35)';ctx.lineWidth=e.type==='boss'?4:2;
  if(e.shape==='triangle'){ctx.beginPath();ctx.moveTo(e.x,e.y-e.r);ctx.lineTo(e.x+e.r,e.y+e.r);ctx.lineTo(e.x-e.r,e.y+e.r);ctx.closePath();ctx.fill();ctx.stroke()}
  else if(e.shape==='square'){ctx.fillRect(e.x-e.r,e.y-e.r,e.r*2,e.r*2);ctx.strokeRect(e.x-e.r,e.y-e.r,e.r*2,e.r*2)}
  else if(e.shape==='diamond'){ctx.beginPath();ctx.moveTo(e.x,e.y-e.r);ctx.lineTo(e.x+e.r,e.y);ctx.lineTo(e.x,e.y+e.r);ctx.lineTo(e.x-e.r,e.y);ctx.closePath();ctx.fill();ctx.stroke()}
  else if(e.shape==='hex'){ctx.beginPath();for(let i=0;i<6;i++){let a=Math.PI/6+i*Math.PI/3;ctx.lineTo(e.x+Math.cos(a)*e.r,e.y+Math.sin(a)*e.r)}ctx.closePath();ctx.fill();ctx.stroke()}
  else if(e.shape==='boss'){ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,rr=i%2?e.r*.62:e.r;ctx.lineTo(e.x+Math.cos(a)*rr,e.y+Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.stroke()}
  else{ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();ctx.stroke()}
  ctx.fillStyle='#fff';ctx.font=`bold ${e.type==='boss'?20:12}px system-ui`;ctx.fillText(e.icon,e.x,e.y+(e.type==='boss'?7:4));
  let bw=e.type==='boss'?78:34,bh=e.type==='boss'?8:4;ctx.fillStyle='#3b2b20';ctx.fillRect(e.x-bw/2,e.y-e.r-16,bw,bh);ctx.fillStyle=e.color;ctx.fillRect(e.x-bw/2,e.y-e.r-16,Math.max(0,bw*(e.hp/e.maxHp)),bh);if(e.type==='boss'){ctx.fillStyle='#2d2116';ctx.font='bold 12px system-ui';ctx.fillText('BOSS',e.x,e.y-e.r-23)}
}
function draw(){ctx.clearRect(0,0,W,H);ctx.textAlign='center';
  if(hasBarrier()){ctx.strokeStyle='rgba(44,168,107,.42)';ctx.lineWidth=5;ctx.beginPath();ctx.arc(player.x,player.y,66,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='rgba(47,126,230,.18)';ctx.lineWidth=9;ctx.beginPath();ctx.arc(player.x,player.y,78,0,Math.PI*2);ctx.stroke()}
  ctx.font='22px system-ui';ctx.fillText('🍣',player.x,player.y+8);
  enemies.forEach(drawEnemy);bullets.forEach(drawBullet);enemyBullets.forEach(drawBullet);
  orbs.forEach(o=>{let ox=player.x+Math.cos(o.a)*58,oy=player.y+Math.sin(o.a)*58;ctx.fillStyle=o.color||'#2ca86b';ctx.beginPath();ctx.arc(ox,oy,10,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 10px system-ui';ctx.fillText('P',ox,oy+3)});
  floatTexts.forEach(f=>{ctx.globalAlpha=Math.max(0,f.life/.55);ctx.fillStyle=f.color||'#ef493d';ctx.font=`bold ${f.size||18}px system-ui`;ctx.fillText(f.txt,f.x,f.y);ctx.globalAlpha=1})}
let rolledPart=null,rollTimer=null;
function buildRewardPool(){let near=Object.values(WORDS).flatMap(w=>w.parts.filter(p=>!save.parts[p]&&w.parts.filter(x=>save.parts[x]).length>=w.parts.length-1));let pool=[...ALL_PARTS];if(near.length){for(let n of near)pool.push(n,n,n)}if(runStage>=3){pool.push('trans','con','spect','spic','uous','ation','tion')}return pool}
function reward(){rolledPart=null;$('rollPart').textContent='?';$('rollInfo').textContent='ボタンを押してロール開始';$('rollBtn').disabled=false;$('takeBtn').disabled=true;screen('reward')}
function startRewardRoll(){let pool=buildRewardPool();$('rollBtn').disabled=true;$('takeBtn').disabled=true;let count=0;clearInterval(rollTimer);rollTimer=setInterval(()=>{let p=pool[Math.floor(Math.random()*pool.length)];$('rollPart').textContent=p;$('rollInfo').textContent=(save.parts[p]?`Lv${save.parts[p]} → Lv${save.parts[p]+1}`:'NEW PART')+' / 関連: '+PART_HINT[p];count++;if(count>18){clearInterval(rollTimer);rolledPart=p;$('takeBtn').disabled=false;$('rollInfo').textContent=(save.parts[p]?`LEVEL UP候補 Lv${save.parts[p]} → Lv${save.parts[p]+1}`:'NEW PART候補')+' / 関連: '+PART_HINT[p];}},65)}
function takeRolledPart(){if(!rolledPart)return;let p=rolledPart;save.parts[p]=(save.parts[p]||0)+1;persist();toast((save.parts[p]>1?'LEVEL UP: ':'NEW PART: ')+p);setTimeout(showForge,450)}
function toast(t){let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),900)}
let stick=$('stick'),knob=$('knob');stick.addEventListener('pointerdown',drag);stick.addEventListener('pointermove',drag);stick.addEventListener('pointerup',end);stick.addEventListener('pointercancel',end);function drag(e){stick.setPointerCapture(e.pointerId);let r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,x=e.clientX-cx,y=e.clientY-cy,l=Math.hypot(x,y),m=Math.min(l,42);joy.x=l?x/l:0;joy.y=l?y/l:0;knob.style.left=38+joy.x*m+'px';knob.style.top=38+joy.y*m+'px'}function end(){joy.x=joy.y=0;knob.style.left='38px';knob.style.top='38px'}
showTitle();
</script>
