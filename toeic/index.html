<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>すしTOEIC</title><style>body{margin:0;background:#101c31;color:#fff;font:16px system-ui,sans-serif}main{max-width:640px;margin:24px auto;padding:22px;background:#1c2d47;border-radius:22px}h1{color:#ffce72}button{display:block;width:100%;margin:12px 0;padding:17px;border:1px solid #52627a;border-radius:12px;background:#293e5e;color:white;text-align:left;font-size:17px;cursor:pointer}button:disabled{opacity:.7}.rule{margin-top:14px;padding:14px;border-left:4px solid #ffce72;background:#243d5c;border-radius:8px}.rule strong{color:#ffce72}.rule p{margin:6px 0}.rule button{font-size:14px;padding:10px;margin:8px 0 0;text-align:center}button.correct{background:#18684a}button.wrong{background:#963c46}#next{background:#f2b84c;color:#192239;text-align:center;font-weight:bold}#status{color:#aac5de}#explain{line-height:1.7}small{color:#b5c4d7}select{background:#293e5e;color:white;padding:10px;border-radius:8px}#restart{font-size:14px;padding:10px;text-align:center}</style><main><h1>🍣 すしTOEIC</h1><p>Part 5｜10問チャレンジ（頻出パターン別学習）</p><label>難易度 <select id="level"><option value="all">すべて</option><option value="400">400点目安</option><option value="600">600点目安</option><option value="800">800点目安</option><option value="900">900点目安</option></select></label><label>分野 <select id="pattern"><option value="all">すべて</option></select></label><button id="restart" type="button">新しい10問で開始</button><div id="status"></div><h2 id="question"></h2><div id="choices"></div><p id="explain"></p><div id="rule" class="rule" hidden></div><button id="next" hidden>次の問題 →</button><small>試作版：ジェムやアカウント同期はまだ行いません。</small></main><script>const PATTERNS={"parts_of_speech":"品詞","grammar":"動詞・文法","vocabulary":"語彙","prepositions":"前置詞","adverbs":"副詞","collocations":"語法・連語","agreement":"主語と動詞の一致","relative_clauses":"関係詞","subjunctive":"仮定法・要求表現","gerunds":"動名詞","conjunctions":"接続詞"};const BANK=[["The manager will ___ the proposal tomorrow.",["review","reviewing","reviewed","reviewer"],0,"助動詞 will の後には動詞の原形が必要です。","grammar",400],["All employees must submit their reports ___ Friday.",["at","by","on","from"],1,"期限を表す「金曜日までに」は by Friday。","grammar",400],["The new software is considerably ___ than the previous version.",["efficient","more efficient","most efficient","efficiency"],1,"than があるため比較級 more efficient が適切です。","grammar",400],["Please contact Ms. Lee if you have ___ questions.",["any","much","every","each"],0,"複数名詞 questions と自然に使えるのは any。","grammar",400],["The meeting was postponed ___ the director was absent.",["although","because","unless","despite"],1,"理由を表す接続詞 because が適切です。","vocabulary",600],["The company plans to ___ its operations overseas.",["expansion","expanded","expand","expansive"],2,"plan to の後は動詞の原形 expand。","vocabulary",600],["The documents should be stored ___ in a locked cabinet.",["secure","security","securely","secured"],2,"動詞 stored を修飾する副詞 securely が必要です。","vocabulary",600],["Our customer service team is available ___ the clock.",["around","above","between","across"],0,"around the clock は「24時間体制で」という慣用表現。","vocabulary",600],["The shipment is expected to arrive ___ two business days.",["within","during","until","since"],0,"within two business days は「2営業日以内に」。","vocabulary",600],["Applicants are required to provide ___ identification.",["valid","validate","validly","validity"],0,"名詞 identification を修飾する形容詞 valid が必要です。","vocabulary",600],["The revised schedule will be distributed ___ all department heads.",["to","for","at","with"],0,"distribute A to B で「AをBに配布する」。","prepositions",600],["The marketing team has ___ completed the campaign report.",["already","yet","still","ever"],0,"肯定文の現在完了形では already が自然。","adverbs",600],["Employees are encouraged to make ___ for the training seminar.",["reservations","reserving","reserved","reserve"],0,"make reservations で「予約する」。","collocations",600],["The printer is currently out of ___ and will be repaired tomorrow.",["order","serviceable","operate","functioning"],0,"out of order は「故障中」。","collocations",400],["Please ensure that all invoices are ___ before the deadline.",["processed","processing","process","processor"],0,"受動態 are processed が必要。","grammar",600],["The new branch is located ___ the central railway station.",["near","nearly","nearest","nearness"],0,"near は場所を表す前置詞。","prepositions",400],["Our director will give a brief ___ at the conference.",["presentation","present","presented","presenting"],0,"冠詞 a と形容詞 brief の後には名詞。","parts_of_speech",400],["The contract will remain valid ___ December 31.",["until","during","since","among"],0,"期限まで継続することを示す until。","prepositions",600],["Sales increased ___ after the new product launch.",["significantly","significant","significance","signify"],0,"動詞 increased を修飾する副詞。","parts_of_speech",600],["Neither the manager nor the assistants ___ available yesterday.",["were","was","is","be"],0,"neither ... nor ... は近い主語 assistants に動詞を一致させる。","agreement",800],["The proposal, ___ was submitted last week, has been approved.",["which","who","whose","where"],0,"先行詞 proposal を受ける非制限用法の which。","relative_clauses",800],["The committee requested that the report ___ revised immediately.",["be","is","was","being"],0,"request that 節では動詞の原形 be を用いる。","subjunctive",900],["The warranty covers defects resulting ___ normal use.",["from","of","by","to"],0,"result from は「〜から生じる」。","collocations",800],["The company has invested heavily in ___ its distribution network.",["modernizing","modernize","modernized","modernization"],0,"前置詞 in の後には動名詞 modernizing。","gerunds",600],["All visitors must wear an identification badge ___ on the premises.",["while","unless","despite","because"],0,"while on the premises は「敷地内にいる間」。","conjunctions",800],["The shipment was delayed due to ___ weather conditions.",["adverse","adversely","adversity","adversarially"],0,"weather conditions を修飾する形容詞 adverse。","vocabulary",800],["The figures in the report are ___ with last year's results.",["consistent","consistently","consistency","consist"],0,"be consistent with は「〜と一致している」。","collocations",800],["The new policy takes ___ at the beginning of next month.",["effect","affect","effective","effectively"],0,"take effect は「施行される」。","collocations",600],["Applicants should submit a résumé along with two letters of ___.",["recommendation","recommended","recommend","recommending"],0,"letters of recommendation は「推薦状」。","vocabulary",600],["The supplier agreed to ___ the defective items at no extra charge.",["replace","replacement","replacing","replaced"],0,"agree to の後には動詞の原形。","grammar",400],["The supervisor recommended that each applicant ___ a copy of the certificate.",["submits","submit","submitted","submitting"],1,"recommend that 以下は (should) submit。should が隠れていたら原形！","subjunctive",800],["The director demanded that the faulty equipment ___ replaced before Monday.",["is","was","be","being"],2,"demand that 以下は (should) be replaced。should を省略しても be は原形。","subjunctive",900],["The committee suggested that the meeting ___ postponed until Friday.",["be","is","was","being"],0,"提案を表す suggest that 以下は (should) be postponed。","subjunctive",800],["The consultant requested that the figures ___ verified independently.",["are","were","be","being"],2,"request that 以下は (should) be verified。動詞は原形。","subjunctive",800]];const RULES={
by_until:{title:"by は「までに」、until は「までずっと」",detail:"締切なら by、状態が続くなら until。submit by Friday（締切）／remain valid until Friday（継続）。",ids:[1,17]},
perfect:{title:"完了形は全部「持っている」！",detail:"have + 過去分詞は今持っている、had + 過去分詞は過去の時点で持っていた、will have + 過去分詞は未来の時点で持っている。いつ持っているかを考えよう。",ids:[11]},
mandative:{title:"should が隠れていたら原形！",detail:"request・suggest・recommend・demand などで「〜すべきだ」という内容を that 節で伝えるとき、(should) + 動詞の原形。The manager requested that the report (should) be revised. should を省略しても be のまま。",ids:[21,30,31,32,33]},participle:{title:"分詞はほぼ形容詞！",detail:"名詞を説明するときは「〜している／〜された」。動詞を説明するときは「〜しながら／〜されて」のイメージで考える。",ids:[14]}
};const RULE_FOR={};for(const [key,r] of Object.entries(RULES))for(const id of r.ids)RULE_FOR[id]=key;
let pool=[],i=0,score=0,answered=false,started=0,wrong=[];const $=id=>document.getElementById(id);const key="sushi_toeic_part5_v02";function shuffle(a){for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}function start(){const level=$("level").value,pattern=$("pattern").value;pool=shuffle(BANK.map((q,id)=>({q,id})).filter(x=>(level==="all"||x.q[5]<=Number(level))&&(pattern==="all"||x.q[4]===pattern))).slice(0,10);i=0;score=0;wrong=[];started=Date.now();render()}function render(){answered=false;$("next").hidden=true;$("explain").textContent="";$("rule").hidden=true;$("rule").replaceChildren();if(i===pool.length){const seconds=Math.round((Date.now()-started)/1000);$("status").textContent="完了！ "+seconds+"秒";$("question").textContent="正解 "+score+" / "+pool.length;$("choices").innerHTML="";$("next").hidden=false;$("next").textContent="もう一度挑戦";try{localStorage.setItem(key,JSON.stringify({score,total:pool.length,seconds,wrong,pattern:$("pattern").value,date:new Date().toISOString()}))}catch(e){}return}const q=pool[i].q;$("status").textContent="問題 "+(i+1)+" / "+pool.length+"　正解 "+score+"　目安 "+q[5]+"点　"+(PATTERNS[q[4]]||"総合");$("question").textContent=q[0];$("choices").innerHTML="";q[1].forEach((c,n)=>{const b=document.createElement("button");b.textContent="ABCD"[n]+". "+c;b.onclick=()=>{if(answered)return;answered=true;if(n===q[2])score++;else wrong.push(pool[i].id);[...$("choices").children].forEach((el,j)=>{el.disabled=true;if(j===q[2])el.classList.add("correct");else if(j===n)el.classList.add("wrong")});$("explain").textContent=(n===q[2]?"⭕ 正解！ ":"❌ 不正解。 ")+q[3];const ruleKey=RULE_FOR[pool[i].id];if(ruleKey){const rule=RULES[ruleKey],box=$("rule");box.hidden=false;const title=document.createElement("strong");title.textContent="🍣 一口解説｜"+rule.title;box.appendChild(title);const more=document.createElement("button");more.textContent="詳しく見る ＋";const detail=document.createElement("p");detail.textContent=rule.detail;detail.hidden=true;more.onclick=()=>{detail.hidden=!detail.hidden;more.textContent=detail.hidden?"詳しく見る ＋":"閉じる −"};box.append(more,detail)}$("next").hidden=false};$("choices").appendChild(b)})}$("next").onclick=()=>{if(i===pool.length)start();else{i++;render()}};start();for(const [id,name] of Object.entries(PATTERNS)){const o=document.createElement("option");o.value=id;o.textContent=name;document.getElementById("pattern").appendChild(o)}document.getElementById("restart").onclick=start;</script></html>
