<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>すしTOEIC</title><style>body{margin:0;background:#101c31;color:#fff;font:16px system-ui,sans-serif}main{max-width:640px;margin:24px auto;padding:22px;background:#1c2d47;border-radius:22px}h1{color:#ffce72}button{display:block;width:100%;margin:12px 0;padding:17px;border:1px solid #52627a;border-radius:12px;background:#293e5e;color:white;text-align:left;font-size:17px;cursor:pointer}button:disabled{opacity:.7}button.correct{background:#18684a}button.wrong{background:#963c46}#next{background:#f2b84c;color:#192239;text-align:center;font-weight:bold}#status{color:#aac5de}#explain{line-height:1.7}small{color:#b5c4d7}</style><main><h1>🍣 すしTOEIC</h1><p>Part 5｜10問チャレンジ</p><div id="status"></div><h2 id="question"></h2><div id="choices"></div><p id="explain"></p><button id="next" hidden>次の問題 →</button><small>試作版：ジェムやアカウント同期はまだ行いません。</small></main><script>const Q=[["The manager will ___ the proposal tomorrow.",["review","reviewing","reviewed","reviewer"],0,"助動詞 will の後には動詞の原形が必要です。"],["All employees must submit their reports ___ Friday.",["at","by","on","from"],1,"期限を表す「金曜日までに」は by Friday。"],["The new software is considerably ___ than the previous version.",["efficient","more efficient","most efficient","efficiency"],1,"than があるため比較級 more efficient が適切です。"],["Please contact Ms. Lee if you have ___ questions.",["any","much","every","each"],0,"複数名詞 questions と自然に使えるのは any。"],["The meeting was postponed ___ the director was absent.",["although","because","unless","despite"],1,"理由を表す接続詞 because が適切です。"],["The company plans to ___ its operations overseas.",["expansion","expanded","expand","expansive"],2,"plan to の後は動詞の原形 expand。"],["The documents should be stored ___ in a locked cabinet.",["secure","security","securely","secured"],2,"動詞 stored を修飾する副詞 securely が必要です。"],["Our customer service team is available ___ the clock.",["around","above","between","across"],0,"around the clock は「24時間体制で」という慣用表現。"],["The shipment is expected to arrive ___ two business days.",["within","during","until","since"],0,"within two business days は「2営業日以内に」。"],["Applicants are required to provide ___ identification.",["valid","validate","validly","validity"],0,"名詞 identification を修飾する形容詞 valid が必要です。"]];let i=0,score=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("next").hidden=true;$("explain").textContent="";if(i===Q.length){$("status").textContent="完了！";$("question").textContent="正解 "+score+" / "+Q.length;$("choices").innerHTML="";$("next").hidden=false;$("next").textContent="もう一度挑戦";return}const q=Q[i];$("status").textContent="問題 "+(i+1)+" / "+Q.length+"　正解 "+score;$("question").textContent=q[0];$("choices").innerHTML="";q[1].forEach((c,n)=>{const b=document.createElement("button");b.textContent="ABCD"[n]+". "+c;b.onclick=()=>{if(answered)return;answered=true;if(n===q[2])score++;[...$("choices").children].forEach((el,j)=>{el.disabled=true;if(j===q[2])el.classList.add("correct");else if(j===n)el.classList.add("wrong")});$("explain").textContent=(n===q[2]?"⭕ 正解！ ":"❌ 不正解。 ")+q[3];$("next").hidden=false};$("choices").appendChild(b)})}$("next").onclick=()=>{if(i===Q.length){i=0;score=0;$("next").textContent="次の問題 →"}else i++;render()};render();</script></html>
