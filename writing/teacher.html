<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher | すし単｜作文添削</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><div><strong>すし単｜作文添削</strong><span>Teacher Dashboard</span></div><a href="index.html">Student</a><nav aria-label="サイト内ナビゲーション"><a href="../index.html">🍣 すし単へ戻る</a></nav></header><main class="wrap"><section id="loginCard" class="card"><p class="eyebrow">TEACHER LOGIN</p><h1>先生ログイン</h1><form id="loginForm"><label>Email<input id="loginEmail" type="email" autocomplete="username" required></label><label>Password<input id="loginPassword" type="password" autocomplete="current-password" required></label><button id="loginBtn" type="submit">ログイン</button><p id="loginMessage" class="message"></p></form></section><section id="dashboard" class="card hidden"><div class="row"><div><p class="eyebrow">TEACHER DASHBOARD</p><h1>作文管理</h1></div><div><span id="teacherEmail"></span> <button class="secondary" id="logout">ログアウト</button></div></div><section class="card" style="margin:18px 0"><p class="eyebrow">ASSIGNMENTS</p><div class="row"><h2>課題管理</h2><button id="toggleNewAssignment">＋ 新しい課題</button></div><form id="assignmentForm" class="hidden"><label>課題名<input id="newAssignmentTitle" required placeholder="例：IELTS Task 2 #1"></label><label>問題文<textarea id="newAssignmentPrompt" rows="5" placeholder="問題文・指示文を入力"></textarea></label><label><input id="newAssignmentActive" type="checkbox" checked> 生徒に公開する</label><div class="row"><button type="submit">課題を作成</button><span id="assignmentMessage"></span></div></form><div id="assignmentList"></div></section><div class="toolbar"><select id="assignmentFilter"><option value="">全課題</option></select><input id="classFilter" placeholder="クラス (例 2-M)"><select id="statusFilter"><option value="">全状態</option><option value="submitted">未添削</option><option value="reviewed">添削済</option><option value="returned">返却済</option></select><button id="reload">更新</button></div><div class="stats"><div class="stat">提出<b id="total">0</b></div><div class="stat">未添削<b id="pending">0</b></div><div class="stat">添削済<b id="reviewed">0</b></div><div class="stat">返却済<b id="returned">0</b></div></div><section class="card" style="margin:18px 0"><p class="eyebrow">BULK AI REVIEW</p><h2>AI一括添削</h2><p>現在の絞り込み条件のうち「未添削」の作文をまとめてChatGPTへ渡せます。</p><div class="row"><button id="copyAI">未添削をAI用にコピー</button><span id="copyMessage"></span></div><label style="margin-top:16px">ChatGPTから返ったJSONを貼り付け<textarea id="aiImport" rows="10"></textarea></label><div class="row"><button id="importAI">AI結果を一括反映</button><span id="importMessage"></span></div></section><div class="tablewrap"><table><thead><tr><th>課題</th><th>クラス</th><th>番号</th><th>氏名</th><th>Words</th><th>状態</th><th>提出日時</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><div id="modal" class="modal hidden"><div class="modalbox"><div class="row"><h2 id="studentTitle"></h2><button class="secondary" id="close">閉じる</button></div><p id="meta"></p><h3>原文</h3><div id="essayView" class="essayview"></div><h3>修正版</h3><div id="correctedView" class="essayview"></div><h3>評価</h3><div class="rubric"><label>Content<input id="contentScore" type="number" min="0" max="9"></label><label>Organization<input id="organizationScore" type="number" min="0" max="9"></label><label>Vocabulary<input id="vocabularyScore" type="number" min="0" max="9"></label><label>Grammar<input id="grammarScore" type="number" min="0" max="9"></label></div><label>コメント<textarea id="feedback" rows="6"></textarea></label><div class="row"><span id="saveMessage"></span><div><button class="secondary" id="saveReview">添削を保存</button> <button id="returnReview">返却済みにする</button></div></div></div></div><script src="config.js"></script><script src="teacher.js"></script></body></html>
