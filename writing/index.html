<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>すし単｜作文添削</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><div><strong>すし単｜作文添削</strong><span>作文提出</span></div><a href="teacher.html">Teacher</a><nav aria-label="サイト内ナビゲーション"><a href="../index.html">🍣 すし単へ戻る</a></nav></header><main class="wrap"><section class="card hero"><p class="eyebrow">WRITING SUBMISSION</p><h1>作文を提出する</h1><p>作文を提出し、返却後は過去の作文とフィードバックを確認できます。</p><a class="btn" href="feedback.html">フィードバックを見る</a></section><section class="card"><form id="submissionForm"><div class="grid3"><label>クラス<input id="className" required placeholder="2-M"></label><label>出席番号<input id="studentNo" required type="number" min="1" placeholder="1"></label><label>氏名<input id="studentName" required placeholder="氏名"></label></div><label>本人確認コード（4桁の数字）<input id="accessCode" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required placeholder="例：4821"><small>最初の提出時に自分で決めます。フィードバックを見るときに使います。</small></label><label>課題<select id="assignment" required><option value="">読み込み中...</option></select></label><div id="promptBox" class="prompt hidden"></div><label>作文<textarea id="essay" required rows="14" placeholder="Write your essay here..."></textarea></label><div class="row"><span id="wordCount">0 words</span><button type="submit" id="submitBtn">提出する</button></div><p id="message" class="message"></p></form></section></main><script src="config.js"></script><script src="app.js"></script></body></html>
