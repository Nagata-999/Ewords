function pick(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(){initAudio();list=parse($('#words').value);if(list.length<1){alert('1語以上入れてください。');return}target=Math.min(10,list.length);lives=5;score=combo=round=0;used=[];alive=true;renderDinos();update();$('#start').classList.add('hidden');showIntro()}function showIntro(){$('#intro').classList.remove('hidden');$('#introText').classList.remove('hidden');$('#countdown').classList.add('hidden');setTimeout(()=>{$('#introText').classList.add('hidden');$('#countdown').classList.remove('hidden');let n=3;$('#countdown').textContent=n;SFX.count(n);let t=setInterval(()=>{n--;if(n>0){$('#countdown').textContent=n;SFX.count(n)}else{clearInterval(t);$('#countdown').textContent='GO!';SFX.count('GO');setTimeout(()=>{$('#intro').classList.add('hidden');next();scheduleHeal()},450)}},700)},1700)}
function next(){if(!alive)return;if(round>=target){win();return}locked=false;document.querySelectorAll('.meteor').forEach(x=>x.remove());let pool=list.filter(x=>!used.includes(x));if(!pool.length){used=[];pool=[...list]}let ans=pick(pool);used.push(ans);$('#question').textContent=ans.ja;let wrong=shuffle(list.filter(x=>x!==ans)).slice(0,Math.min(3,list.length-1));let opts=shuffle([ans,...wrong]);pending=opts.length;opts.forEach((o,i)=>spawn(o,o===ans,i,opts.length))}
function spawn(o,correct,i,n){let b=document.createElement('button');b.className='meteor';b.textContent=o.en;b.style.left=`calc(${(i+.5)*100/n}% - 65px)`;let base=Math.max(4.3,9.2-round*.48);b.style.setProperty('--speed',`${base+Math.random()*.8}s`);b.dataset.correct=correct;b.onclick=()=>hit(b,correct);b.addEventListener('animationend',()=>{if(!alive||b.classList.contains('boom'))return;if(correct)fail(b);else{b.remove();pending--;}});field.appendChild(b)}
function hit(b,correct){if(!alive||locked||b.disabled)return;if(correct){locked=true;SFX.correct();b.classList.add('boom');score+=100+combo*20;combo++;round++;update();msg.textContent=combo>=3?`🔥 ${combo} COMBO!`:'NICE!';setTimeout(()=>msg.textContent='',450);setTimeout(next,520)}else{b.disabled=true;SFX.tapWrong();combo=0;score=Math.max(0,score-20);impactWrong(b)}}
function impactWrong(b){if(!alive)return;let ds=[...document.querySelectorAll('.dino:not(.dead):not(.dying)')],victim=ds[ds.length-1];if(!victim)return;victim.classList.add('dying');let br=b.getBoundingClientRect(),vr=victim.getBoundingClientRect();let ghost=document.createElement('div');ghost.className='impactMeteor';ghost.style.left=(br.left+br.width/2-42)+'px';ghost.style.top=(br.top+br.height/2-32)+'px';document.body.appendChild(ghost);b.classList.add('boom');requestAnimationFrame(()=>{let dx=(vr.left+vr.width/2)-(br.left+br.width/2),dy=(vr.top+vr.height/2)-(br.top+br.height/2);ghost.style.transform=`translate(${dx}px,${dy}px) scale(.8) rotate(150deg)`;ghost.style.opacity='.98'});setTimeout(()=>{ghost.remove();SFX.impact();lives--;update();victim.classList.add('hit');setTimeout(()=>victim.classList.remove('hit'),420);let ir=document.createElement('div');ir.className='impact';ir.style.left=(vr.left+vr.width/2-9)+'px';ir.style.top=(vr.top+vr.height/2-9)+'px';document.body.appendChild(ir);setTimeout(()=>ir.remove(),520);let sad=document.createElement('div');sad.className='sad';sad.textContent='😢';sad.style.left=(vr.left+vr.width/2)+'px';sad.style.top=(vr.top-5)+'px';document.body.appendChild(sad);setTimeout(()=>sad.remove(),1000);$('#app').classList.remove('shake');void $('#app').offsetWidth;$('#app').classList.add('shake');flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');msg.textContent='NOOO! 🦖';if(navigator.vibrate)navigator.vibrate([90,45,140]);setTimeout(()=>{victim.classList.remove('dying');victim.classList.add('dead');SFX.dinoGone();msg.textContent='';if(lives<=0){alive=false;clearTimeout(healTimer);locked=true;document.querySelectorAll('.meteor').forEach(x=>x.disabled=true);$('#result').textContent=`スコア ${score}　／　${round}/${target}問クリア`;SFX.extinct();$('#endTitle').textContent='絶滅 / EXTINCTION';$('#endSub').textContent='恐竜たちは絶滅してしまった… / The dinosaurs went extinct...';setTimeout(()=>$('#end').classList.remove('hidden'),300)}},360)},340)}
function scheduleHeal(){clearTimeout(healTimer);if(!alive)return;healTimer=setTimeout(()=>{if(alive&&lives<5&&!document.querySelector('.heal'))spawnHeal();scheduleHeal()},5000+Math.random()*5000)}
function spawnHeal(){let h=document.createElement('div');h.className='heal';h.textContent='🥚';h.title='回復アイテム';h.style.top=(35+Math.random()*25)+'%';h.style.setProperty('--healSpeed',(4.2+Math.random()*1.2)+'s');h.onclick=()=>{if(!alive||h.classList.contains('got'))return;h.classList.add('got');SFX.heal();lives=Math.min(5,lives+1);restoreDino();score+=50;update();msg.textContent='RECOVER! 🦖 +1';setTimeout(()=>msg.textContent='',650);setTimeout(()=>h.remove(),350)};h.addEventListener('animationend',()=>h.remove());field.appendChild(h)}
function restoreDino(){let dead=[...document.querySelectorAll('.dino.dead')];if(dead.length){let d=dead[0];d.classList.remove('dead','dying','hit');d.style.opacity='';d.style.transform=''}}
function fail(b){if(!alive||locked)return;locked=true;impactWrong(b);setTimeout(()=>{if(alive&&lives>0){locked=false;next()}},850)}
function renderDinos(){$('#dinos').innerHTML=Array.from({length:5},()=>'<span class="dino">🦖</span>').join('')}
function win(){alive=false;SFX.win();clearTimeout(healTimer);document.querySelectorAll('.meteor').forEach(x=>x.remove());$('#endTitle').textContent='生存！ / SURVIVED! 🎉';$('#endSub').textContent='恐竜は絶滅しなかった！ / The dinosaurs survived!';$('#result').textContent=`スコア ${score}　／　${target}問クリア　／　恐竜 ${lives}匹生存`;$('#end').classList.remove('hidden')}
function update(){$('#score').textContent=score;$('#lives').textContent=lives;$('#progress').textContent=`${round}/${target}`}document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>{$('#words').value=presets[b.dataset.set]});$('#go').onclick=start;$('#demo').onclick=()=>$('#words').value=sample;$('#soundBtn').onclick=()=>{initAudio();seOn=!seOn;$('#soundBtn').textContent=seOn?'🔊 SE':'🔇 SE';$('#soundBtn').classList.toggle('off',!seOn);if(seOn)tone(880,.08,'sine',.05)};
</script></body></html>
