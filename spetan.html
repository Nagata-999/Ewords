<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スペたん｜Spanish × English</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#fbf4ea;color:#172033}.app{max-width:720px;margin:auto;padding:22px 16px 90px}.top{display:flex;justify-content:space-between}.home{color:#0f766e;font-weight:900;text-decoration:none}.pill{background:#fff;border:1px solid #f1d7bc;border-radius:999px;padding:8px 12px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.card{background:#fffaf2;border:1px solid #f1d7bc;border-radius:25px;padding:24px;box-shadow:0 14px 34px #0f172a14}.es{text-align:center;font-size:clamp(34px,8vw,58px);font-weight:900;margin:10px}.reading{text-align:center;color:#64748b;font-size:18px;margin-bottom:16px}.speak,.choice,.unknown,.next,.tab{font:inherit;cursor:pointer}.speak{display:block;margin:0 auto 18px;border:0;background:#fff3e2;border-radius:999px;padding:10px 16px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{min-height:64px;border:2px solid #ead4bd;border-radius:17px;background:#fff;padding:14px;text-align:left;font-weight:800}.choice.correct{border-color:#34d399;background:#ecfdf5}.choice.wrong{border-color:#fca5a5;background:#fef2f2}.unknown{width:100%;margin-top:13px;min-height:52px;border:2px dashed #94a3b8;border-radius:15px;background:#fff;font-weight:900}.result{display:none;margin-top:16px;padding:16px;border-radius:16px;background:#fff}.explainHint{display:none;text-align:center;margin:14px 0 4px;color:#0f766e;font-weight:900}.wordchip{display:inline-block;border:0;background:#fff3e2;border-radius:9px;padding:3px 6px;margin:2px;cursor:pointer;font:inherit;font-weight:900}.explainBox{display:none;margin-top:12px;padding:14px;border-radius:14px;background:#f0fdfa;border:1px solid #99f6e4}.explainBox b{color:#0f766e}.useBox{display:none;margin-top:12px;padding:14px;border-radius:14px;background:#fff7ed;border:1px solid #fed7aa}.useBox strong{color:#c2410c}.useEs{font-size:20px;font-weight:900;margin:4px 0}.useWord{border:0;background:#ffedd5;border-radius:8px;padding:3px 6px;margin:1px;cursor:pointer;font:inherit;font-weight:900}.drillBox{display:none;margin-top:10px;padding:12px;border-radius:12px;background:#f0fdfa;border:1px solid #99f6e4}.next{display:none;width:100%;margin-top:14px;border:0;border-radius:14px;background:#f4511e;color:#fff;padding:15px;font-weight:900}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ead9c5;display:flex;justify-content:center;gap:8px;padding:10px}.tab{border:0;background:#f5ede4;padding:10px 14px;border-radius:12px}.small{font-size:13px;color:#64748b}.levelbtn{border:0;border-radius:14px;padding:11px 14px;font-weight:900;cursor:pointer;background:#fff;border:1px solid #f1d7bc}.levelbtn.active{background:#f4511e;color:#fff}.levelbtn:disabled{opacity:.45;cursor:not-allowed}.testbtn{border:0;border-radius:14px;padding:11px 14px;font-weight:900;background:#0f766e;color:#fff;cursor:pointer}@media(max-width:520px){.choices{grid-template-columns:1fr}}</style></head>
<body><main class="app"><div class="top"><a class="home" href="index.html">← すし単トップ</a><span class="pill" id="levelPill">Lv.1</span></div><h1>🇪🇸 スペたん</h1><p>スペイン語を英語4択で覚える。正解後に日本語も確認。</p><div id="levels" class="stats"></div><div id="testArea" class="stats"></div><div class="stats"><span class="pill" id="learned"></span><span class="pill" id="missed"></span><span class="pill" id="streak"></span></div><section class="card"><div class="small" id="kind"></div><div class="es" id="es"></div><div class="reading" id="reading"></div><button class="speak" id="speak">🔊 スペイン語を聞く</button><div class="choices" id="choices"></div><button class="unknown" id="unknown">わからない</button><div class="result" id="result"><strong id="ja"></strong><div id="en"></div><div class="explainHint" id="explainHint">👆 気になるところをタップ</div><div id="wordParts"></div><div class="explainBox" id="explainBox"></div><div class="useBox" id="useBox"></div></div><button class="next" id="next">次へ</button></section></main><nav class="tabs"><button class="tab" id="normal">通常</button><button class="tab" id="review">誤答復習</button><button class="tab" id="reset">進捗リセット</button></nav>
<script>
let DATA=[];const USE={"frío":["🥶 I'm cold.","Tengo frío.","「寒い」は estar ではなく tener を使う定番表現。直訳すると「私は寒さを持っている」。"],"caliente":["☕ It's hot.","Está caliente.","物が「熱い・温かい」は estar + caliente がよく使われる。"],"hambre":["🍴 I'm hungry.","Tengo hambre.","hambre は「空腹」。スペイン語では tener を使って「空腹を持っている」と表す。"],"sed":["🥤 I'm thirsty.","Tengo sed.","sed は「喉の渇き」。Tengo sed. で「喉が渇いた」。"],"sueño":["😴 I'm sleepy.","Tengo sueño.","sueño は「眠気・夢」。Tengo sueño. で「眠い」。"],"miedo":["😨 I'm scared.","Tengo miedo.","miedo は「恐れ」。Tengo miedo. で「怖い」。"],"prisa":["🏃 I'm in a hurry.","Tengo prisa.","prisa は「急ぎ」。Tengo prisa. で「急いでいる」。"],"razón":["👍 You're right.","Tienes razón.","razón は「理由」だが、tener razón で「正しい」。"],"años":["🎂 I'm 20 years old.","Tengo veinte años.","年齢も ser/estar ではなく tener。「20年を持っている」という形。"],"cansado":["😮‍💨 I'm tired.","Estoy cansado.","一時的な状態なので estar。女性なら Estoy cansada."],"feliz":["😊 I'm happy.","Estoy feliz.","今の感情・状態として言うなら estar が自然。"],"nervioso":["😬 I'm nervous.","Estoy nervioso.","今の状態なので estar。女性なら nerviosa."],"ocupado":["💼 I'm busy.","Estoy ocupado.","今忙しい、という状態なので estar。女性なら ocupada."],"enfermo":["🤒 I'm sick.","Estoy enfermo.","体調という状態なので estar。女性なら enferma."],"listo":["✅ I'm ready.","Estoy listo.","「準備ができている」は estar listo。女性なら lista."],"cerca":["📍 It's near.","Está cerca.","場所・位置なので estar を使う。"],"lejos":["📍 It's far.","Está lejos.","場所・位置なので estar を使う。"],"caro":["💰 It's expensive.","Es caro.","値段・性質として「高い」なら ser を使う。"],"barato":["💰 It's cheap.","Es barato.","値段・性質として「安い」なら ser を使う。"],"difícil":["🤔 It's difficult.","Es difícil.","性質として「難しい」なので ser を使う。"],"interesante":["💡 It's interesting.","Es interesante.","性質・評価として言うので ser を使う。"]};const GUIDE={"estoy":["estar","I am","「私は〜の状態です」。estar の「私」の形。状態や場所を言うときによく使う。"],"tengo":["tener","I have","「私は〜を持っている」。年齢・空腹・眠気などにも使う。"],"quiero":["querer","I want","「私は〜したい／欲しい」。Quiero + 動詞で「〜したい」。"],"puedo":["poder","I can","「私は〜できる」。Puedo + 動詞で「〜できます」。"],"voy":["ir","I go / I am going","ir の「私」の形。Voy a + 動詞で「〜する予定」。"],"he":["haber","I have","過去分詞と組み合わせて「〜したことがある／〜した」の形を作る。"],"me":["me","me / to me","Me gusta などで「私にとって」。直訳よりセットで覚えると楽。"],"gusta":["gustar","is pleasing / like","Me gusta... で「私は〜が好き」。"],"hay":["haber","there is / are","「〜がある・いる」。単数・複数どちらにもよく使う。"],"es":["ser","is","ser の形。性質・正体・職業など比較的変わりにくいことに使う。"],"está":["estar","is","estar の形。状態や場所を表すことが多い。"],"fue":["ser / ir","was / went","文脈により ser の「〜だった」または ir の「行った」。"],"soy":["ser","I am","ser の「私」の形。出身・職業・性質などに使う。"],"eres":["ser","you are","ser の「あなた」の形。"],"estás":["estar","you are","estar の「あなた」の形。状態を尋ねる ¿Cómo estás? でも使う。"],"vamos":["ir","we go / let’s go","ir の「私たち」の形。Vamos. なら「行こう」。"],"suelo":["soler","I usually","Suelo + 動詞で「私は普段〜する」。習慣を言う便利な形。"],"acabo":["acabar","I just...","Acabo de + 動詞で「〜したばかり」。"],"porque":["porque","because","理由を答える「なぜなら〜だから」。質問の ¿Por qué? と区別。"],"qué":["qué","what","「何」。疑問文や感嘆文でよく使う。"],"cómo":["cómo","how","「どのように／どう」。¿Cómo estás? なら「元気？」。"],"dónde":["dónde","where","「どこ」。場所を尋ねる。"]};
const KEY="spetan:v2", $=id=>document.getElementById(id);let S=JSON.parse(localStorage.getItem(KEY)||'{"learned":[],"missed":[],"streak":0,"unlocked":1}');if(!S.unlocked)S.unlocked=1;let pool=[],cur,locked=false,currentLevel=1,testMode=false,testTotal=0,testCorrect=0;
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}function update(){$("learned").textContent="覚えた "+S.learned.length;$("missed").textContent="復習 "+S.missed.length;$("streak").textContent="連続 "+S.streak}
function levelData(){return DATA.filter(x=>x.lv===currentLevel)}function renderLevels(){$("levels").innerHTML=[1,2,3,4,5].map(l=>'<button class="levelbtn '+(l===currentLevel?'active':'')+'" data-lv="'+l+'" '+(l>S.unlocked?'disabled':'')+'>'+(l>S.unlocked?'🔒 ':'')+'Lv.'+l+'</button>').join("");document.querySelectorAll(".levelbtn").forEach(b=>b.onclick=()=>{currentLevel=+b.dataset.lv;testMode=false;renderLevels();start(false)});$("levelPill").textContent="Lv."+currentLevel;$("testArea").innerHTML=currentLevel<5&&currentLevel<=S.unlocked?'<a class="testbtn" style="text-decoration:none" href="spetan_test.html?level='+currentLevel+'">Lv.'+(currentLevel+1)+' 昇格テストへ →</a>':''}
function start(review=false){testMode=false;pool=shuffle(review?S.missed.map(i=>DATA[i]).filter(x=>x&&x.lv===currentLevel):levelData());if(!pool.length)pool=shuffle(levelData());renderLevels();next()}
function startTest(){testMode=true;testTotal=0;testCorrect=0;let src=levelData(),items=[];while(items.length<20)items.push(...shuffle(src));pool=items.slice(0,20);next()}
function next(){locked=false;$("result").style.display="none";$("next").style.display="none";$("unknown").style.display="block";cur=pool.pop()||shuffle(DATA)[0];$("es").textContent=cur.es;$("reading").textContent="🇯🇵 読みは音声で確認";$("kind").textContent={noun:"名詞（冠詞ごと）",verb:"基本動詞",adjective:"形容詞",number:"数字",phrase:"会話フレーズ"}[cur.type];let same=DATA.filter(x=>x!==cur&&x.type===cur.type);if(same.length<3)same=DATA.filter(x=>x!==cur);let opts=shuffle([cur,...shuffle(same).slice(0,3)]);$("choices").innerHTML="";opts.forEach(o=>{let b=document.createElement("button");b.className="choice";b.textContent=o.en;b.onclick=()=>answer(o===cur,b);$("choices").appendChild(b)});update()}
function explainWords(){let box=$("wordParts");box.innerHTML="";let found=false;cur.es.split(/\s+/).forEach(w=>{let clean=w.toLowerCase().replace(/[¿?¡!.,…:;]/g,"");let span=document.createElement(GUIDE[clean]?"button":"span");span.textContent=w+" ";if(GUIDE[clean]){found=true;span.className="wordchip";span.onclick=()=>{let g=GUIDE[clean];$("explainBox").innerHTML="<b>"+w+"</b> ← "+g[0]+"<br><strong>🇬🇧 "+g[1]+"</strong><br>"+g[2];$("explainBox").style.display="block"}}box.appendChild(span)});$("explainHint").style.display=found?"block":"none";$("explainBox").style.display="none"}function guideKey(w){return w.toLowerCase().replace(/[¿?¡!.,…:;]/g,"")}function drill(w){let g=GUIDE[guideKey(w)];if(!g)return;let b=document.getElementById("drillBox");b.innerHTML="<b>"+w+"</b> ← "+g[0]+"<br><strong>🇬🇧 "+g[1]+"</strong><br>"+g[2];b.style.display="block"}function showUse(){let key=cur.es.toLowerCase().replace(/^(el|la|los|las|un|una)\s+/,"").replace(/[¿?¡!.,…:;]/g,"").trim(),u=USE[key];if(!u){$("useBox").style.display="none";return}let words=u[1].split(/\s+/).map(w=>GUIDE[guideKey(w)]?"<button class='useWord' data-w='"+w.replace(/'/g,"&#39;")+"'>"+w+"</button>":w).join(" ");$("useBox").innerHTML="<strong>💬 これ、どう使う？</strong><div>"+u[0]+"</div><div class='useEs'>🇪🇸 "+words+"</div><div class='small'>"+u[2]+"</div><div class='drillBox' id='drillBox'></div>";$("useBox").style.display="block";$("useBox").querySelectorAll(".useWord").forEach(b=>b.onclick=()=>drill(b.dataset.w))}function finish(){save();update();$("ja").textContent="🇯🇵 "+cur.ja;$("en").textContent="🇬🇧 "+cur.en;explainWords();showUse();$("result").style.display="block";$("next").style.display="block";$("unknown").style.display="none"}
function answer(ok,b){if(locked)return;locked=true;let i=DATA.indexOf(cur);document.querySelectorAll(".choice").forEach(x=>{x.disabled=true;if(x.textContent===cur.en)x.classList.add("correct")});if(ok){if(testMode)testCorrect++;S.streak++;if(!S.learned.includes(i))S.learned.push(i);S.missed=S.missed.filter(x=>x!==i)}else{b.classList.add("wrong");S.streak=0;if(!S.missed.includes(i))S.missed.push(i)}finish()}
$("unknown").onclick=()=>{if(locked)return;locked=true;let i=DATA.indexOf(cur);S.streak=0;if(!S.missed.includes(i))S.missed.push(i);document.querySelectorAll(".choice").forEach(x=>{x.disabled=true;if(x.textContent===cur.en)x.classList.add("correct")});finish()};$("next").onclick=()=>{if(testMode){testTotal++;if(testTotal>=20){let passed=testCorrect>=18;alert("昇格テスト："+testCorrect+"/20\n"+(passed?"合格！ Lv."+(currentLevel+1)+"を解放しました。":"18問以上正解で合格です。もう一度挑戦しよう。"));if(passed){S.unlocked=Math.max(S.unlocked,currentLevel+1);save();renderLevels()}testMode=false;start(false);return}}next()};$("normal").onclick=()=>start(false);$("review").onclick=()=>start(true);$("reset").onclick=()=>{if(confirm("進捗をリセットしますか？")){localStorage.removeItem(KEY);location.reload()}};$("speak").onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(cur.es);u.lang="es-ES";u.rate=.82;speechSynthesis.speak(u)};fetch("spetan_data.json").then(r=>{if(!r.ok)throw Error("data");return r.json()}).then(d=>{DATA=d;renderLevels();start()}).catch(()=>{document.getElementById("es").textContent="学習データを読み込めませんでした。";document.getElementById("choices").innerHTML=""});
</script></body></html>
