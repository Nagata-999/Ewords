<body><main class="app"><div class="top"><a class="home" href="index.html">← すし単トップ</a><span class="pill" id="levelPill">Lv.1</span></div><h1>🇪🇸 スペたん</h1><p>スペイン語を英語4択で覚える。正解後に日本語も確認。</p><div id="levels" class="stats"></div><div id="testArea" class="stats"></div><div class="stats"><span class="pill" id="learned"></span><span class="pill" id="missed"></span><span class="pill" id="streak"></span></div><section class="card"><div class="small" id="kind"></div><div class="es" id="es"></div><div class="reading" id="reading"></div><button class="speak" id="speak">🔊 スペイン語を聞く</button><div class="choices" id="choices"></div><button class="unknown" id="unknown">わからない</button><div class="result" id="result"><strong id="ja"></strong><div id="en"></div><div class="explainHint" id="explainHint">👆 気になるところをタップ</div><div id="wordParts"></div><div class="explainBox" id="explainBox"></div><div class="useBox" id="useBox"></div><div class="ahaBox" id="ahaBox"></div><div class="verbBox" id="verbBox"></div></div><button class="next" id="next">次へ</button></section></main><nav class="tabs"><button class="tab" id="normal">通常</button><button class="tab" id="review">誤答復習</button><button class="tab" id="reset">進捗リセット</button></nav>
<script>
let DATA=[];const VERBS={"ser":["to be","soy = I am / eres = you are / es = he, she, it is","Soy de Japón.","出身・職業・性質など「何者か」を表す基本の be。"],"estar":["to be","estoy = I am / estás = you are / está = he, she, it is","Estoy cansado.","状態・場所を表す be。英語の be が ser と estar に分かれる。"],"tener":["to have","tengo = I have / tienes = you have / tiene = he, she has","Tengo hambre.","所有だけでなく、空腹・年齢・寒さなどにも非常によく使う。"],"ir":["to go","voy = I go / vas = you go / va = he, she goes","Voy a casa.","Voy a + 動詞で「〜する予定」も作れる。"],"querer":["to want / love","quiero = I want / quieres = you want / quiere = he, she wants","Quiero comer.","Quiero + 動詞で「〜したい」。Quiero + 名詞で「〜が欲しい」。"],"poder":["can / to be able to","puedo = I can / puedes = you can / puede = he, she can","Puedo hacerlo.","活用した poder + 動詞の原形で「〜できる」。"],"hacer":["to do / make","hago = I do / haces = you do / hace = he, she does","¿Qué haces?","英語の do / make の両方に近い超頻出動詞。"],"venir":["to come","vengo = I come / vienes = you come / viene = he, she comes","¿Puedes venir?","venir は「こちらへ来る」。ir「行く」とセットで覚える。"],"comer":["to eat","como = I eat / comes = you eat / come = he, she eats","Quiero comer.","-er 動詞の代表。como は「私は食べる」。"],"beber":["to drink","bebo = I drink / bebes = you drink / bebe = he, she drinks","Quiero beber agua.","規則的な -er 動詞。"],"dormir":["to sleep","duermo = I sleep / duermes = you sleep / duerme = he, she sleeps","Quiero dormir.","o→ue と変化するタイプ。まず duermo / duermes を会話で覚える。"],"trabajar":["to work","trabajo = I work / trabajas = you work / trabaja = he, she works","Trabajo aquí.","規則的な -ar 動詞の代表。"],"estudiar":["to study","estudio = I study / estudias = you study / estudia = he, she studies","Estudio español.","規則的な -ar 動詞。"],"hablar":["to speak","hablo = I speak / hablas = you speak / habla = he, she speaks","Hablo un poco de español.","言語を話すときの基本動詞。"],"comprar":["to buy","compro = I buy / compras = you buy / compra = he, she buys","Quiero comprar esto.","規則的な -ar 動詞。"],"pagar":["to pay","pago = I pay / pagas = you pay / paga = he, she pays","¿Puedo pagar con tarjeta?","支払いで必須。pagar con tarjeta = カードで払う。"],"buscar":["to look for","busco = I look for / buscas = you look for / busca = he, she looks for","Busco un hotel.","英語の look for に相当。前置詞 for は不要。"],"encontrar":["to find","encuentro = I find / encuentras = you find / encuentra = he, she finds","No encuentro mi teléfono.","o→ue の変化に注目。buscar「探す」と対で便利。"],"necesitar":["to need","necesito = I need / necesitas = you need / necesita = he, she needs","Necesito ayuda.","英語の need に近く使いやすい規則動詞。"],"ayudar":["to help","ayudo = I help / ayudas = you help / ayuda = he, she helps","¿Puedes ayudarme?","ayudarme は ayudar + me で「私を助ける」。"],"llamar":["to call","llamo = I call / llamas = you call / llama = he, she calls","Me llamo Ana.","llamarse の形では「〜という名前です」。"],"pensar":["to think","pienso = I think / piensas = you think / piensa = he, she thinks","Pienso que sí.","e→ie と変化。Pienso que... で「私は〜と思う」。"],"creer":["to believe / think","creo = I believe / crees = you believe / cree = he, she believes","Creo que sí.","Creo que... は意見を柔らかく言う超便利表現。"],"saber":["to know","sé = I know / sabes = you know / sabe = he, she knows","No sé.","情報・事実を「知っている」。No sé. は「分からない」。"],"conocer":["to know / meet","conozco = I know / conoces = you know / conoce = he, she knows","Conozco Madrid.","人・場所などを知っている、面識がある時に使う。saber との違いに注意。"],"gustar":["to like / be pleasing","me gusta = I like / te gusta = you like / le gusta = he, she likes","Me gusta el café.","英語と語順の発想が違うので、まず Me gusta... を1セットで覚える。"],"recordar":["to remember","recuerdo = I remember / recuerdas = you remember / recuerda = he, she remembers","No recuerdo.","o→ue と変化する動詞。"],"empezar":["to start","empiezo = I start / empiezas = you start / empieza = he, she starts","Empiezo ahora.","e→ie と変化。"],"terminar":["to finish","termino = I finish / terminas = you finish / termina = he, she finishes","Termino a las cinco.","規則的な -ar 動詞。"],"volver":["to return","vuelvo = I return / vuelves = you return / vuelve = he, she returns","Vuelvo mañana.","o→ue と変化。volver a + 動詞で「再び〜する」も作れる。"],"salir":["to go out / leave","salgo = I go out / sales = you go out / sale = he, she goes out","Salgo con amigos.","salgo の形が不規則。salir con... で「〜と出かける」。"],"ver":["to see","veo = I see / ves = you see / ve = he, she sees","Nos vemos.","Nos vemos. は直訳「私たちは互いに会う」→「またね」。"],"decir":["to say / tell","digo = I say / dices = you say / dice = he, she says","¿Cómo se dice?","digo が不規則。¿Cómo se dice...? は「〜はどう言う？」。"]};const AHA=[{test:s=>/\b(tengo|tienes|tiene)\s+(frío|hambre|sed|sueño|miedo|prisa|\d+\s+años)/i.test(s),title:"🇬🇧 be じゃなくて tener？",body:"英語では “I’m cold / hungry / 20.” のように be を使うが、スペイン語では Tengo frío / Tengo hambre / Tengo 20 años. のように tener（have）を使う。英語から直訳しないのがコツ。"},{test:s=>/\b(me|te|le)\s+gusta/i.test(s),title:"🇬🇧 I like と形が違う",body:"Me gusta el café. は英語の I like coffee. と発想が違う。感覚的には “Coffee is pleasing to me.” に近い。だから主語の I をそのまま yo に置き換えない。"},{test:s=>/\b(soy|eres|es|somos|son)\b/i.test(s),title:"🇬🇧 be = ser / estar の2種類",body:"英語の be に当たる動詞がスペイン語では分かれる。ser は「何者か・性質・出身」などに使う。Soy japonés. / Es importante. など。"},{test:s=>/\b(estoy|estás|está|estamos|están)\b/i.test(s),title:"🇬🇧 これも be。でも estar",body:"estar も英語では be。こちらは「今の状態・場所」に強い。Estoy cansado. / Estoy en casa. のように使う。"},{test:s=>/\b(voy|vas|va|vamos|van)\s+a\s+\w+/i.test(s),title:"🇬🇧 be going to にかなり近い",body:"Voy a comer. は “I’m going to eat.” に近い形。ir（go）の活用 + a + 動詞の原形で、これからする予定を言える。"},{test:s=>/\b(acabo|acabas|acaba)\s+de\b/i.test(s),title:"🇬🇧 just を動詞の形で表す",body:"Acabo de comer. = I just ate. 「〜したばかり」は acabar de + 動詞。英語の just 一語とは作り方が違う。"},{test:s=>/\b(he|has|ha|hemos|han)\s+\w+/i.test(s),title:"🇬🇧 have + 過去分詞に似ている",body:"He estado... の he は haber の活用。英語の have + past participle と似た完了の仕組みを作る。ただし所有の have は tener を使う。"},{test:s=>/^¿?cómo\s+est/i.test(s),title:"💡 主語を言わなくても通じる",body:"¿Cómo estás? に英語の you に当たる tú がなくても、estás の形だけで「あなた」だと分かる。スペイン語は動詞の形に主語の情報が入っているので、主語をよく省略する。"}];const USE={"frío":["🥶 I'm cold.","Tengo frío.","「寒い」は estar ではなく tener を使う定番表現。直訳すると「私は寒さを持っている」。"],"caliente":["☕ It's hot.","Está caliente.","物が「熱い・温かい」は estar + caliente がよく使われる。"],"hambre":["🍴 I'm hungry.","Tengo hambre.","hambre は「空腹」。スペイン語では tener を使って「空腹を持っている」と表す。"],"sed":["🥤 I'm thirsty.","Tengo sed.","sed は「喉の渇き」。Tengo sed. で「喉が渇いた」。"],"sueño":["😴 I'm sleepy.","Tengo sueño.","sueño は「眠気・夢」。Tengo sueño. で「眠い」。"],"miedo":["😨 I'm scared.","Tengo miedo.","miedo は「恐れ」。Tengo miedo. で「怖い」。"],"prisa":["🏃 I'm in a hurry.","Tengo prisa.","prisa は「急ぎ」。Tengo prisa. で「急いでいる」。"],"razón":["👍 You're right.","Tienes razón.","razón は「理由」だが、tener razón で「正しい」。"],"años":["🎂 I'm 20 years old.","Tengo veinte años.","年齢も ser/estar ではなく tener。「20年を持っている」という形。"],"cansado":["😮‍💨 I'm tired.","Estoy cansado.","一時的な状態なので estar。女性なら Estoy cansada."],"feliz":["😊 I'm happy.","Estoy feliz.","今の感情・状態として言うなら estar が自然。"],"nervioso":["😬 I'm nervous.","Estoy nervioso.","今の状態なので estar。女性なら nerviosa."],"ocupado":["💼 I'm busy.","Estoy ocupado.","今忙しい、という状態なので estar。女性なら ocupada."],"enfermo":["🤒 I'm sick.","Estoy enfermo.","体調という状態なので estar。女性なら enferma."],"listo":["✅ I'm ready.","Estoy listo.","「準備ができている」は estar listo。女性なら lista."],"cerca":["📍 It's near.","Está cerca.","場所・位置なので estar を使う。"],"lejos":["📍 It's far.","Está lejos.","場所・位置なので estar を使う。"],"caro":["💰 It's expensive.","Es caro.","値段・性質として「高い」なら ser を使う。"],"barato":["💰 It's cheap.","Es barato.","値段・性質として「安い」なら ser を使う。"],"difícil":["🤔 It's difficult.","Es difícil.","性質として「難しい」なので ser を使う。"],"interesante":["💡 It's interesting.","Es interesante.","性質・評価として言うので ser を使う。"],"agua":["💧 I want water.","Quiero agua.","Quiero + 名詞で「〜が欲しい」。"],"café":["☕ I want coffee.","Quiero café.","欲しい物を Quiero の後ろに置けばよい。"],"comida":["🍴 I want food.","Quiero comida.","Quiero + 名詞で「〜が欲しい」。"],"ayuda":["🆘 I need help.","Necesito ayuda.","necesitar は「必要とする」。Necesito は「私は必要です」。"],"casa":["🏠 I'm at home.","Estoy en casa.","場所を言うので estar。en casa で「家に」。"],"trabajo":["💼 I'm at work.","Estoy en el trabajo.","今いる場所なので estar を使う。"],"escuela":["🏫 I'm at school.","Es const KEY="spetan:v2", $=id=>document.getElementById(id);let S=JSON.parse(localStorage.getItem(KEY)||'{"learned":[],"missed":[],"streak":0,"unlocked":1}');if(!S.unlocked)S.unlocked=1;let pool=[],cur,locked=false,currentLevel=1,testMode=false,testTotal=0,testCorrect=0;
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}function update(){$("learned").textContent="覚えた "+S.learned.length;$("missed").textContent="復習 "+S.missed.length;$("streak").textContent="連続 "+S.streak}
function levelData(){return DATA.filter(x=>x.lv===currentLevel)}function renderLevels(){$("levels").innerHTML=[1,2,3,4,5].map(l=>'<button class="levelbtn '+(l===currentLevel?'active':'')+'" data-lv="'+l+'" '+(l>S.unlocked?'disabled':'')+'>'+(l>S.unlocked?'🔒 ':'')+'Lv.'+l+'</button>').join("");document.querySelectorAll(".levelbtn").forEach(b=>b.onclick=()=>{currentLevel=+b.dataset.lv;testMode=false;renderLevels();start(false)});$("levelPill").textContent="Lv."+currentLevel;$("testArea").innerHTML=currentLevel<5&&currentLevel<=S.unlocked?'<a class="testbtn" style="text-decoration:none" href="spetan_test.html?level='+currentLevel+'">Lv.'+(currentLevel+1)+' 昇格テストへ →</a>':''}
function start(review=false){testMode=false;pool=shuffle(review?S.missed.map(i=>DATA[i]).filter(x=>x&&x.lv===currentLevel):levelData());if(!pool.length)pool=shuffle(levelData());renderLevels();next()}
function startTest(){testMode=true;testTotal=0;testCorrect=0;let src=levelData(),items=[];while(items.length<20)items.push(...shuffle(src));pool=items.slice(0,20);next()}
function next(){locked=false;$("result").style.display="none";$("next").style.display="none";$("unknown").style.display="block";cur=pool.pop()||shuffle(DATA)[0];$("es").textContent=cur.es;$("reading").textContent="🇯🇵 読みは音声で確認";$("kind").textContent={noun:"名詞（冠詞ごと）",verb:"基本動詞",adjective:"形容詞",number:"数字",phrase:"会話フレーズ"}[cur.type];let same=DATA.filter(x=>x!==cur&&x.type===cur.type);if(same.length<3)same=DATA.filter(x=>x!==cur);let opts=shuffle([cur,...shuffle(same).slice(0,3)]);$("choices").innerHTML="";opts.forEach(o=>{let b=document.createElement("button");b.className="choice";b.textContent=o.en;b.onclick=()=>answer(o===cur,b);$("choices").appendChild(b)});update()}
function explainWords(){let box=$("wordParts");box.innerHTML="";let found=false;cur.es.split(/\s+/).forEach(w=>{let clean=w.toLowerCase().replace(/[¿?¡!.,…:;]/g,"");let span=document.createElement(GUIDE[clean]?"button":"span");span.textContent=w+" ";if(GUIDE[clean]){found=true;span.className="wordchip";span.onclick=()=>{let g=GUIDE[clean];$("explainBox").innerHTML="<b>"+w+"</b> ← "+g[0]+"<br><strong>🇬🇧 "+g[1]+"</strong><br>"+g[2];$("explainBox").style.display="block"}}box.appendChild(span)});$("explainHint").style.display=found?"block":"none";$("explainBox").style.display="none"}function guideKey(w){return w.toLowerCase().replace(/[¿?¡!.,…:;]/g,"")}function drill(w){let g=GUIDE[guideKey(w)];if(!g)return;let b=document.getElementById("drillBox");b.innerHTML="<b>"+w+"</b> ← "+g[0]+"<br><strong>🇬🇧 "+g[1]+"</strong><br>"+g[2];b.style.display="block"}function showVerb(){if(cur.type!=="verb"||!VERBS[cur.es]){$("verbBox").style.display="none";return}let v=VERBS[cur.es];$("verbBox").innerHTML="<strong>🔧 この動詞を使う</strong><div><b>"+cur.es+"</b> = "+v[0]+"</div><div class='verbForms'>"+v[1]+"</div><div>💬 🇪🇸 "+v[2]+"</div><div class='small'>"+v[3]+"</div>";$("verbBox").style.display="block"}function showAha(){let texts=[cur.es],u=USE[cur.es.toLowerCase().replace(/^(el|la|los|las|un|una)\s+/,"").replace(/[¿?¡!.,…:;]/g,"").trim()];if(u)texts.push(u[1]);let hit=AHA.find(a=>texts.some(t=>a.test(t)));if(!hit){$("ahaBox").style.display="none";return}$("ahaBox").innerHTML="<div class='ahaTitle'>💡 "+hit.title+"</div>"+hit.body;$("ahaBox").style.display="block"}function showUse(){let key=cur.es.toLowerCase().replace(/^(el|la|los|las|un|una)\s+/,"").replace(/[¿?¡!.,…:;]/g,"").trim(),u=USE[key];if(!u){$("useBox").style.display="none";return}let words=u[1].split(/\s+/).map(w=>GUIDE[guideKey(w)]?"<button class='useWord' data-w='"+w.replace(/'/g,"&#39;")+"'>"+w+"</button>":w).join(" ");$("useBox").innerHTML="<strong>💬 これ、どう使う？</strong><div>"+u[0]+"</div><div class='useEs'>🇪🇸 "+words+"</div><div class='small'>"+u[2]+"</div><div class='drillBox' id='drillBox'></div>";$("useBox").style.display="block";$("useBox").querySelectorAll(".useWord").forEach(b=>b.onclick=()=>drill(b.dataset.w))}function finish(){save();update();$("ja").textContent="🇯🇵 "+cur.ja;$("en").textContent="🇬🇧 "+cur.en;explainWords();showUse();showAha();showVerb();$("result").style.display="block";$("next").style.display="block";$("unknown").style.display="none"}
function answer(ok,b){if(locked)return;locked=true;let i=DATA.indexOf(cur);document.querySelectorAll(".choice").forEach(x=>{x.disabled=true;if(x.textContent===cur.en)x.classList.add("correct")});if(ok){if(testMode)testCorrect++;S.streak++;if(!S.learned.includes(i))S.learned.push(i);S.missed=S.missed.filter(x=>x!==i)}else{b.classList.add("wrong");S.streak=0;if(!S.missed.includes(i))S.missed.push(i)}finish()}
$("unknown").onclick=()=>{if(locked)return;locked=true;let i=DATA.indexOf(cur);S.streak=0;if(!S.missed.includes(i))S.missed.push(i);document.querySelectorAll(".choice").forEach(x=>{x.disabled=true;if(x.textContent===cur.en)x.classList.add("correct")});finish()};$("next").onclick=()=>{if(testMode){testTotal++;if(testTotal>=20){let passed=testCorrect>=18;alert("昇格テスト："+testCorrect+"/20\n"+(passed?"合格！ Lv."+(currentLevel+1)+"を解放しました。":"18問以上正解で合格です。もう一度挑戦しよう。"));if(passed){S.unlocked=Math.max(S.unlocked,currentLevel+1);save();renderLevels()}testMode=false;start(false);return}}next()};$("normal").onclick=()=>start(false);$("review").onclick=()=>start(true);$("reset").onclick=()=>{if(confirm("進捗をリセットしますか？")){localStorage.removeItem(KEY);location.reload()}};$("speak").onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(cur.es);u.lang="es-ES";u.rate=.82;speechSynthesis.speak(u)};fetch("spetan_data.json").then(r=>{if(!r.ok)throw Error("data");return r.json()}).then(d=>{DATA=d;renderLevels();start()}).catch(()=>{document.getElementById("es").textContent="学習データを読み込めませんでした。";document.getElementById("choices").innerHTML=""});
</script></body></html>
