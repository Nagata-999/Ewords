<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スペたん｜Spanish × English</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#fbf4ea;color:#172033}.app{max-width:720px;margin:auto;padding:22px 16px 90px}.top{display:flex;justify-content:space-between}.home{color:#0f766e;font-weight:900;text-decoration:none}.pill{background:#fff;border:1px solid #f1d7bc;border-radius:999px;padding:8px 12px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.card{background:#fffaf2;border:1px solid #f1d7bc;border-radius:25px;padding:24px;box-shadow:0 14px 34px #0f172a14}.es{text-align:center;font-size:clamp(34px,8vw,58px);font-weight:900;margin:10px}.reading{text-align:center;color:#64748b;font-size:18px;margin-bottom:16px}.speak,.choice,.unknown,.next,.tab{font:inherit;cursor:pointer}.speak{display:block;margin:0 auto 18px;border:0;background:#fff3e2;border-radius:999px;padding:10px 16px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{min-height:64px;border:2px solid #ead4bd;border-radius:17px;background:#fff;padding:14px;text-align:left;font-weight:800}.choice.correct{border-color:#34d399;background:#ecfdf5}.choice.wrong{border-color:#fca5a5;background:#fef2f2}.unknown{width:100%;margin-top:13px;min-height:52px;border:2px dashed #94a3b8;border-radius:15px;background:#fff;font-weight:900}.result{display:none;margin-top:16px;padding:16px;border-radius:16px;background:#fff}.next{display:none;width:100%;margin-top:14px;border:0;border-radius:14px;background:#f4511e;color:#fff;padding:15px;font-weight:900}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ead9c5;display:flex;justify-content:center;gap:8px;padding:10px}.tab{border:0;background:#f5ede4;padding:10px 14px;border-radius:12px}.small{font-size:13px;color:#64748b}@media(max-width:520px){.choices{grid-template-columns:1fr}}</style></head>
<body><main class="app"><div class="top"><a class="home" href="index.html">← すし単トップ</a><span class="pill">Lv.1</span></div><h1>🇪🇸 スペたん</h1><p>スペイン語を英語4択で覚える。正解後に日本語も確認。</p><div class="stats"><span class="pill" id="learned"></span><span class="pill" id="missed"></span><span class="pill" id="streak"></span></div><section class="card"><div class="small" id="kind"></div><div class="es" id="es"></div><div class="reading" id="reading"></div><button class="speak" id="speak">🔊 スペイン語を聞く</button><div class="choices" id="choices"></div><button class="unknown" id="unknown">わからない</button><div class="result" id="result"><strong id="ja"></strong><div id="en"></div></div><button class="next" id="next">次へ</button></section></main><nav class="tabs"><button class="tab" id="normal">通常</button><button class="tab" id="review">誤答復習</button><button class="tab" id="reset">進捗リセット</button></nav>
<script>
const DATA=[
{es:"el agua",en:"water",ja:"水",type:"noun"},{es:"la comida",en:"food",ja:"食べ物",type:"noun"},{es:"el café",en:"coffee",ja:"コーヒー",type:"noun"},{es:"la casa",en:"house",ja:"家",type:"noun"},
{es:"ser",en:"be",ja:"～である",type:"verb"},{es:"tener",en:"have",ja:"持っている",type:"verb"},{es:"ir",en:"go",ja:"行く",type:"verb"},{es:"querer",en:"want",ja:"欲しい・～したい",type:"verb"},
{es:"bueno",en:"good",ja:"良い",type:"adjective"},{es:"malo",en:"bad",ja:"悪い",type:"adjective"},{es:"grande",en:"big",ja:"大きい",type:"adjective"},{es:"pequeño",en:"small",ja:"小さい",type:"adjective"},
{es:"uno",en:"1",ja:"1",type:"number"},{es:"dos",en:"2",ja:"2",type:"number"},{es:"tres",en:"3",ja:"3",type:"number"},{es:"cuatro",en:"4",ja:"4",type:"number"},
{es:"Hola.",en:"Hello.",ja:"こんにちは。",type:"phrase"},{es:"Gracias.",en:"Thank you.",ja:"ありがとう。",type:"phrase"},{es:"No sé.",en:"I don't know.",ja:"わかりません。",type:"phrase"},{es:"¿Cómo estás?",en:"How are you?",ja:"元気ですか？",type:"phrase"}
];
const KEY="spetan:v1", $=id=>document.getElementById(id);let S=JSON.parse(localStorage.getItem(KEY)||'{"learned":[],"missed":[],"streak":0}'),pool=[],cur,locked=false;
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}function update(){$("learned").textContent="覚えた "+S.learned.length;$("missed").textContent="復習 "+S.missed.length;$("streak").textContent="連続 "+S.streak}
function start(review=false){pool=shuffle(review?S.missed.map(i=>DATA[i]).filter(Boolean):DATA);if(!pool.length)pool=shuffle(DATA);next()}
function next(){locked=false;$("result").style.display="none";$("next").style.display="none";$("unknown").style.display="block";cur=pool.pop()||shuffle(DATA)[0];$("es").textContent=cur.es;$("reading").textContent="🇯🇵 読みは音声で確認";$("kind").textContent={noun:"名詞（冠詞ごと）",verb:"基本動詞",adjective:"形容詞",number:"数字",phrase:"会話フレーズ"}[cur.type];let same=DATA.filter(x=>x!==cur&&x.type===cur.type);if(same.length<3)same=DATA.filter(x=>x!==cur);let opts=shuffle([cur,...shuffle(same).slice(0,3)]);$("choices").innerHTML="";opts.forEach(o=>{let b=document.createElement("button");b.className="choice";b.textContent=o.en;b.onclick=()=>answer(o===cur,b);$("choices").appendChild(b)});update()}
function finish(){save();update();$("ja").textContent="🇯🇵 "+cur.ja;$("en").textContent="🇬🇧 "+cur.en;$("result").style.display="block";$("next").style.display="block";$("unknown").style.display="none"}
function answer(ok,b){if(locked)return;locked=true;let i=DATA.indexOf(cur);document.querySelectorAll(".choice").forEach(x=>{x.disabled=true;if(x.textContent===cur.en)x.classList.add("correct")});if(ok){S.streak++;if(!S.learned.includes(i))S.learned.push(i);S.missed=S.missed.filter(x=>x!==i)}else{b.classList.add("wrong");S.streak=0;if(!S.missed.includes(i))S.missed.push(i)}finish()}
$("unknown").onclick=()=>{if(locked)return;locked=true;let i=DATA.indexOf(cur);S.streak=0;if(!S.missed.includes(i))S.missed.push(i);document.querySelectorAll(".choice").forEach(x=>{x.disabled=true;if(x.textContent===cur.en)x.classList.add("correct")});finish()};$("next").onclick=next;$("normal").onclick=()=>start(false);$("review").onclick=()=>start(true);$("reset").onclick=()=>{if(confirm("進捗をリセットしますか？")){localStorage.removeItem(KEY);location.reload()}};$("speak").onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(cur.es);u.lang="es-ES";u.rate=.82;speechSynthesis.speak(u)};start();
</script></body></html>
