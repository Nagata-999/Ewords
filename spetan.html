<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スペたん｜Spanish × English</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#fbf4ea;color:#172033}.app{max-width:720px;margin:auto;padding:22px 16px 90px}.top{display:flex;justify-content:space-between}.home{color:#0f766e;font-weight:900;text-decoration:none}.pill{background:#fff;border:1px solid #f1d7bc;border-radius:999px;padding:8px 12px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.card{background:#fffaf2;border:1px solid #f1d7bc;border-radius:25px;padding:24px;box-shadow:0 14px 34px #0f172a14}.es{text-align:center;font-size:clamp(34px,8vw,58px);font-weight:900;margin:10px}.reading{text-align:center;color:#64748b;font-size:18px;margin-bottom:16px}.speak,.choice,.unknown,.next,.tab{font:inherit;cursor:pointer}.speak{display:block;margin:0 auto 18px;border:0;background:#fff3e2;border-radius:999px;padding:10px 16px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{min-height:64px;border:2px solid #ead4bd;border-radius:17px;background:#fff;padding:14px;text-align:left;font-weight:800}.choice.correct{border-color:#34d399;background:#ecfdf5}.choice.wrong{border-color:#fca5a5;background:#fef2f2}.unknown{width:100%;margin-top:13px;min-height:52px;border:2px dashed #94a3b8;border-radius:15px;background:#fff;font-weight:900}.result{display:none;margin-top:16px;padding:16px;border-radius:16px;background:#fff}.next{display:none;width:100%;margin-top:14px;border:0;border-radius:14px;background:#f4511e;color:#fff;padding:15px;font-weight:900}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ead9c5;display:flex;justify-content:center;gap:8px;padding:10px}.tab{border:0;background:#f5ede4;padding:10px 14px;border-radius:12px}.small{font-size:13px;color:#64748b}.levelbtn{border:0;border-radius:14px;padding:11px 14px;font-weight:900;cursor:pointer;background:#fff;border:1px solid #f1d7bc}.levelbtn.active{background:#f4511e;color:#fff}.levelbtn:disabled{opacity:.45;cursor:not-allowed}.testbtn{border:0;border-radius:14px;padding:11px 14px;font-weight:900;background:#0f766e;color:#fff;cursor:pointer}@media(max-width:520px){.choices{grid-template-columns:1fr}}</style></head>
<body><main class="app"><div class="top"><a class="home" href="index.html">← すし単トップ</a><span class="pill" id="levelPill">Lv.1</span></div><h1>🇪🇸 スペたん</h1><p>スペイン語を英語4択で覚える。正解後に日本語も確認。</p><div id="levels" class="stats"></div><div id="testArea" class="stats"></div><div class="stats"><span class="pill" id="learned"></span><span class="pill" id="missed"></span><span class="pill" id="streak"></span></div><section class="card"><div class="small" id="kind"></div><div class="es" id="es"></div><div class="reading" id="reading"></div><button class="speak" id="speak">🔊 スペイン語を聞く</button><div class="choices" id="choices"></div><button class="unknown" id="unknown">わからない</button><div class="result" id="result"><strong id="ja"></strong><div id="en"></div></div><button class="next" id="next">次へ</button></section></main><nav class="tabs"><button class="tab" id="normal">通常</button><button class="tab" id="review">誤答復習</button><button class="tab" id="reset">進捗リセット</button></nav>
<script>
let DATA=[];
const KEY="spetan:v2", $=id=>document.getElementById(id);let S=JSON.parse(localStorage.getItem(KEY)||'{"learned":[],"missed":[],"streak":0,"unlocked":1}');if(!S.unlocked)S.unlocked=1;let pool=[],cur,locked=false,currentLevel=1,testMode=false,testTotal=0,testCorrect=0;
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}function update(){$("learned").textContent="覚えた "+S.learned.length;$("missed").textContent="復習 "+S.missed.length;$("streak").textContent="連続 "+S.streak}
function levelData(){return DATA.filter(x=>x.lv===currentLevel)}function renderLevels(){$("levels").innerHTML=[1,2,3,4,5].map(l=>'<button class="levelbtn '+(l===currentLevel?'active':'')+'" data-lv="'+l+'" '+(l>S.unlocked?'disabled':'')+'>'+(l>S.unlocked?'🔒 ':'')+'Lv.'+l+'</button>').join("");document.querySelectorAll(".levelbtn").forEach(b=>b.onclick=()=>{currentLevel=+b.dataset.lv;testMode=false;renderLevels();start(false)});$("levelPill").textContent="Lv."+currentLevel;$("testArea").innerHTML=currentLevel<5&&currentLevel<=S.unlocked?'<a class="testbtn" style="text-decoration:none" href="spetan_test.html?level='+currentLevel+'">Lv.'+(currentLevel+1)+' 昇格テストへ →</a>':''}
function start(review=false){testMode=false;pool=shuffle(review?S.missed.map(i=>DATA[i]).filter(x=>x&&x.lv===currentLevel):levelData());if(!pool.length)pool=shuffle(levelData());renderLevels();next()}
function startTest(){testMode=true;testTotal=0;testCorrect=0;let src=levelData(),items=[];while(items.length<20)items.push(...shuffle(src));pool=items.slice(0,20);next()}
function next(){locked=false;$("result").style.display="none";$("next").style.display="none";$("unknown").style.display="block";cur=pool.pop()||shuffle(DATA)[0];$("es").textContent=cur.es;$("reading").textContent="🇯🇵 読みは音声で確認";$("kind").textContent={noun:"名詞（冠詞ごと）",verb:"基本動詞",adjective:"形容詞",number:"数字",phrase:"会話フレーズ"}[cur.type];let same=DATA.filter(x=>x!==cur&&x.type===cur.type);if(same.length<3)same=DATA.filter(x=>x!==cur);let opts=shuffle([cur,...shuffle(same).slice(0,3)]);$("choices").innerHTML="";opts.forEach(o=>{let b=document.createElement("button");b.className="choice";b.textContent=o.en;b.onclick=()=>answer(o===cur,b);$("choices").appendChild(b)});update()}
function finish(){save();update();$("ja").textContent="🇯🇵 "+cur.ja;$("en").textContent="🇬🇧 "+cur.en;$("result").style.display="block";$("next").style.display="block";$("unknown").style.display="none"}
function answer(ok,b){if(locked)return;locked=true;let i=DATA.indexOf(cur);document.querySelectorAll(".choice").forEach(x=>{x.disabled=true;if(x.textContent===cur.en)x.classList.add("correct")});if(ok){if(testMode)testCorrect++;S.streak++;if(!S.learned.includes(i))S.learned.push(i);S.missed=S.missed.filter(x=>x!==i)}else{b.classList.add("wrong");S.streak=0;if(!S.missed.includes(i))S.missed.push(i)}finish()}
$("unknown").onclick=()=>{if(locked)return;locked=true;let i=DATA.indexOf(cur);S.streak=0;if(!S.missed.includes(i))S.missed.push(i);document.querySelectorAll(".choice").forEach(x=>{x.disabled=true;if(x.textContent===cur.en)x.classList.add("correct")});finish()};$("next").onclick=()=>{if(testMode){testTotal++;if(testTotal>=20){let passed=testCorrect>=18;alert("昇格テスト："+testCorrect+"/20\n"+(passed?"合格！ Lv."+(currentLevel+1)+"を解放しました。":"18問以上正解で合格です。もう一度挑戦しよう。"));if(passed){S.unlocked=Math.max(S.unlocked,currentLevel+1);save();renderLevels()}testMode=false;start(false);return}}next()};$("normal").onclick=()=>start(false);$("review").onclick=()=>start(true);$("reset").onclick=()=>{if(confirm("進捗をリセットしますか？")){localStorage.removeItem(KEY);location.reload()}};$("speak").onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(cur.es);u.lang="es-ES";u.rate=.82;speechSynthesis.speak(u)};fetch("spetan_data.json").then(r=>{if(!r.ok)throw Error("data");return r.json()}).then(d=>{DATA=d;renderLevels();start()}).catch(()=>{document.getElementById("es").textContent="学習データを読み込めませんでした。";document.getElementById("choices").innerHTML=""});
</script></body></html>
