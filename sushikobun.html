<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="古文・英語・現代語をつなげて覚える学習ゲーム。古文1語から英語4択、現代語4択に挑戦。">
<title>すしこぶ単</title>
<style>
:root{
  --orange:#f58220;--orange2:#d9650c;--soft:#fff4e9;--ink:#2b2b2b;
  --muted:#6d6d6d;--line:#efd9c5;--white:#fff;--ok:#17824a;--bad:#c83d34;
  --shadow:0 10px 30px rgba(80,45,15,.10)
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(#fffdfb,#fff7f0);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.wrap{width:min(1040px,calc(100% - 24px));margin:auto;padding:18px 0 42px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.45rem}
.logo{width:44px;height:44px;display:grid;place-items:center;background:var(--orange);color:#fff;border-radius:14px;box-shadow:var(--shadow)}
.link{padding:10px 15px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);text-decoration:none;font-weight:800}
.panel{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.screen{display:none}.screen.active{display:block}
.hero{text-align:center;padding:clamp(30px,6vw,65px)}
.hero h1{font-size:clamp(2.5rem,8vw,5rem);margin:0 0 14px;letter-spacing:-.04em}
.hero h1 span{color:var(--orange)}
.hero p{max-width:690px;margin:0 auto 26px;color:var(--muted);font-size:1.08rem;line-height:1.8}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:700px;margin:auto}
.btn{border:0;border-radius:16px;padding:15px 18px;font-weight:900}
.primary{background:var(--orange);color:#fff}.secondary{background:var(--soft);color:var(--orange2);border:1px solid #ffd4ac}
.neutral{background:#fff;color:var(--ink);border:1px solid var(--line)}
details{max-width:760px;margin:26px auto 0;text-align:left;background:#fffaf5;border:1px solid var(--line);border-radius:15px;padding:0 18px}
summary{padding:16px 0;font-weight:900}.about{padding:0 0 17px;color:var(--muted);line-height:1.8}
.game{padding:clamp(18px,4vw,34px)}
.gamehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.score{background:var(--soft);border:1px solid #ffd4ac;border-radius:15px;padding:10px 16px;font-weight:800}
.score strong{font-size:2rem;color:var(--orange2);margin-left:8px}
.round{color:var(--muted);font-weight:800;text-align:right}
.prompt{max-width:760px;margin:0 auto 20px;padding:26px 18px;text-align:center;background:linear-gradient(#fffaf6,#fff);
border:2px solid #ffc995;border-radius:20px}
.prompt .label{color:var(--orange2);font-weight:900;margin-bottom:8px}
.prompt .word{font-size:clamp(2rem,7vw,4.2rem);font-weight:900;line-height:1.2;overflow-wrap:anywhere}
.stage{max-width:880px;margin:0 auto 18px;padding:16px;background:#fffaf6;border:1px solid var(--line);border-radius:18px}
.stage.hidden{display:none}
.stage h2{text-align:center;color:var(--orange2);margin:0 0 13px;font-size:1.1rem}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.option{min-height:92px;padding:14px;border:2px solid transparent;border-radius:15px;background:#fff;color:var(--ink);
font-weight:800;line-height:1.45;box-shadow:0 4px 12px rgba(80,45,15,.06);overflow-wrap:anywhere}
.option:hover{border-color:#ffc995}.option.correct{background:#eaf8ef;border-color:#61b47e;color:#12683b}
.option.wrong{background:#fff0ef;border-color:#e58d87;color:#9f2923}
.feedback{text-align:center;min-height:34px;font-weight:900;font-size:1.08rem}.feedback.ok{color:var(--ok)}.feedback.bad{color:var(--bad)}
.connection{display:none;max-width:760px;margin:0 auto 18px;padding:18px;text-align:center;background:#fff8f1;border:1px solid #ffd4ac;border-radius:18px;
font-weight:900;color:var(--orange2);line-height:1.8;white-space:pre-line}
.connection.show{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.result,.ranking,.list{padding:clamp(24px,5vw,48px)}
.result h2,.ranking h2,.list h2{text-align:center;margin:0 0 18px;font-size:clamp(1.8rem,5vw,3rem)}
.bigscore{text-align:center;font-size:2rem;font-weight:900;margin-bottom:22px;color:var(--orange2)}
.review{max-width:760px;margin:0 auto 20px;background:#fffaf6;border:1px solid var(--line);border-radius:18px;padding:18px}
.row{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:9px}
.key{font-weight:900;color:var(--muted)}.val{font-weight:800;line-height:1.55;overflow-wrap:anywhere}
.entry{max-width:560px;margin:0 auto 18px;display:flex;gap:10px}.entry input{flex:1;min-width:0;padding:14px;border:1px solid var(--line);border-radius:14px}
.result-actions{max-width:700px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
table{width:100%;border-collapse:collapse;background:#fff}.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:var(--soft);color:var(--orange2)}
.tools{display:flex;gap:10px;margin-bottom:16px}.tools input{flex:1;padding:13px;border:1px solid var(--line);border-radius:14px}
.status{text-align:center;color:var(--muted);margin-top:14px}
@media(max-width:760px){.actions,.result-actions{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.option{min-height:76px}}
@media(max-width:520px){.wrap{width:calc(100% - 14px);padding-top:10px}.hero{padding:30px 16px}.row{grid-template-columns:1fr;gap:4px}.entry{flex-direction:column}}
</style>
</head>
<body>
<main class="wrap">
<header class="top">
  <div class="brand"><div class="logo">🍣</div><div>すしこぶ単</div></div>
  <a class="link" href="index.html">トップページに戻る</a>
</header>

<section id="home" class="screen active panel hero">
  <h1>すし<span>こぶ</span>単</h1>
  <p>古文を見て英語を選び、次に現代語を選ぼう。どちらかを一度でも間違えたらゲーム終了。</p>
  <div class="actions">
    <button class="btn primary" id="start">ゲームスタート</button>
    <button class="btn secondary" id="openRanking">ランキング</button>
    <button class="btn neutral" id="openList">古文単語一覧</button>
  </div>
  <details>
    <summary>このゲームについて</summary>
    <div class="about">古文単語・英語・現代語を三つ一組で覚える学習ゲームです。古文1語に対して英語4択、現代語4択の順に答えます。正解数がそのままスコアになります。</div>
  </details>
  <div id="dataStatus" class="status">データを読み込み中...</div>
</section>

<section id="game" class="screen panel game">
  <div class="gamehead">
    <div class="score">Score <strong id="score">0</strong></div>
    <div class="round"><div id="round">Round 1</div><div id="remain"></div></div>
  </div>
  <div class="prompt"><div class="label">古文</div><div id="kobun" class="word"></div></div>

  <section id="englishStage" class="stage">
    <h2>English</h2>
    <div id="englishOptions" class="grid"></div>
  </section>

  <section id="modernStage" class="stage hidden">
    <h2>現代語</h2>
    <div id="modernOptions" class="grid"></div>
  </section>

  <div id="connection" class="connection"></div>
  <div id="feedback" class="feedback"></div>
</section>

<section id="result" class="screen panel result">
  <h2>GAME OVER</h2>
  <div id="resultScore" class="bigscore"></div>
  <div class="review">
    <div class="row"><div class="key">古文</div><div id="rKobun" class="val"></div></div>
    <div class="row"><div class="key">英語</div><div id="rEnglish" class="val"></div></div>
    <div class="row"><div class="key">現代語</div><div id="rModern" class="val"></div></div>
    <div class="row"><div class="key">解説</div><div id="rExplain" class="val"></div></div>
  </div>
  <div class="entry"><input id="name" maxlength="20" placeholder="ランキング登録名"><button class="btn primary" id="save">ランキング登録</button></div>
  <div id="saveStatus" class="status"></div>
  <div class="result-actions">
    <button class="btn secondary" id="retry">もう一度</button>
    <button class="btn neutral" id="resultRanking">ランキングを見る</button>
    <button class="btn neutral" id="resultHome">スタート画面へ</button>
  </div>
</section>

<section id="ranking" class="screen panel ranking">
  <h2>ランキング</h2>
  <div id="rankingNote" class="status"></div>
  <div class="tablewrap"><table><thead><tr><th>順位</th><th>名前</th><th>スコア</th><th>日時</th></tr></thead><tbody id="rankingBody"></tbody></table></div>
  <div class="result-actions" style="margin-top:18px">
    <button class="btn primary" id="rankingStart">ゲームスタート</button>
    <button class="btn neutral" id="rankingHome">スタート画面へ</button>
  </div>
</section>

<section id="list" class="screen panel list">
  <h2>古文・英語・現代語 対応一覧</h2>
  <div class="tools"><input id="search" type="search" placeholder="古文・英語・現代語で検索"><button class="btn neutral" id="listHome">戻る</button></div>
  <div class="tablewrap"><table><thead><tr><th>No.</th><th>古文</th><th>英語</th><th>現代語</th></tr></thead><tbody id="listBody"></tbody></table></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const DATA_PATH="data/kobun_master_v2.json";
const SUPABASE_URL="";
const SUPABASE_ANON_KEY="";
const MODE="kobun_connect";
const CHOICES=4;

let db=null,words=[],pool=[],target=null,score=0,round=1,locked=false,wrongWord=null;

const $=id=>document.getElementById(id);
const screens={home:$("home"),game:$("game"),result:$("result"),ranking:$("ranking"),list:$("list")};

function show(name){Object.values(screens).forEach(x=>x.classList.remove("active"));screens[name].classList.add("active");window.scrollTo(0,0)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}

async function loadData(){
  try{
    const r=await fetch(DATA_PATH,{cache:"no-store"}); if(!r.ok) throw new Error("HTTP "+r.status);
    const j=await r.json(); words=j.words||[];
    if(words.length<CHOICES) throw new Error("単語数不足");
    $("dataStatus").textContent=words.length+"語を読み込みました。";
    renderList(words);
  }catch(e){console.error(e);$("dataStatus").textContent="data/kobun_master_v2.json を読み込めません。";$("start").disabled=true}
}
function initDb(){if(SUPABASE_URL&&SUPABASE_ANON_KEY&&window.supabase)db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}

function startGame(){
  if(words.length<CHOICES)return;
  score=0;round=1;pool=shuffle(words);wrongWord=null;$("score").textContent="0";show("game");next();
}
function next(){
  locked=false;
  if(!pool.length)pool=shuffle(words);
  target=pool.pop();
  $("kobun").textContent=target.kobun;
  $("round").textContent="Round "+round;
  $("remain").textContent="残り "+pool.length+"語";
  $("feedback").textContent="";$("feedback").className="feedback";
  $("connection").classList.remove("show");$("connection").textContent="";
  $("englishStage").classList.remove("hidden");$("modernStage").classList.add("hidden");
  renderChoices("english");
  renderChoices("modern");
}
function renderChoices(type){
  const ids=type==="english"?"englishOptions":"modernOptions";
  const opts=[target,...shuffle(words.filter(w=>w.id!==target.id)).slice(0,CHOICES-1)];
  const box=$(ids);box.innerHTML="";
  shuffle(opts).forEach(w=>{
    const b=document.createElement("button");b.className="option";b.type="button";
    b.textContent=type==="english"?w.english_display:w.modern_display;
    b.onclick=()=>choose(type,w,b);box.appendChild(b);
  });
}
function choose(type,w,button){
  if(locked)return;locked=true;
  if(w.id!==target.id){
    button.classList.add("wrong");wrongWord=target;
    $("feedback").textContent=(type==="english"?"英語":"現代語")+"が不正解。ゲーム終了！";
    $("feedback").className="feedback bad";
    setTimeout(endGame,650);return;
  }
  button.classList.add("correct");
  if(type==="english"){
    $("feedback").textContent="英語 正解！ 次は現代語。";$("feedback").className="feedback ok";
    setTimeout(()=>{$("englishStage").classList.add("hidden");$("modernStage").classList.remove("hidden");$("feedback").textContent="";$("feedback").className="feedback";locked=false},450);
  }else{
    score++;round++;$("score").textContent=score;
    $("connection").textContent=target.kobun+"\n↓\n"+target.english_display+"\n↓\n"+target.modern_display;
    $("connection").classList.add("show");
    $("feedback").textContent="正解！ 3つがつながりました。";$("feedback").className="feedback ok";
    setTimeout(next,850);
  }
}
function endGame(){
  const w=wrongWord||target;
  $("resultScore").textContent=score+"問正解！";
  $("rKobun").textContent=w.kobun;$("rEnglish").textContent=w.english_display;$("rModern").textContent=w.modern_display;
  $("rExplain").textContent=w.explanation||"解説は登録されていません。";
  $("saveStatus").textContent="";$("save").disabled=false;show("result");
}

function localRanks(){try{return JSON.parse(localStorage.getItem("sushikobutanRankingV2")||"[]")}catch{return[]}}
function saveLocal(e){const a=localRanks();a.push(e);a.sort((x,y)=>y.score-x.score||new Date(x.created_at)-new Date(y.created_at));localStorage.setItem("sushikobutanRankingV2",JSON.stringify(a.slice(0,100)))}
async function saveScore(){
  const n=$("name").value.trim();if(!n){$("saveStatus").textContent="名前を入力してください。";return}
  $("save").disabled=true;$("saveStatus").textContent="登録中...";
  const e={player_name:n,score,max_combo:score,accuracy:score/(score+1),mode:MODE,created_at:new Date().toISOString()};
  try{
    if(db){const {error}=await db.from("scores").insert([{player_name:n,score,max_combo:score,accuracy:e.accuracy,mode:MODE}]);if(error)throw error;$("saveStatus").textContent="ランキングに登録しました。"}
    else{saveLocal(e);$("saveStatus").textContent="この端末のランキングに登録しました。"}
  }catch(err){console.error(err);saveLocal(e);$("saveStatus").textContent="オンライン登録に失敗したため、この端末に保存しました。"}
}
async function openRanking(){
  show("ranking");$("rankingBody").innerHTML="";let a=[];
  try{
    if(db){const {data,error}=await db.from("scores").select("player_name,score,created_at").eq("mode",MODE).order("score",{ascending:false}).order("created_at",{ascending:true}).limit(50);if(error)throw error;a=data||[];$("rankingNote").textContent="オンラインランキング"}
    else{a=localRanks();$("rankingNote").textContent="この端末内のランキング"}
  }catch(e){a=localRanks();$("rankingNote").textContent="オンライン取得に失敗したため端末内ランキングを表示"}
  renderRanks(a);
}
function renderRanks(a){
  const b=$("rankingBody");b.innerHTML="";
  if(!a.length){b.innerHTML='<tr><td colspan="4">まだ記録がありません。</td></tr>';return}
  a.forEach((x,i)=>{const tr=document.createElement("tr");tr.innerHTML=`<td>${i+1}</td><td>${esc(x.player_name||"名無し")}</td><td><strong>${Number(x.score||0)}</strong></td><td>${x.created_at?new Date(x.created_at).toLocaleString("ja-JP"):"—"}</td>`;b.appendChild(tr)})
}
function renderList(a){
  const b=$("listBody");b.innerHTML="";
  a.forEach((w,i)=>{const tr=document.createElement("tr");tr.innerHTML=`<td>${i+1}</td><td><strong>${esc(w.kobun)}</strong></td><td>${esc(w.english_display)}</td><td>${esc(w.modern_display)}</td>`;b.appendChild(tr)})
}
function filterList(){
  const q=$("search").value.trim().toLowerCase();
  renderList(!q?words:words.filter(w=>(w.kobun+" "+w.english_display+" "+w.modern_display).toLowerCase().includes(q)))
}

$("start").onclick=startGame;$("retry").onclick=startGame;$("rankingStart").onclick=startGame;
$("openRanking").onclick=openRanking;$("resultRanking").onclick=openRanking;
$("openList").onclick=()=>show("list");
$("resultHome").onclick=$("rankingHome").onclick=$("listHome").onclick=()=>show("home");
$("save").onclick=saveScore;$("search").oninput=filterList;

initDb();loadData();
</script>
</body>
</html>
