<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ログボ診断（データ変更なし）</title><style>body{font-family:system-ui;max-width:700px;margin:35px auto;padding:20px;background:#fff9ef;color:#342c26}button{padding:14px 24px;border:0;border-radius:12px;background:#e85b20;color:white;font-weight:bold}pre{white-space:pre-wrap;background:white;border:1px solid #ddd;border-radius:12px;padding:18px;line-height:1.8}.ok{color:green}.ng{color:#c33}</style><h1>🍣 ログボ診断</h1><p>仮データだけで確認します。実際のジェム・ログイン履歴・同期情報は変更しません。</p><button id="run">テストを実行</button><pre id="out">実行待ち</pre><script>
const dayBefore=s=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()-1);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
function merge(local,remote){const o=structuredClone(remote);for(const k of ['loginManualClaims','dailyGemClaims','claimedMilestones'])o[k]=[...new Set([...(Array.isArray(local[k])?local[k]:[]),...(Array.isArray(o[k])?o[k]:[])])].slice(-400);for(const k of ['total','loginBonusTotal'])o[k]=Math.max(0,Number(local[k])||0,Number(o[k])||0);const ld=String(local.loginBonusLastDay||local.lastDay||''),rd=String(o.loginBonusLastDay||o.lastDay||'');if(ld>rd){for(const k of ['loginBonusLastDay','lastDay','streak','loginBonusStreak'])if(local[k]!==undefined)o[k]=local[k]}else if(ld===rd){for(const k of ['streak','loginBonusStreak'])o[k]=Math.max(0,Number(local[k])||0,Number(o[k])||0)}return o}
function claim(l,t){l=structuredClone(l);const claims=l.loginManualClaims||[],daily=l.dailyGemClaims||[];if(claims.includes(t)||daily.includes(t))return {ledger:l,earned:0};const last=l.loginBonusLastDay||l.lastDay||'';const streak=last===dayBefore(t)?Number(l.loginBonusStreak||l.streak||0)+1:1;const earned=10+(streak%7===0?100:0);l.loginBonusStreak=streak;l.loginBonusTotal=Number(l.loginBonusTotal||0)+1;l.loginBonusLastDay=t;l.loginManualClaims=[...new Set([...claims,t])];l.gems=Number(l.gems||0)+earned;return {ledger:l,earned}}
document.getElementById('run').onclick=()=>{const t='2026-10-09',y='2026-10-08';const a=merge({loginBonusStreak:4,loginBonusTotal:10,loginBonusLastDay:y,loginManualClaims:[y]},{loginBonusStreak:1,loginBonusTotal:8,loginBonusLastDay:y,loginManualClaims:[]});const b=merge({loginBonusStreak:4,loginBonusLastDay:y},{loginBonusStreak:1,loginBonusLastDay:'2026-10-07'});const c=claim({loginManualClaims:[t],gems:100},t);const d=claim({dailyGemClaims:[t],gems:100},t);const e=claim({loginBonusStreak:4,loginBonusLastDay:'2026-10-05',loginBonusTotal:8,gems:100},t);const f=claim({loginBonusStreak:4,loginBonusLastDay:y,loginBonusTotal:8,gems:100},t);const tests=[['同じ日：連続4日を保持',a.loginBonusStreak===4],['累計10日を保持',a.loginBonusTotal===10],['古いクラウド記録で連続日数を戻さない',b.loginBonusStreak===4],['受取済み：二重付与なし',c.earned===0&&c.ledger.gems===100],['旧受取履歴：二重付与なし',d.earned===0&&d.ledger.gems===100],['ログイン中断：1日にリセット',e.ledger.loginBonusStreak===1],['連続ログイン：5日に進む',f.ledger.loginBonusStreak===5],['正常受取：10ジェム',f.earned===10]];document.getElementById('out').textContent=tests.map(([n,ok])=>(ok?'✅ PASS':'❌ FAIL')+'  '+n).join('\n')+'\n\n'+tests.filter(x=>x[1]).length+'/'+tests.length+' PASS\n※現在の同期処理を模したテストです。実際のサーバー通信は行いません。'};</script></html>
